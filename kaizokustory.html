<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROUGE GALLEON - STORY MODE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #000;
      color: #fff;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
    }

    /* --- わくわくエフェクト (ホーム画面用) --- */
    .bg-scrolling {
      background-image: url('https://images.unsplash.com/photo-1544644181-1484b3f8c8b1?auto=format&fit=crop&w=800&q=80');
      background-size: 200%;
      animation: scrollBg 30s linear infinite;
    }
    @keyframes scrollBg {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-25deg);
      animation: shine 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    /* 星ドラ風 CTゲージ */
    .ct-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.1s linear;
    }
    .ct-glow {
      animation: pulse-glow 1s infinite alternate;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 5px #facc15, inset 0 0 5px #facc15; }
      100% { box-shadow: 0 0 15px #fef08a, inset 0 0 20px #fef08a; }
    }

    /* ダメージポップアップ */
    .dmg-popup {
      position: absolute;
      font-weight: 900;
      font-size: 2.2rem;
      text-shadow: 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000, 0 4px 8px rgba(0,0,0,0.8);
      animation: dmg-float 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      pointer-events: none;
      z-index: 50;
    }
    .dmg-heal { color: #4ade80; }
    .dmg-normal { color: #fff; }
    .dmg-crit { color: #facc15; font-size: 3rem; }
    .dmg-weak { color: #f87171; font-size: 2.8rem; }
    @keyframes dmg-float {
      0% { transform: translateY(0) scale(0.5) rotate(calc(var(--rot, 0) * 1deg)); opacity: 1; }
      20% { transform: translateY(-30px) scale(1.2) rotate(calc(var(--rot, 0) * 1deg)); opacity: 1; }
      100% { transform: translateY(-50px) scale(1) rotate(calc(var(--rot, 0) * 1deg)); opacity: 0; }
    }

    /* 敵のアニメーション */
    .enemy-idle { animation: enemy-bob 2s infinite ease-in-out; }
    @keyframes enemy-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .enemy-attack { animation: enemy-atk 0.3s ease-out; }
    @keyframes enemy-atk {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(30px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }
    .enemy-hurt { animation: enemy-shake 0.2s; filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(5); }
    @keyframes enemy-shake {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(-15px) translateY(-5px); }
      75% { transform: translateX(15px) translateY(5px); }
    }

    /* ブレイク（BREAK）状態 */
    .enemy-break {
      animation: break-shake 0.5s infinite;
      filter: brightness(0.8) sepia(0.5) hue-rotate(200deg);
    }
    @keyframes break-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }

    /* カットイン演出 */
    .cutin-container {
      position: absolute;
      top: 30%;
      left: 0;
      width: 100%;
      height: 100px;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.8) 20%, rgba(0, 0, 0, 0.8) 80%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: skewY(-5deg) translateX(-100%);
      z-index: 60;
      pointer-events: none;
    }
    .cutin-active {
      animation: cutin-anim 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes cutin-anim {
      0% { transform: skewY(-5deg) translateX(-100%); opacity: 0; }
      15% { transform: skewY(-5deg) translateX(0); opacity: 1; }
      85% { transform: skewY(-5deg) translateX(5%); opacity: 1; }
      100% { transform: skewY(-5deg) translateX(100%); opacity: 0; }
    }

    /* エフェクト */
    .slash-effect {
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: linear-gradient(transparent 45%, rgba(255,255,255,0.8) 50%, transparent 55%);
      transform: rotate(var(--rot, 45deg)) scale(0);
      animation: slash-anim 0.2s ease-out forwards;
      pointer-events: none;
      z-index: 40;
    }
    @keyframes slash-anim {
      0% { transform: rotate(var(--rot, 45deg)) scale(0); opacity: 1; filter: brightness(2); }
      100% { transform: rotate(var(--rot, 45deg)) scale(1.5); opacity: 0; }
    }
    .impact-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      margin-top: -50px;
      margin-left: -50px;
      background: radial-gradient(circle, #fff 0%, transparent 70%);
      animation: impact-anim 0.3s ease-out forwards;
      pointer-events: none;
      z-index: 41;
    }
    @keyframes impact-anim {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* ADVテキスト送り */
    .adv-text::after {
      content: '▼';
      position: absolute;
      bottom: 10px;
      right: 15px;
      animation: blink 1s infinite;
      color: #facc15;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .btn-push {
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }
    .btn-push:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 rgba(0,0,0,0.5);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center items-center h-screen w-screen bg-slate-900">

  <div id="game-container" class="relative w-full h-full max-w-md bg-slate-800 shadow-2xl overflow-hidden border-x border-slate-700">

    <!-- ==================== TITLE SCREEN ==================== -->
    <div id="screen-title" class="screen active bg-[url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80')] bg-cover bg-center">
      <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
      <div class="relative z-10 flex flex-col items-center justify-center h-full p-6">
        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 via-yellow-400 to-amber-600 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] text-center mb-2 animate-pulse">
          ROUGE GALLEON

        <h2 class="text-lg font-bold text-yellow-200 tracking-widest drop-shadow-md mb-12 bg-black/40 px-4 py-1 rounded-full border border-yellow-500/30">〜 ストーリーモード 〜</h2>

        <button onclick="startGame()" class="btn-push btn-shine bg-gradient-to-b from-blue-400 to-blue-700 border-2 border-white text-white font-black py-4 px-10 rounded-full text-2xl w-full max-w-xs mb-6 shadow-[0_0_20px_rgba(59,130,246,0.8)]">

        <button onclick="resetData()" class="text-slate-400 text-xs underline mt-8 hover:text-white transition-colors">セーブデータリセット</button>
      </div>
    </div>

    <!-- ==================== HOME (QUEST SELECT) ==================== -->
    <div id="screen-home" class="screen bg-slate-900">
      <!-- ヘッダー -->
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-2 flex justify-between items-center border-b-2 border-slate-600 shadow-lg z-20">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-xl border-2 border-white shadow-inner">👤</div>
          <div>
            <div class="text-[10px] text-yellow-300 font-bold leading-none tracking-wider">CAPTAIN</div>

        </div>

          <div class="flex items-center gap-1">
            <span class="inline-flex relative w-4 h-4"><img src="草コイン.png" onerror="this.outerHTML='💰'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-coins" class="text-yellow-400">0</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="inline-flex relative w-4 h-4"><img src="草の化石.png" onerror="this.outerHTML='🦴'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-materials" class="text-indigo-300">0</span>

            <span class="inline-flex relative w-4 h-4"><img src="草核.png" onerror="this.outerHTML='✨'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-stones" class="text-pink-400">0</span>
          </div>

      </div>

      <!-- クエストリスト -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-4 relative bg-scrolling">
        <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-[2px]"></div>
        
        <div class="relative z-10">
          
          <!-- kaizoku.html への移動ボタン -->
          <button onclick="location.href='kaizoku.html'" class="btn-push btn-shine w-full bg-gradient-to-b from-emerald-400 to-green-700 border-2 border-white text-white font-black py-3 px-6 rounded-xl text-lg mb-6 shadow-[0_0_15px_rgba(16,185,129,0.6)] flex items-center justify-center gap-2">
            <span class="text-2xl drop-shadow-md">⚓</span>
            <span class="drop-shadow-md tracking-widest">本編（出航）へ戻る</span>
          </button>

          <h3 class="text-center font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-amber-500 text-2xl mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">冒険の航路</h3>
          <div class="w-24 h-1 bg-yellow-500/50 mx-auto rounded-full mb-4"></div>

          <div id="quest-list" class="flex flex-col gap-3 pb-8">
            <!-- JSで動的生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== ADV SCREEN ==================== -->
    <div id="screen-adv" class="screen bg-slate-900">
      <div id="adv-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-500"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/50 to-transparent"></div>
      
      <!-- 立ち絵エリア -->
      <div class="absolute bottom-[30%] w-full h-[60%] flex items-end justify-center pointer-events-none">
        <div id="adv-char-img" class="text-[12rem] filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] transition-transform duration-300 transform translate-y-10 opacity-0">🏴‍☠️</div>
      </div>

      <!-- テキストボックス -->
      <div class="absolute bottom-0 w-full p-4 z-20">
        <div class="bg-slate-900/90 border-2 border-slate-500 rounded-xl p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.5)] relative min-h-[140px] cursor-pointer" onclick="nextAdv()">
          <div id="adv-speaker" class="absolute -top-4 left-4 bg-gradient-to-r from-blue-600 to-indigo-600 border-2 border-white px-4 py-1 rounded-full text-sm font-black shadow-md drop-shadow-md">
            話者
          </div>
          <p id="adv-text" class="text-white font-bold leading-relaxed mt-2 text-sm whitespace-pre-wrap adv-text"></p>
        </div>
      </div>
    </div>

    <!-- ==================== BATTLE SCREEN ==================== -->
    <div id="screen-battle" class="screen bg-black">
      
      <!-- 上部：フィールドビュー -->
      <div class="relative h-[55%] w-full bg-[url('https://images.unsplash.com/photo-1505159940484-eb2b9f2588e2?auto=format&fit=crop&w=800&q=80')] bg-cover bg-bottom border-b-4 border-slate-700 overflow-hidden" id="battle-field">
        <div class="absolute inset-0 bg-blue-900/40"></div>
        
        <!-- コンボ・システムメッセージ表示部 -->
        <div class="absolute top-20 left-4 z-30">
          <div id="combo-display" class="hidden font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 to-yellow-500 drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)] italic">
            <span id="combo-count" class="text-5xl">2</span><span class="text-2xl ml-1">CHAIN!!</span>
            <div id="combo-bonus" class="text-xs text-yellow-300 mt-1">ダメージ +10%</div>
          </div>
        </div>

        <div class="absolute top-20 right-4 z-30">
          <div id="break-display" class="hidden text-red-500 font-black text-4xl italic drop-shadow-[0_0_10px_rgba(255,0,0,0.8)] animate-pulse">
            BREAK!
          </div>
        </div>
        
        <!-- 敵エリア -->
        <div class="absolute inset-0 flex flex-col items-center justify-center pb-8" id="enemy-container">
          <div id="enemy-sprite" class="text-[8rem] filter drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] enemy-idle relative">
            💀
            <div id="enemy-action-indicator" class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-red-600 border border-white text-white text-[10px] font-bold px-2 py-0.5 rounded-full opacity-0 transition-opacity whitespace-nowrap shadow-md">攻撃準備!</div>
          </div>
        </div>

        <!-- スキルカットイン -->
        <div id="skill-cutin" class="cutin-container">
          <div class="flex items-center gap-4 px-8">
            <span id="cutin-icon" class="text-6xl drop-shadow-md">🧑</span>
            <span id="cutin-name" class="text-3xl font-black text-white italic drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">スキル名</span>
          </div>
        </div>

        <!-- 敵HP/シールドバー -->
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-3/4 max-w-[300px] z-20">
          <div class="flex justify-between items-end mb-1 text-white font-black drop-shadow-md">
            <span id="enemy-name" class="text-sm">敵の名前</span>
            <span class="text-xs bg-slate-900/80 px-1.5 py-0.5 rounded border border-slate-600">Lv <span id="enemy-lv">1</span></span>
          </div>
          <!-- HPバー -->
          <div class="w-full bg-slate-900 h-3 rounded-t-lg border-x-2 border-t-2 border-slate-600 overflow-hidden relative shadow-inner">
            <div id="enemy-hp-bar" class="bg-gradient-to-r from-red-500 to-orange-500 h-full w-full transition-all duration-300"></div>
          </div>
          <!-- シールドバー (BREAK用) -->
          <div class="w-full bg-slate-900 h-1.5 rounded-b-lg border-x-2 border-b-2 border-slate-600 overflow-hidden relative shadow-inner">
            <div id="enemy-shield-bar" class="bg-gradient-to-r from-blue-300 to-cyan-300 h-full w-full transition-all duration-200"></div>
          </div>
        </div>

        <div class="absolute top-4 right-4 bg-slate-900/80 border border-slate-500 px-2 py-1 rounded text-[10px] font-black text-yellow-300 z-20 shadow-md">
          BATTLE
        </div>
      </div>

      <!-- 下部：キャラパネル (4人分) -->
      <div class="relative h-[45%] w-full bg-slate-800 flex flex-col">
        <!-- 枠飾り -->
        <div class="w-full h-2 bg-gradient-to-r from-slate-600 via-slate-400 to-slate-600"></div>
        
        <div class="flex-1 grid grid-cols-4 gap-1 p-1" id="party-container">
          <!-- キャラパネルはJSで生成 -->
        </div>

        <!-- コントロール部 -->
        <div class="h-12 bg-slate-900 flex justify-between items-center px-4 border-t border-slate-700 shadow-[0_-5px_10px_rgba(0,0,0,0.5)]">
          <button class="bg-slate-700 border-2 border-slate-500 text-slate-400 text-xs font-bold px-4 py-1.5 rounded-full btn-push opacity-50 cursor-not-allowed">
            どうぐ
          </button>
          <div class="flex gap-2">
            <button onclick="toggleAutoBattle()" id="btn-auto" class="bg-slate-700 border-2 border-slate-500 text-white text-xs font-bold px-6 py-1.5 rounded-full btn-push transition-colors shadow-md">
              オート
            </button>
          </div>
        </div>
      </div>
      
      <!-- バトルリザルトオーバーレイ -->
      <div id="battle-result" class="absolute inset-0 bg-black/80 hidden flex-col items-center justify-center z-50 backdrop-blur-sm">
        <h2 id="result-title" class="text-6xl font-black text-yellow-400 mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,1)] animate-bounce">WIN!</h2>
        <div class="bg-slate-800 border-2 border-yellow-500 rounded-xl p-6 w-3/4 max-w-[300px] text-center mb-8 shadow-2xl">
          <p class="text-sm text-indigo-300 font-bold mb-3 border-b border-slate-600 pb-1">獲得報酬</p>
          <div class="flex flex-col gap-3 text-xl font-black text-white">
            <div class="bg-slate-900 py-2.5 rounded-lg border border-slate-700 flex justify-center items-center gap-2 shadow-inner">
              <span class="inline-flex relative w-6 h-6"><img src="草コイン.png" onerror="this.outerHTML='💰'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
              <span id="result-coins" class="text-yellow-400">0</span>
            </div>
            <div class="bg-slate-900 py-2.5 rounded-lg border border-slate-700 flex justify-center items-center gap-2 shadow-inner">
              <span class="text-blue-300 text-sm drop-shadow-md">EXP</span><span id="result-exp" class="text-white drop-shadow-md">0</span>
            </div>
          </div>
        </div>
        <button onclick="endBattle()" class="btn-push btn-shine bg-gradient-to-b from-blue-500 to-blue-700 border-2 border-white text-white font-black py-4 px-12 rounded-full text-xl shadow-[0_0_15px_rgba(59,130,246,0.8)]">
          次へすすむ
        </button>
      </div>

    </div>

  </div>

<script>
// ==========================================
// データベース・セーブシステム
// ==========================================
const DEFAULT_SAVE = {
  playerName: "キャプテン",
  job: "海賊",
  level: 1,
  exp: 0,
  hp: 100,
  mp: 20,
  coins: 50000,
  stones: 1000,
  materials: 20,
  currentChapter: 1,
  currentStage: 1,
  equipped: {},
  inventory: [],
  questFlags: {} // stage_X_Y_cleared
};

let saveData = {};

function loadData() {
  const saved = localStorage.getItem('sugoigame');
  if (saved) {
    try {
      saveData = { ...DEFAULT_SAVE, ...JSON.parse(saved) };
      // questFlagsの初期化漏れ対策
      if(!saveData.questFlags) saveData.questFlags = {};
    } catch (e) {
      saveData = JSON.parse(JSON.stringify(DEFAULT_SAVE));
    }
  } else {
    saveData = JSON.parse(JSON.stringify(DEFAULT_SAVE));
  }
}

function saveGame() {
  localStorage.setItem('sugoigame', JSON.stringify(saveData));
}

function resetData() {
  if(confirm('本当にデータをリセットしますか？')) {
    localStorage.removeItem('sugoigame');
    loadData();
    updateHomeUI();
    alert('リセットしました。');
  }
}

// ==========================================
// ストーリー＆クエストデータ定義（第1章〜第4章）
// ==========================================
const STORY_DATA = [
  // ----------- 第1章 -----------
  {
    id: 101, chapter: 1, chapterTitle: "第1章：霧を裂く羅針盤", title: "1-1：漆黒の船と見習いの少年",
    flagKey: "stage_1_1_cleared", reqFlag: null,
    bg: "https://images.unsplash.com/photo-1518331647614-7a1f04cd34cb?auto=format&fit=crop&w=800&q=80",
    advPre: [
      { speaker: "ブルータス", icon: "🏴‍☠️", text: "いいか、小僧。海に地図なんてねぇ。だがな、あの漆黒の空に輝く星々……あれが俺たちの羅針盤だ。" },
      { speaker: "ブルータス", icon: "🏴‍☠️", text: "お前がどこから来た誰かなんて、海賊の俺にゃあ関係ねぇ。自分で舵を握り、お前の信じた面舵を切るんだ。お前は立派な、俺たちの仲間だ" },
      { speaker: "トマス", icon: "💣", text: "湿気た火薬を一瞬で乾燥させるなんて、相変わらず手品みたいに便利な手をしてやがるな！ 早く一人前の海賊になれよ！" },
      { speaker: "シルビア", icon: "💉", text: "完璧な配合よ。雑用にしておくにはもったいない技術ね。" },
      { speaker: "レオン", icon: "🗡️", text: "お前がいつか見習いを卒業して、いい海賊になる日を楽しみにしてるよ。" }

// ==========================================
// 画面遷移マネージャー
// ==========================================
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const targetScreen = document.getElementById(id);
  if(targetScreen) {
    targetScreen.classList.add('active');
  }
}

function startGame() {
  loadData();
  updateHomeUI();
  switchScreen('screen-home');
}

function updateHomeUI() {
  const elPlayerName = document.getElementById('ui-player-name');
  if(elPlayerName) elPlayerName.innerText = saveData.playerName;
  
  const elCoins = document.getElementById('ui-coins');
  if(elCoins) elCoins.innerText = saveData.coins.toLocaleString();
  
  const elMaterials = document.getElementById('ui-materials');
  if(elMaterials) elMaterials.innerText = saveData.materials.toLocaleString();
  
  const elStones = document.getElementById('ui-stones');
  if(elStones) elStones.innerText = saveData.stones.toLocaleString();

  const list = document.getElementById('quest-list');
  if(!list) return;
  list.innerHTML = '';

  let currentChapter = 0;

  STORY_DATA.forEach(q => {
    if (q.chapter !== currentChapter) {
      currentChapter = q.chapter;
      const header = document.createElement('h4');
      header.className = "text-center font-black text-yellow-400 text-lg mt-4 mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] border-b border-yellow-500/50 pb-1";
      header.innerText = q.chapterTitle;
      list.appendChild(header);
    }

    const isUnlocked = !q.reqFlag || saveData.questFlags[q.reqFlag];
    const isCleared = saveData.questFlags[q.flagKey];
    
    const btn = document.createElement('button');
    // ホーム画面のボタンを豪華にするクラス設定
    const baseClass = "w-full text-left p-4 rounded-2xl border-2 flex justify-between items-center transition-all duration-300 active:scale-95 relative overflow-hidden";
    const unlockClass = isUnlocked ? 'bg-gradient-to-r from-slate-800 to-indigo-900 border-indigo-500 hover:border-yellow-400 shadow-[0_4px_15px_rgba(0,0,0,0.5)]' : 'bg-slate-900 border-slate-700 opacity-60 cursor-not-allowed';
    // キラッと光るエフェクトの追加
    const shineClass = isUnlocked && !isCleared ? 'btn-shine' : '';
    
    btn.className = `${baseClass} ${unlockClass} ${shineClass}`;
    
    btn.innerHTML = `
      <div class="z-10 pointer-events-none">
        <div class="text-[10px] font-black ${isCleared ? 'text-green-400' : 'text-yellow-400'} mb-1 drop-shadow-md">${isCleared ? 'CLEAR!' : '★ NEW'}</div>
        <div class="font-black text-white text-base drop-shadow-md">${q.title}</div>
      </div>
      <div class="text-3xl z-10 pointer-events-none drop-shadow-md">${isUnlocked ? (isCleared ? '🌟' : '⚔️') : '🔒'}</div>
    `;

    if (isUnlocked) {
      btn.onclick = () => startQuest(q.id);
    }
    
    list.appendChild(btn);
  });
}

// ==========================================
// ADV / BATTLE コントローラー
// ==========================================
let currentQuest = null;
let advPhase = 'pre'; // 'pre' or 'post'
let advIndex = 0;

function startQuest(id) {
  currentQuest = STORY_DATA.find(q => q.id === id);
  advPhase = 'pre';
  advIndex = 0;
  
  const advBg = document.getElementById('adv-bg');
  if(advBg) advBg.style.backgroundImage = `url('${currentQuest.bg}')`;
  
  switchScreen('screen-adv');
  showAdvText();
}

function showAdvText() {
  const data = advPhase === 'pre' ? currentQuest.advPre : currentQuest.advPost;
  if (advIndex >= data.length) {
    if (advPhase === 'pre') {
      initBattle();
    } else {
      finishQuest();
    }
    return;
  }

  const line = data[advIndex];
  
  const advSpeaker = document.getElementById('adv-speaker');
  if(advSpeaker) advSpeaker.innerText = line.speaker;
  
  const charImg = document.getElementById('adv-char-img');
  if(charImg) {
    charImg.innerText = line.icon;
    charImg.style.transform = 'translateY(10px)';
    charImg.style.opacity = '0';
    setTimeout(() => {
      charImg.style.transform = 'translateY(0)';
      charImg.style.opacity = '1';
    }, 50);
  }

  const textEl = document.getElementById('adv-text');
  if(textEl) {
    textEl.innerText = "";
    let charIdx = 0;
    clearInterval(window.advTypeInterval);
    window.advTypeInterval = setInterval(() => {
      if (charIdx < line.text.length) {
        textEl.innerText += line.text.charAt(charIdx);
        charIdx++;
      } else {
        clearInterval(window.advTypeInterval);
      }
    }, 20);
  }
}

function nextAdv() {
  clearInterval(window.advTypeInterval);
  const data = advPhase === 'pre' ? currentQuest.advPre : currentQuest.advPost;
  if (advIndex < data.length) {
    const textEl = document.getElementById('adv-text');
    if (textEl && textEl.innerText.length < data[advIndex].text.length) {
      textEl.innerText = data[advIndex].text;
    } else {
      advIndex++;
      showAdvText();
    }
  }
}

function finishQuest() {
  saveData.questFlags[currentQuest.flagKey] = true;
  saveData.coins += currentQuest.battle.coins;
  saveData.exp += currentQuest.battle.exp;
  saveGame();
  
  updateHomeUI();
  switchScreen('screen-home');
}

// ==========================================
// BATTLE エンジン (コンボ・ブレイクシステム搭載)
// ==========================================
let battleState = {
  active: false,
  auto: false,
  enemy: { hp: 0, maxHp: 0, shield: 0, maxShield: 0, isBroken: false, ct: 0, data: null },
  party: [],
  combo: { count: 0, timer: 0 },
  lastTime: 0
};

function initBattle() {
  switchScreen('screen-battle');
  const battleResult = document.getElementById('battle-result');
  if(battleResult) battleResult.style.display = 'none';
  
  const bData = currentQuest.battle;
  battleState.enemy = {
    hp: bData.enemyHp,
    maxHp: bData.enemyHp,
    shield: bData.shield || Math.floor(bData.enemyHp * 0.3),
    maxShield: bData.shield || Math.floor(bData.enemyHp * 0.3),
    isBroken: false,
    ct: 0,
    data: bData
  };
  battleState.combo = { count: 0, timer: 0 };
  
  const enemyName = document.getElementById('enemy-name');
  if(enemyName) enemyName.innerText = bData.enemyName;
  const enemySprite = document.getElementById('enemy-sprite');
  if(enemySprite) {
    enemySprite.innerText = bData.enemyIcon;
    enemySprite.classList.remove('enemy-break');
  }
  
  hideComboDisplay();
  hideBreakDisplay();
  updateEnemyHpUI();

  battleState.party = PARTY_DATA.map(p => ({ ...p, hp: p.maxHp, ct: 0 }));
  renderPartyUI();
  
  battleState.active = true;
  battleState.auto = false;
  const btnAuto = document.getElementById('btn-auto');
  if(btnAuto) {
    btnAuto.classList.remove('bg-yellow-500', 'text-black');
    btnAuto.classList.add('bg-slate-700');
  }
  
  battleState.lastTime = performance.now();
  requestAnimationFrame(battleLoop);
}

function renderPartyUI() {
  const container = document.getElementById('party-container');
  if(!container) return;
  container.innerHTML = '';

  battleState.party.forEach((p, i) => {
    const panel = document.createElement('div');
    panel.className = "bg-slate-700 border-2 border-slate-500 rounded-lg flex flex-col items-center p-1 relative overflow-hidden shadow-inner";
    
    panel.innerHTML = `
      <div class="w-full text-center z-10 mb-1">
        <div class="text-[9px] font-black text-white drop-shadow truncate">${p.name}</div>
        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-600 mt-0.5">
          <div id="hp-bar-${i}" class="bg-green-500 h-full w-full transition-all"></div>
        </div>
      </div>
      <div class="text-3xl filter drop-shadow-md z-10 my-auto mb-2">${p.icon}</div>
      
      <div class="relative w-12 h-12 z-10 mt-auto cursor-pointer btn-push" onclick="useSkill(${i})" id="skill-btn-${i}">
        <div class="absolute inset-0 ${p.sBg} rounded-full border-2 ${p.sColor} opacity-50 shadow-inner"></div>
        <svg class="absolute inset-0 w-full h-full ct-ring" viewBox="0 0 36 36">
          <path class="text-slate-900/50" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="ct-path-${i}" stroke-width="4" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--tw-colors-yellow-400') || '#facc15'}" stroke-dasharray="100, 100" stroke-dashoffset="100" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div class="absolute inset-0 flex items-center justify-center text-xl filter drop-shadow-md">${p.sIcon}</div>
        <div class="absolute -bottom-2 w-[120%] -ml-[10%] bg-slate-900/80 border border-slate-500 text-[8px] font-bold text-center rounded-full truncate px-1 text-white">${p.skill}</div>
      </div>
      <div id="dead-overlay-${i}" class="absolute inset-0 bg-red-900/80 z-20 hidden flex-col items-center justify-center"><span class="text-2xl">💀</span></div>
    `;
    container.appendChild(panel);
  });
}

function updateEnemyHpUI() {
  const hpPct = Math.max(0, (battleState.enemy.hp / battleState.enemy.maxHp) * 100);
  const hpBar = document.getElementById('enemy-hp-bar');
  if(hpBar) hpBar.style.width = `${hpPct}%`;

  const shieldPct = Math.max(0, (battleState.enemy.shield / battleState.enemy.maxShield) * 100);
  const shieldBar = document.getElementById('enemy-shield-bar');
  if(shieldBar) {
    shieldBar.style.width = `${shieldPct}%`;
    if(battleState.enemy.isBroken) {
      shieldBar.classList.remove('from-blue-300', 'to-cyan-300');
      shieldBar.classList.add('from-red-500', 'to-red-700');
    } else {
      shieldBar.classList.add('from-blue-300', 'to-cyan-300');
      shieldBar.classList.remove('from-red-500', 'to-red-700');
    }
  }
}

function battleLoop(time) {
  if (!battleState.active) return;
  const dt = (time - battleState.lastTime) / 1000;
  battleState.lastTime = time;

  // コンボタイマーの減少
  if (battleState.combo.count > 0) {
    battleState.combo.timer -= dt;
    if (battleState.combo.timer <= 0) {
      battleState.combo.count = 0;
      hideComboDisplay();
    }
  }

  // ブレイク復帰処理（シールドが徐々に回復）
  if (battleState.enemy.isBroken) {
    battleState.enemy.shield += (battleState.enemy.maxShield * 0.1) * dt; // 10秒で復帰
    if (battleState.enemy.shield >= battleState.enemy.maxShield) {
      battleState.enemy.shield = battleState.enemy.maxShield;
      battleState.enemy.isBroken = false;
      const sprite = document.getElementById('enemy-sprite');
      if(sprite) sprite.classList.remove('enemy-break');
      hideBreakDisplay();
    }
    updateEnemyHpUI();
  }

  // パーティCT進行
  battleState.party.forEach((p, i) => {
    if (p.hp > 0 && p.ct < 100) {
      p.ct += 20 * p.ctSpeed * dt;
      if (p.ct >= 100) {
        p.ct = 100;
        const skillBtn = document.getElementById(`skill-btn-${i}`);
        if(skillBtn) skillBtn.classList.add('ct-glow');
        if (battleState.auto) {
          setTimeout(() => useSkill(i), Math.random() * 500);
        }
      }
      const ctPath = document.getElementById(`ct-path-${i}`);
      if(ctPath) ctPath.style.strokeDashoffset = 100 - p.ct;
    }
  });

  // 敵CT進行 (ブレイク中は進行しない)
  if (battleState.enemy.hp > 0 && !battleState.enemy.isBroken) {
    battleState.enemy.ct += 15 * battleState.enemy.data.enemyCtSpeed * dt;
    const actionInd = document.getElementById('enemy-action-indicator');
    if (battleState.enemy.ct > 80 && actionInd) {
      actionInd.style.opacity = '1';
    }
    if (battleState.enemy.ct >= 100) {
      enemyAttack();
    }
  }

  if (battleState.active) {
    requestAnimationFrame(battleLoop);
  }
}

async function useSkill(index) {
  const p = battleState.party[index];
  if (p.hp <= 0 || p.ct < 100 || !battleState.active) return;

  // CTリセット
  p.ct = 0;
  const skillBtn = document.getElementById(`skill-btn-${index}`);
  if(skillBtn) skillBtn.classList.remove('ct-glow');
  const ctPath = document.getElementById(`ct-path-${index}`);
  if(ctPath) ctPath.style.strokeDashoffset = 100;

  // カットイン演出
  showSkillCutin(p.icon, p.skill);

  if (p.sPower < 0) {
    // 回復スキル
    executeHeal(p, index);
  } else {
    // 攻撃スキル（多段ヒット対応）
    const hits = p.hits || 1;
    for (let h = 0; h < hits; h++) {
      if(battleState.enemy.hp <= 0) break; // 途中で倒れたら止める
      
      setTimeout(() => {
        executeDamage(p);
      }, h * 200 + 300); // カットインのディレイ(300ms)＋ヒット間隔(200ms)
    }
  }
}

function showSkillCutin(icon, name) {
  const cutin = document.getElementById('skill-cutin');
  const iconEl = document.getElementById('cutin-icon');
  const nameEl = document.getElementById('cutin-name');
  if(!cutin || !iconEl || !nameEl) return;

  iconEl.innerText = icon;
  nameEl.innerText = name;
  
  cutin.classList.remove('cutin-active');
  void cutin.offsetWidth; // リフロー
  cutin.classList.add('cutin-active');
}

function executeHeal(p, index) {
  setTimeout(() => {
    const heal = Math.floor(p.atk * Math.abs(p.sPower) * 0.5);
    createImpactEffect(false);
    battleState.party.forEach((member, i) => {
      if (member.hp > 0) {
        member.hp = Math.min(member.maxHp, member.hp + heal);
        const hpBar = document.getElementById(`hp-bar-${i}`);
        if(hpBar) hpBar.style.width = `${(member.hp / member.maxHp) * 100}%`;
        showDamagePopup(heal, false, true, i);
      }
    });
  }, 300);
}

function executeDamage(p) {
  if(battleState.enemy.hp <= 0) return;

  createSlashEffect();
  
  // コンボ加算
  battleState.combo.count++;
  battleState.combo.timer = 4.0; // 4秒持続
  updateComboDisplay();

  // ダメージ計算
  let comboMultiplier = 1.0 + (battleState.combo.count - 1) * 0.1; // 1コンボにつき+10%
  let breakMultiplier = battleState.enemy.isBroken ? 2.0 : 1.0; // ブレイク中は2倍
  
  let baseDmg = (p.atk * p.sPower) / (p.hits || 1); // 1ヒットあたりの威力
  let dmg = Math.floor(baseDmg * comboMultiplier * breakMultiplier * (0.9 + Math.random() * 0.2));
  
  const isCrit = Math.random() < 0.15;
  if (isCrit) dmg = Math.floor(dmg * 1.5);

  battleState.enemy.hp -= dmg;
  
  // シールド削り（ブレイクしてない時のみ）
  if (!battleState.enemy.isBroken) {
    const shieldDmg = Math.floor(dmg * 0.3); // ダメージの3割削る
    battleState.enemy.shield -= shieldDmg;
    if (battleState.enemy.shield <= 0) {
      triggerBreak();
    }
  }

  showDamagePopup(dmg, isCrit, false);
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite && !battleState.enemy.isBroken) {
    sprite.classList.remove('enemy-idle');
    sprite.classList.add('enemy-hurt');
    setTimeout(() => {
      sprite.classList.remove('enemy-hurt');
      sprite.classList.add('enemy-idle');
    }, 200);
  }

  updateEnemyHpUI();

  if (battleState.enemy.hp <= 0) {
    winBattle();
  }
}

function triggerBreak() {
  battleState.enemy.isBroken = true;
  battleState.enemy.shield = 0;
  battleState.enemy.ct = 0; // 行動キャンセル
  
  const actionInd = document.getElementById('enemy-action-indicator');
  if(actionInd) actionInd.style.opacity = '0';
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite) sprite.classList.add('enemy-break');
  
  const breakDisplay = document.getElementById('break-display');
  if(breakDisplay) breakDisplay.classList.remove('hidden');
  
  // 画面揺らし大
  const container = document.getElementById('game-container');
  if(container) {
    container.style.transform = 'translate(10px, 10px)';
    setTimeout(() => container.style.transform = 'translate(-10px, -10px)', 50);
    setTimeout(() => container.style.transform = 'translate(10px, -5px)', 100);
    setTimeout(() => container.style.transform = 'translate(0, 0)', 150);
  }
}

function updateComboDisplay() {
  const display = document.getElementById('combo-display');
  const count = document.getElementById('combo-count');
  const bonus = document.getElementById('combo-bonus');
  if(!display || !count || !bonus) return;

  if (battleState.combo.count >= 2) {
    display.classList.remove('hidden');
    count.innerText = battleState.combo.count;
    bonus.innerText = `ダメージ +${(battleState.combo.count - 1) * 10}%`;
    
    // アニメーション再トリガー
    display.style.transform = 'scale(1.2)';
    setTimeout(() => display.style.transform = 'scale(1)', 100);
  }
}
function hideComboDisplay() {
  const display = document.getElementById('combo-display');
  if(display) display.classList.add('hidden');
}
function hideBreakDisplay() {
  const display = document.getElementById('break-display');
  if(display) display.classList.add('hidden');
}

function enemyAttack() {
  battleState.enemy.ct = 0;
  const actionInd = document.getElementById('enemy-action-indicator');
  if(actionInd) actionInd.style.opacity = '0';

  const sprite = document.getElementById('enemy-sprite');
  if(sprite) {
    sprite.classList.remove('enemy-idle');
    sprite.classList.add('enemy-attack');
    setTimeout(() => {
      if(!battleState.enemy.isBroken) sprite.classList.add('enemy-idle');
      sprite.classList.remove('enemy-attack');
    }, 300);
  }

  const alive = battleState.party.map((p, i) => ({...p, i})).filter(p => p.hp > 0);
  if (alive.length === 0) return;

  const target = alive[Math.floor(Math.random() * alive.length)];
  const dmg = Math.floor(battleState.enemy.data.enemyAtk * (0.8 + Math.random() * 0.4));
  
  battleState.party[target.i].hp -= dmg;
  const pct = Math.max(0, (battleState.party[target.i].hp / target.maxHp) * 100);
  const hpBar = document.getElementById(`hp-bar-${target.i}`);
  if(hpBar) hpBar.style.width = `${pct}%`;

  createImpactEffect(true, target.i);

  const container = document.getElementById('game-container');
  if(container) {
    container.style.transform = 'translate(5px, 5px)';
    setTimeout(() => container.style.transform = 'translate(0, 0)', 50);
  }

  if (battleState.party[target.i].hp <= 0) {
    const deadOverlay = document.getElementById(`dead-overlay-${target.i}`);
    if(deadOverlay) {
      deadOverlay.classList.remove('hidden');
      deadOverlay.classList.add('flex');
    }
    if (battleState.party.every(p => p.hp <= 0)) {
      loseBattle();
    }
  }
}

function createSlashEffect() {
  const e = document.createElement('div');
  e.className = 'slash-effect';
  e.style.setProperty('--rot', `${Math.random() * 360}deg`);
  const container = document.getElementById('enemy-container');
  if(container) {
    container.appendChild(e);
    setTimeout(() => e.remove(), 200);
  }
}

function createImpactEffect(isEnemyAtk, partyIndex = -1) {
  const e = document.createElement('div');
  e.className = 'impact-effect';
  if (isEnemyAtk && partyIndex >= 0) {
    e.style.top = '80%';
    e.style.left = `${12 + partyIndex * 25}%`;
    const screen = document.getElementById('screen-battle');
    if(screen) screen.appendChild(e);
  } else {
    const field = document.getElementById('battle-field');
    if(field) field.appendChild(e);
  }
  setTimeout(() => e.remove(), 300);
}

function showDamagePopup(amount, isCrit, isHeal, partyIndex = -1) {
  const p = document.createElement('div');
  p.innerText = amount;
  
  let styleClass = 'dmg-normal';
  if (isHeal) styleClass = 'dmg-heal';
  else if (isCrit) styleClass = 'dmg-crit';
  else if (battleState.enemy.isBroken && !isHeal && partyIndex === -1) styleClass = 'dmg-weak'; // ブレイク中のダメージは赤字
  
  p.className = `dmg-popup ${styleClass}`;
  p.style.setProperty('--rot', `${(Math.random() - 0.5) * 20}`);
  
  if (partyIndex >= 0) {
    p.style.bottom = '25%';
    p.style.left = `${5 + partyIndex * 25}%`;
    const screenBattle = document.getElementById('screen-battle');
    if(screenBattle) screenBattle.appendChild(p);
  } else {
    p.style.top = `${30 + (Math.random() - 0.5) * 20}%`;
    p.style.left = `${40 + (Math.random() - 0.5) * 20}%`;
    const battleField = document.getElementById('battle-field');
    if(battleField) battleField.appendChild(p);
  }
  
  setTimeout(() => p.remove(), 800);
}

function toggleAutoBattle() {
  battleState.auto = !battleState.auto;
  const btn = document.getElementById('btn-auto');
  if(!btn) return;

  if (battleState.auto) {
    btn.classList.remove('bg-slate-700');
    btn.classList.add('bg-yellow-500', 'text-black');
  } else {
    btn.classList.remove('bg-yellow-500', 'text-black');
    btn.classList.add('bg-slate-700');
  }
}

function winBattle() {
  if(!battleState.active) return;
  battleState.active = false;
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite) {
    sprite.style.opacity = '0';
    sprite.style.transform = 'scale(0) rotate(180deg)';
    sprite.style.transition = 'all 0.5s';
  }

  setTimeout(() => {
    const title = document.getElementById('result-title');
    if(title) {
      title.innerText = "WIN!";
      title.className = "text-6xl font-black text-yellow-400 mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,1)] animate-bounce";
    }
    const coins = document.getElementById('result-coins');
    if(coins) coins.innerText = `${currentQuest.battle.coins}`;
    const exp = document.getElementById('result-exp');
    if(exp) exp.innerText = `${currentQuest.battle.exp}`;
    
    const result = document.getElementById('battle-result');
    if(result) {
      result.style.display = 'flex';
      result.style.opacity = '0';
      result.style.transition = 'opacity 0.5s';
      setTimeout(() => result.style.opacity = '1', 50);
    }
  }, 1000);
}

function loseBattle() {
  if(!battleState.active) return;
  battleState.active = false;
  
  setTimeout(() => {
    const title = document.getElementById('result-title');
    if(title) {
      title.innerText = "LOSE...";
      title.className = "text-5xl font-black text-blue-400 mb-6 drop-shadow-[0_0_10px_rgba(96,165,250,0.8)]";
    }
    const coins = document.getElementById('result-coins');
    if(coins) coins.innerText = `0`;
    const exp = document.getElementById('result-exp');
    if(exp) exp.innerText = `0`;
    
    const result = document.getElementById('battle-result');
    if(result) {
      result.style.display = 'flex';
      result.style.opacity = '0';
      result.style.transition = 'opacity 0.5s';
      setTimeout(() => result.style.opacity = '1', 50);
    }
  }, 1000);
}

function endBattle() {
  if (battleState.enemy.hp <= 0) {
    advPhase = 'post';
    advIndex = 0;
    switchScreen('screen-adv');
    showAdvText();
  } else {
    switchScreen('screen-home');
  }
}

window.onload = () => {
  // Init logic
};

</script>
</body>
</html>

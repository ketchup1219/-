<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROUGE GALLEON - STORY MODE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #000;
      color: #fff;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active {
      display: flex;
    }

    /* --- わくわくエフェクト --- */
    .bg-scrolling {
      background-image: url('https://images.unsplash.com/photo-1544644181-1484b3f8c8b1?auto=format&fit=crop&w=800&q=80');
      background-size: 200%;
      animation: scrollBg 30s linear infinite;
    }
    @keyframes scrollBg {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-25deg);
      animation: shine 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    .sparkle-bg {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      animation: floatSparkle 10s linear infinite;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes floatSparkle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }

    /* 星ドラ風 CTゲージ */
    .ct-ring {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.1s linear;
    }
    .ct-glow {
      animation: pulse-glow 1s infinite alternate;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 5px #facc15, inset 0 0 5px #facc15; }
      100% { box-shadow: 0 0 15px #fef08a, inset 0 0 20px #fef08a; }
    }

    /* ダメージポップアップ */
    .dmg-popup {
      position: absolute;
      font-weight: 900;
      font-size: 2.2rem;
      text-shadow: 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000, 0 4px 8px rgba(0,0,0,0.8);
      animation: dmg-float 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      pointer-events: none;
      z-index: 50;
    }
    .dmg-heal { color: #4ade80; }
    .dmg-normal { color: #fff; }
    .dmg-crit { color: #facc15; font-size: 3rem; }
    .dmg-weak { color: #f87171; font-size: 2.8rem; }
    .dmg-lvlup { color: #60a5fa; font-size: 1.5rem; text-shadow: 0 0 5px #000; animation: lvlup-float 2s ease-out forwards; }
    
    @keyframes dmg-float {
      0% { transform: translateY(0) scale(0.5) rotate(calc(var(--rot, 0) * 1deg)); opacity: 1; }
      20% { transform: translateY(-30px) scale(1.2) rotate(calc(var(--rot, 0) * 1deg)); opacity: 1; }
      100% { transform: translateY(-50px) scale(1) rotate(calc(var(--rot, 0) * 1deg)); opacity: 0; }
    }
    @keyframes lvlup-float {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
      80% { transform: translateY(-40px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-60px) scale(1); opacity: 0; }
    }

    /* 敵のアニメーション */
    .enemy-idle { animation: enemy-bob 2s infinite ease-in-out; }
    @keyframes enemy-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .enemy-attack { animation: enemy-atk 0.3s ease-out; }
    @keyframes enemy-atk { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(30px) scale(1.1); } 100% { transform: translateY(0) scale(1); } }
    .enemy-hurt { animation: enemy-shake 0.2s; filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(5); }
    @keyframes enemy-shake { 0%, 100% { transform: translateX(0) translateY(0); } 25% { transform: translateX(-15px) translateY(-5px); } 75% { transform: translateX(15px) translateY(5px); } }
    .enemy-break { animation: break-shake 0.5s infinite; filter: brightness(0.8) sepia(0.5) hue-rotate(200deg); }
    @keyframes break-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

    /* カットイン演出 */
    .cutin-container {
      position: absolute; top: 30%; left: 0; width: 100%; height: 100px;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.8) 20%, rgba(0, 0, 0, 0.8) 80%, transparent);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: skewY(-5deg) translateX(-100%); z-index: 60; pointer-events: none;
    }
    .cutin-active { animation: cutin-anim 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    @keyframes cutin-anim { 0% { transform: skewY(-5deg) translateX(-100%); opacity: 0; } 15% { transform: skewY(-5deg) translateX(0); opacity: 1; } 85% { transform: skewY(-5deg) translateX(5%); opacity: 1; } 100% { transform: skewY(-5deg) translateX(100%); opacity: 0; } }

    /* エフェクト */
    .slash-effect {
      position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
      background: linear-gradient(transparent 45%, rgba(255,255,255,0.8) 50%, transparent 55%);
      transform: rotate(var(--rot, 45deg)) scale(0); animation: slash-anim 0.2s ease-out forwards; pointer-events: none; z-index: 40;
    }
    @keyframes slash-anim { 0% { transform: rotate(var(--rot, 45deg)) scale(0); opacity: 1; filter: brightness(2); } 100% { transform: rotate(var(--rot, 45deg)) scale(1.5); opacity: 0; } }
    
    .impact-effect {
      position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin-top: -50px; margin-left: -50px;
      background: radial-gradient(circle, #fff 0%, transparent 70%); animation: impact-anim 0.3s ease-out forwards; pointer-events: none; z-index: 41;
    }
    @keyframes impact-anim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

    .adv-text::after { content: '▼'; position: absolute; bottom: 10px; right: 15px; animation: blink 1s infinite; color: #facc15; }
    @keyframes blink { 50% { opacity: 0; } }

    .btn-push { transition: transform 0.1s, box-shadow 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.5); cursor: pointer; }
    .btn-push:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0.5); }
    
    .tab-active { background-color: #4f46e5; border-color: #818cf8; color: #fff; }
    .tab-inactive { background-color: #1e293b; border-color: #334155; color: #94a3b8; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center items-center h-screen w-screen bg-slate-900 relative">

  <!-- 音源 (決定ボタン) -->
  <audio id="se-click" src="決定ボタンを押す10.mp3" preload="auto"></audio>

  <div id="game-container" class="relative w-full h-full max-w-md bg-slate-800 shadow-2xl overflow-hidden border-x border-slate-700">

    <!-- ==================== TITLE SCREEN ==================== -->
    <div id="screen-title" class="screen active bg-[url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80')] bg-cover bg-center">
      <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
      <div class="sparkle-bg"></div>
      <div class="relative z-10 flex flex-col items-center justify-center h-full p-6">
        
        <!-- ロゴ画像 (なければフォールバックでテキスト) -->
        <img src="ルージュ・ガレオン.png" alt="ROUGE GALLEON" class="w-full max-w-[280px] mb-4 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] animate-pulse" onerror="this.outerHTML='<h1 class=\'text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 via-yellow-400 to-amber-600 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] text-center mb-2 animate-pulse\'>ROUGE GALLEON</h1>'">
        
        <h2 class="text-lg font-bold text-yellow-200 tracking-widest drop-shadow-md mb-12 bg-black/40 px-4 py-1 rounded-full border border-yellow-500/30">〜 ストーリーモード 〜</h2>

        <button onclick="startGame()" class="btn-push btn-shine bg-gradient-to-b from-blue-400 to-blue-700 border-2 border-white text-white font-black py-4 px-10 rounded-full text-2xl w-full max-w-xs mb-6 shadow-[0_0_20px_rgba(59,130,246,0.8)] flex items-center justify-center gap-2">
          <span>冒険をはじめる！</span>
        </button>
        
        <button onclick="resetData()" class="text-slate-400 text-xs underline mt-8 hover:text-white transition-colors p-2 cursor-pointer">セーブデータリセット</button>
      </div>
    </div>

    <!-- ==================== HOME (QUEST SELECT) ==================== -->
    <div id="screen-home" class="screen bg-slate-900">
      <!-- ヘッダー -->
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-2 flex justify-between items-center border-b-2 border-slate-600 shadow-lg z-20">
        <div class="flex items-center gap-2">
          <div id="ui-player-icon" class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-xl border-2 border-white shadow-inner overflow-hidden">👤</div>
          <div>
            <div class="text-[10px] text-yellow-300 font-bold leading-none tracking-wider">CAPTAIN</div>
            <div id="ui-player-name" class="font-black text-sm text-white drop-shadow-md">プレイヤー</div>
          </div>
        </div>
        <div class="flex gap-3 text-xs font-bold bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-700 shadow-inner">
          <div class="flex items-center gap-1">
            <span class="inline-flex relative w-4 h-4"><img src="草コイン.png" onerror="this.outerHTML='💰'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-coins" class="text-yellow-400">0</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="inline-flex relative w-4 h-4"><img src="草の化石.png" onerror="this.outerHTML='🦴'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-materials" class="text-indigo-300">0</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="inline-flex relative w-4 h-4"><img src="草核.png" onerror="this.outerHTML='✨'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
            <span id="ui-stones" class="text-pink-400">0</span>
          </div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar p-4 relative bg-scrolling">
        <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-[2px]"></div>
        <div class="sparkle-bg"></div>
        
        <div class="relative z-10 flex flex-col">
          <div class="flex gap-2 mb-6">
            <button onclick="location.href='kaizoku.html'" class="btn-push btn-shine flex-1 bg-gradient-to-b from-emerald-400 to-green-700 border-2 border-white text-white font-black py-3 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.5)] flex items-center justify-center gap-1 text-sm">
              <span class="text-xl drop-shadow-md">⚓</span><span class="drop-shadow-md">本編へ戻る</span>
            </button>
            <button onclick="switchScreen('screen-manage'); updateManageUI('party');" class="btn-push flex-1 bg-gradient-to-b from-purple-500 to-indigo-700 border-2 border-white text-white font-black py-3 rounded-xl shadow-[0_0_15px_rgba(139,92,246,0.5)] flex items-center justify-center gap-1 text-sm">
              <span class="text-xl drop-shadow-md">⚔️</span><span class="drop-shadow-md">編成・錬金</span>
            </button>
          </div>

          <h3 class="text-center font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-amber-500 text-2xl mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">冒険の航路</h3>
          <div class="w-24 h-1 bg-yellow-500/50 mx-auto rounded-full mb-4"></div>

          <div id="quest-list" class="flex flex-col gap-3 pb-8"></div>
        </div>
      </div>
    </div>

    <!-- ==================== MANAGE (編成・拠点) ==================== -->
    <div id="screen-manage" class="screen bg-slate-900">
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-3 flex items-center border-b-2 border-slate-600 shadow-lg z-20 gap-4">
        <button onclick="switchScreen('screen-home')" class="btn-push bg-slate-700 border-2 border-slate-500 text-white font-black px-4 py-1.5 rounded-full text-sm">◀ 戻る</button>
        <h2 class="font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-indigo-400 text-xl flex-1 text-center pr-10 drop-shadow-md">拠点</h2>
      </div>
      
      <!-- タブメニュー -->
      <div class="flex gap-1 p-2 bg-slate-950 border-b border-slate-700 z-10">
        <button id="tab-btn-party" onclick="updateManageUI('party')" class="flex-1 py-2 rounded-t-lg font-black text-sm border-2 border-b-0 tab-active cursor-pointer">編成</button>
        <button id="tab-btn-equip" onclick="updateManageUI('equip')" class="flex-1 py-2 rounded-t-lg font-black text-sm border-2 border-b-0 tab-inactive cursor-pointer">装備</button>
        <button id="tab-btn-alchemy" onclick="updateManageUI('alchemy')" class="flex-1 py-2 rounded-t-lg font-black text-sm border-2 border-b-0 tab-inactive cursor-pointer">錬金</button>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar bg-slate-800 p-4" id="manage-content">
        <!-- JSでタブコンテンツを描画 -->
      </div>
      
      <!-- 装備/キャラ選択用モーダルパネル -->
      <div id="select-modal" class="absolute inset-0 bg-black/80 hidden flex-col justify-center items-center z-50 p-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-xl border-2 border-indigo-500 flex flex-col max-h-[80vh] shadow-2xl">
          <div class="p-3 border-b border-slate-600 font-black text-center text-yellow-400" id="select-modal-title">選択</div>
          <div class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-2 content-start no-scrollbar" id="select-modal-list"></div>
          <div class="p-3 border-t border-slate-600">
            <button onclick="closeSelectModal()" class="w-full bg-slate-700 text-white font-bold py-3 rounded-lg border border-slate-500 btn-push text-lg">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== ADV SCREEN ==================== -->
    <div id="screen-adv" class="screen bg-slate-900">
      <div id="adv-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-500"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/50 to-transparent"></div>
      <div class="absolute bottom-[30%] w-full h-[60%] flex items-end justify-center pointer-events-none">
        <div id="adv-char-img" class="text-[12rem] filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] transition-transform duration-300 transform translate-y-10 opacity-0 flex items-center justify-center">🏴‍☠️</div>
      </div>
      <div class="absolute bottom-0 w-full p-4 z-20">
        <div class="bg-slate-900/90 border-2 border-slate-500 rounded-xl p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.5)] relative min-h-[140px] cursor-pointer" onclick="nextAdv()">
          <div id="adv-speaker" class="absolute -top-4 left-4 bg-gradient-to-r from-blue-600 to-indigo-600 border-2 border-white px-4 py-1 rounded-full text-sm font-black shadow-md drop-shadow-md">
            話者
          </div>
          <p id="adv-text" class="text-white font-bold leading-relaxed mt-2 text-sm whitespace-pre-wrap adv-text"></p>
        </div>
      </div>
    </div>

    <!-- ==================== BATTLE SCREEN ==================== -->
    <div id="screen-battle" class="screen bg-black">
      <div class="relative h-[55%] w-full bg-[url('https://images.unsplash.com/photo-1505159940484-eb2b9f2588e2?auto=format&fit=crop&w=800&q=80')] bg-cover bg-bottom border-b-4 border-slate-700 overflow-hidden" id="battle-field">
        <div class="absolute inset-0 bg-blue-900/40"></div>
        <div class="absolute top-20 left-4 z-30">
          <div id="combo-display" class="hidden font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 to-yellow-500 drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)] italic">
            <span id="combo-count" class="text-5xl">2</span><span class="text-2xl ml-1">CHAIN!!</span>
            <div id="combo-bonus" class="text-xs text-yellow-300 mt-1">ダメージ +10%</div>
          </div>
        </div>
        <div class="absolute top-20 right-4 z-30">
          <div id="break-display" class="hidden text-red-500 font-black text-4xl italic drop-shadow-[0_0_10px_rgba(255,0,0,0.8)] animate-pulse">
            BREAK!
          </div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center pb-8" id="enemy-container">
          <div id="enemy-sprite" class="text-[8rem] filter drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] enemy-idle relative">
            💀
            <div id="enemy-action-indicator" class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-red-600 border border-white text-white text-[10px] font-bold px-2 py-0.5 rounded-full opacity-0 transition-opacity whitespace-nowrap shadow-md">攻撃準備!</div>
          </div>
        </div>
        <div id="skill-cutin" class="cutin-container">
          <div class="flex items-center gap-4 px-8">
            <span id="cutin-icon" class="text-6xl drop-shadow-md flex items-center justify-center w-16 h-16 rounded-full overflow-hidden bg-slate-900">🧑</span>
            <span id="cutin-name" class="text-3xl font-black text-white italic drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">スキル名</span>
          </div>
        </div>
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-3/4 max-w-[300px] z-20">
          <div class="flex justify-between items-end mb-1 text-white font-black drop-shadow-md">
            <span id="enemy-name" class="text-sm">敵の名前</span>
            <span class="text-xs bg-slate-900/80 px-1.5 py-0.5 rounded border border-slate-600">Lv <span id="enemy-lv">1</span></span>
          </div>
          <div class="w-full bg-slate-900 h-3 rounded-t-lg border-x-2 border-t-2 border-slate-600 overflow-hidden relative shadow-inner">
            <div id="enemy-hp-bar" class="bg-gradient-to-r from-red-500 to-orange-500 h-full w-full transition-all duration-300"></div>
          </div>
          <div class="w-full bg-slate-900 h-1.5 rounded-b-lg border-x-2 border-b-2 border-slate-600 overflow-hidden relative shadow-inner">
            <div id="enemy-shield-bar" class="bg-gradient-to-r from-blue-300 to-cyan-300 h-full w-full transition-all duration-200"></div>
          </div>
        </div>
        <div class="absolute top-4 right-4 bg-slate-900/80 border border-slate-500 px-2 py-1 rounded text-[10px] font-black text-yellow-300 z-20 shadow-md">BATTLE</div>
      </div>
      <div class="relative h-[45%] w-full bg-slate-800 flex flex-col">
        <div class="w-full h-2 bg-gradient-to-r from-slate-600 via-slate-400 to-slate-600"></div>
        <div class="flex-1 grid grid-cols-4 gap-1 p-1" id="party-container"></div>
        <div class="h-12 bg-slate-900 flex justify-between items-center px-4 border-t border-slate-700 shadow-[0_-5px_10px_rgba(0,0,0,0.5)]">
          <button class="bg-slate-700 border-2 border-slate-500 text-slate-400 text-xs font-bold px-4 py-1.5 rounded-full opacity-50 cursor-not-allowed">どうぐ</button>
          <div class="flex gap-2">
            <button onclick="toggleAutoBattle()" id="btn-auto" class="bg-slate-700 border-2 border-slate-500 text-white text-xs font-bold px-6 py-1.5 rounded-full btn-push transition-colors shadow-md">オート</button>
          </div>
        </div>
      </div>
      
      <!-- バトルリザルトオーバーレイ -->
      <div id="battle-result" class="absolute inset-0 bg-black/80 hidden flex-col items-center justify-center z-50 backdrop-blur-sm">
        <h2 id="result-title" class="text-6xl font-black text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,1)] animate-bounce">WIN!</h2>
        
        <div class="bg-slate-800 border-2 border-yellow-500 rounded-xl p-5 w-11/12 max-w-[340px] mb-6 shadow-2xl overflow-y-auto max-h-[50vh] no-scrollbar">
          
          <div class="flex justify-center gap-4 mb-4 border-b border-slate-600 pb-3">
            <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 flex flex-col items-center justify-center gap-1 shadow-inner w-1/2">
              <span class="inline-flex relative w-6 h-6"><img src="草コイン.png" onerror="this.outerHTML='💰'" class="absolute inset-0 w-full h-full object-contain drop-shadow-md"></span>
              <span id="result-coins" class="text-yellow-400 font-black">0</span>
            </div>
            <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 flex flex-col items-center justify-center gap-1 shadow-inner w-1/2">
              <span class="text-blue-300 text-xs font-black drop-shadow-md">EXP</span>
              <span id="result-exp-total" class="text-white font-black text-lg">0</span>
            </div>
          </div>

// ==========================================
// 画面遷移・初期化
// ==========================================
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const targetScreen = document.getElementById(id);
  if(targetScreen) targetScreen.classList.add('active');
}

function startGame() {
  playSE();
  loadData();
  updateHomeUI();
  switchScreen('screen-home');
}

function updateHomeUI() {
  const elPlayerIcon = document.getElementById('ui-player-icon');
  if(elPlayerIcon) {
    if (saveData.playerIcon.startsWith('data:image')) {
      elPlayerIcon.innerHTML = `<img src="${saveData.playerIcon}" class="w-full h-full object-cover rounded-full">`;
    } else {
      elPlayerIcon.innerText = saveData.playerIcon;
    }
  }
  const elPlayerName = document.getElementById('ui-player-name');
  if(elPlayerName) elPlayerName.innerText = saveData.playerName;
  
  const elCoins = document.getElementById('ui-coins');
  if(elCoins) elCoins.innerText = saveData.coins.toLocaleString();
  
  const elMaterials = document.getElementById('ui-materials');
  if(elMaterials) elMaterials.innerText = saveData.materials.toLocaleString();
  
  const elStones = document.getElementById('ui-stones');
  if(elStones) elStones.innerText = saveData.stones.toLocaleString();

  const list = document.getElementById('quest-list');
  if(!list) return;
  list.innerHTML = '';

  let currentChapter = 0;

  STORY_DATA.forEach(q => {
    if (q.chapter !== currentChapter) {
      currentChapter = q.chapter;
      const header = document.createElement('h4');
      header.className = "text-center font-black text-yellow-400 text-lg mt-4 mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] border-b border-yellow-500/50 pb-1";
      header.innerText = q.chapterTitle;
      list.appendChild(header);
    }

    const isUnlocked = !q.reqFlag || saveData.questFlags[q.reqFlag];
    const isCleared = saveData.questFlags[q.flagKey];
    
    const btn = document.createElement('button');
    const baseClass = "w-full text-left p-4 rounded-2xl border-2 flex justify-between items-center transition-all duration-300 active:scale-95 relative overflow-hidden";
    const unlockClass = isUnlocked ? 'bg-gradient-to-r from-slate-800 to-indigo-900 border-indigo-500 hover:border-yellow-400 shadow-[0_4px_15px_rgba(0,0,0,0.5)] cursor-pointer' : 'bg-slate-900 border-slate-700 opacity-60 cursor-not-allowed';
    const shineClass = isUnlocked && !isCleared ? 'btn-shine' : '';
    
    btn.className = `${baseClass} ${unlockClass} ${shineClass}`;
    
    btn.innerHTML = `
      <div class="z-10 pointer-events-none">
        <div class="text-[10px] font-black ${isCleared ? 'text-green-400' : 'text-yellow-400'} mb-1 drop-shadow-md">${isCleared ? 'CLEAR!' : '★ NEW'}</div>
        <div class="font-black text-white text-base drop-shadow-md">${q.title}</div>
      </div>
      <div class="text-3xl z-10 pointer-events-none drop-shadow-md">${isUnlocked ? (isCleared ? '🌟' : '⚔️') : '🔒'}</div>
    `;

    if (isUnlocked) {
      btn.onclick = () => { playSE(); startQuest(q.id); };
    }
    
    list.appendChild(btn);
  });
}

// ==========================================
// 編成・拠点コントローラー (Manage UI)
// ==========================================
let currentManageTab = 'party';
let selectingSlotType = null; // 'weapon', 'relic', 'party'
let selectingTargetId = null; // pid or slotIndex

function updateManageUI(tab) {
  currentManageTab = tab || currentManageTab;
  
  ['party', 'equip', 'alchemy'].forEach(t => {
    const btn = document.getElementById(`tab-btn-${t}`);
    if(btn) {
      if(t === currentManageTab) {
        btn.classList.remove('tab-inactive', 'border-b-0');
        btn.classList.add('tab-active', 'border-indigo-500', 'border-b-indigo-500');
      } else {
        btn.classList.remove('tab-active', 'border-indigo-500', 'border-b-indigo-500');
        btn.classList.add('tab-inactive', 'border-b-0');
      }
    }
  });

  const content = document.getElementById('manage-content');
  if(!content) return;
  content.innerHTML = '';

  if (currentManageTab === 'party') {
    renderPartyTab(content);
  } else if (currentManageTab === 'equip') {
    renderEquipTab(content);
  } else if (currentManageTab === 'alchemy') {
    renderAlchemyTab(content);
  }
}

function renderPartyTab(container) {
  container.innerHTML = `<h3 class="text-center font-black text-yellow-300 mb-4 text-sm">出撃する4人を編成しよう</h3>`;
  const grid = document.createElement('div');
  grid.className = "grid grid-cols-2 gap-3";
  
  for(let i=0; i<4; i++) {
    const pid = saveData.party[i];
    const card = document.createElement('button');
    card.className = "btn-push bg-slate-800 border-2 border-indigo-500 rounded-xl p-3 flex flex-col items-center shadow-lg relative h-32";
    card.onclick = () => { playSE(); openSelectModal('party', i); };
    
    if (pid && CHAR_MASTER[pid]) {
      const cMaster = CHAR_MASTER[pid];
      const cData = saveData.crewData[pid] || {level:1, exp:0};
      card.innerHTML = `
        <span class="absolute top-1 left-2 text-[10px] text-slate-400 font-bold">枠 ${i+1}</span>
        ${cMaster.icon.startsWith('data:image') ? `<img src="${cMaster.icon}" class="w-10 h-10 rounded-full object-cover mt-2">` : `<span class="text-4xl filter drop-shadow mt-2">${cMaster.icon}</span>`}
        <span class="text-xs font-black text-white mt-1 w-full truncate text-center">${cMaster.name}</span>
        <span class="text-[9px] text-yellow-300 font-bold bg-slate-900 px-2 py-0.5 rounded-full mt-auto border border-slate-600">Lv ${cData.level}</span>
      `;
    } else {
      card.classList.replace('border-indigo-500', 'border-slate-500');
      card.classList.replace('bg-slate-800', 'bg-slate-700');
      card.innerHTML = `
        <span class="absolute top-1 left-2 text-[10px] text-slate-400 font-bold">枠 ${i+1}</span>
        <span class="text-3xl text-slate-500 mt-auto mb-auto">+</span>
        <span class="text-xs font-bold text-slate-400 mt-auto">空き</span>
      `;
    }
    grid.appendChild(card);
  }
  container.appendChild(grid);
}

function renderEquipTab(container) {
  container.innerHTML = `<h3 class="text-center font-black text-yellow-300 mb-4 text-sm">装備や遺物でキャラクターを強化！</h3>`;
  const list = document.createElement('div');
  list.className = "flex flex-col gap-3";
  
  Object.keys(CHAR_MASTER).forEach(pid => {
    const cMaster = CHAR_MASTER[pid];
    const cData = saveData.crewData[pid] || {level:1, exp:0};
    
    // 武器情報 (nullチェック強化)
    const equipWeaponItem = saveData.inventory.weapons.find(w => w.equipTo === pid);
    const wMaster = (equipWeaponItem && WEAPON_MASTER[equipWeaponItem.id]) ? WEAPON_MASTER[equipWeaponItem.id] : WEAPON_MASTER["w_none"];
    const wPlus = equipWeaponItem && equipWeaponItem.plus > 0 ? `+${equipWeaponItem.plus}` : '';
    const wAtk = wMaster.atk * (1 + (equipWeaponItem ? equipWeaponItem.plus * 0.2 : 0));
    
    // 遺物情報 (nullチェック強化)
    const equipRelicItem = saveData.inventory.relics.find(r => r.equipTo === pid);
    const rMaster = (equipRelicItem && RELIC_MASTER[equipRelicItem.id]) ? RELIC_MASTER[equipRelicItem.id] : null;
    const rPlus = equipRelicItem && equipRelicItem.plus > 0 ? `+${equipRelicItem.plus}` : '';

    const hp = cMaster.baseHp + (cData.level - 1) * 10 + (rMaster ? Math.floor(rMaster.hp * (1 + equipRelicItem.plus * 0.2)) : 0);
    const atk = cMaster.baseAtk + (cData.level - 1) * 2 + Math.floor(wAtk) + (rMaster ? Math.floor(rMaster.atk * (1 + equipRelicItem.plus * 0.2)) : 0);

    const card = document.createElement('div');
    card.className = "bg-slate-800 border-2 border-indigo-500 rounded-xl p-3 shadow-lg relative";
    
    if(saveData.party.includes(pid)) {
      card.innerHTML += `<div class="absolute -top-2 -left-2 bg-pink-500 text-white text-[8px] font-black px-2 py-0.5 rounded-full shadow-md z-10 border border-white">出撃中</div>`;
    }

    const wTypeName = cMaster.weaponType === 'any' ? '何でも' : 
                      cMaster.weaponType === 'spear' ? '槍' : 
                      cMaster.weaponType === 'gun' ? '銃' : 
                      cMaster.weaponType === 'greatsword' ? '大剣' : 
                      cMaster.weaponType === 'axe' ? '斧' : cMaster.weaponType;

    card.innerHTML += `
      <div class="flex items-center gap-3 border-b border-slate-600 pb-2 mb-2">
        <div class="flex-shrink-0 text-4xl bg-slate-900 border border-slate-600 rounded-xl w-14 h-14 flex items-center justify-center filter drop-shadow-md overflow-hidden">
          ${cMaster.icon.startsWith('data:image') ? `<img src="${cMaster.icon}" class="w-full h-full object-cover">` : cMaster.icon}
        </div>
        <div class="flex-1">
          <div class="flex justify-between items-end mb-1">
            <span class="font-black text-white text-sm">${cMaster.name}</span>
            <span class="text-[10px] text-yellow-300 font-bold bg-slate-900 px-2 py-0.5 rounded-full border border-slate-600">Lv ${cData.level}</span>
          </div>
          <div class="text-[10px] text-blue-200 flex justify-between font-bold">
            <span>HP: ${hp}</span>
            <span>攻: ${atk}</span>
          </div>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="playSE(); openSelectModal('weapon', '${pid}')" class="btn-push flex-1 bg-gradient-to-b from-indigo-600 to-indigo-800 border border-indigo-400 rounded-lg p-1.5 flex flex-col items-center">
          <span class="text-[8px] text-slate-300 mb-0.5">武器 (${wTypeName})</span>
          <span class="text-2xl filter drop-shadow">${wMaster.icon}</span>
          <span class="text-[9px] text-white font-bold truncate w-full text-center mt-0.5">${wMaster.name}<span class="text-yellow-300">${wPlus}</span></span>
        </button>
        <button onclick="playSE(); openSelectModal('relic', '${pid}')" class="btn-push flex-1 bg-gradient-to-b from-purple-600 to-purple-800 border border-purple-400 rounded-lg p-1.5 flex flex-col items-center">
          <span class="text-[8px] text-slate-300 mb-0.5">遺物</span>
          <span class="text-2xl filter drop-shadow">${rMaster ? rMaster.icon : '✨'}</span>
          <span class="text-[9px] text-white font-bold truncate w-full text-center mt-0.5">${rMaster ? rMaster.name : 'なし'}<span class="text-yellow-300">${rPlus}</span></span>
        </button>
      </div>
    `;
    list.appendChild(card);
  });
  container.appendChild(list);
}

function renderAlchemyTab(container) {
  container.innerHTML = `
    <h3 class="text-center font-black text-yellow-300 mb-2 text-sm">錬金（限界突破）</h3>
    <p class="text-center text-[10px] text-slate-300 mb-4 bg-slate-900 p-2 rounded-lg border border-slate-700">同じ装備や遺物を消費して、最大+4まで強化！<br>ステータスがアップするぞ！</p>
  `;
  
  const list = document.createElement('div');
  list.className = "grid grid-cols-2 gap-2";

  const renderItems = (items, masterData, typeStr) => {
    items.forEach(item => {
      const master = masterData[item.id];
      if(!master || item.plus >= 4) return;

      const material = items.find(m => m.id === item.id && m.uid !== item.uid && !m.equipTo);
      
      const card = document.createElement('div');
      card.className = `border-2 rounded-xl p-2 flex flex-col items-center relative shadow-md ${material ? 'bg-slate-700 border-yellow-500' : 'bg-slate-800 border-slate-600'}`;
      
      if(item.equipTo && CHAR_MASTER[item.equipTo]) {
        card.innerHTML += `<div class="absolute -top-2 -left-2 bg-indigo-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow z-10">${CHAR_MASTER[item.equipTo].name}</div>`;
      }

      card.innerHTML += `
        <span class="text-3xl filter drop-shadow mb-1">${master.icon}</span>
        <span class="text-[10px] font-black text-white w-full text-center truncate">${master.name}<span class="text-yellow-300">${item.plus > 0 ? '+'+item.plus : ''}</span></span>
        <span class="text-[8px] text-slate-400 mb-2">${typeStr}</span>
      `;

      const btn = document.createElement('button');
      if (material) {
        btn.className = "btn-push w-full bg-gradient-to-b from-yellow-400 to-orange-500 text-slate-900 font-black text-[10px] py-1.5 rounded-md shadow border border-white";
        btn.innerText = "錬金する！";
        btn.onclick = () => doAlchemy(item.uid, material.uid, typeStr === '武器' ? 'weapons' : 'relics');
      } else {
        btn.className = "w-full bg-slate-900 text-slate-500 font-bold text-[10px] py-1.5 rounded-md border border-slate-700";
        btn.innerText = "素材なし";
        btn.disabled = true;
      }
      card.appendChild(btn);
      list.appendChild(card);
    });
  };

  renderItems(saveData.inventory.weapons, WEAPON_MASTER, '武器');
  renderItems(saveData.inventory.relics, RELIC_MASTER, '遺物');
  
  if(list.children.length === 0) {
    container.innerHTML += `<div class="text-center text-slate-500 font-bold text-sm mt-8">錬金できるアイテムがありません</div>`;
  } else {
    container.appendChild(list);
  }
}

function doAlchemy(baseUid, materialUid, invType) {
  const inv = saveData.inventory[invType];
  const base = inv.find(i => i.uid === baseUid);
  const matIdx = inv.findIndex(i => i.uid === materialUid);
  
  if(!base || matIdx === -1) return;
  if(base.plus >= 4) return;
  
  base.plus++;
  inv.splice(matIdx, 1);
  saveGame();
  playSE();
  updateManageUI('alchemy');
}

// 選択モーダルの処理
function openSelectModal(type, targetId) {
  selectingSlotType = type;
  selectingTargetId = targetId;
  
  const modal = document.getElementById('select-modal');
  const title = document.getElementById('select-modal-title');
  const list = document.getElementById('select-modal-list');
  if(!modal || !title || !list) return;
  list.innerHTML = '';

  if (type === 'party') {
    title.innerText = `枠 ${targetId + 1} のキャラクターを選択`;
    
    const btnNone = document.createElement('button');
    btnNone.className = "btn-push bg-slate-700 border-2 border-slate-500 rounded-xl p-2 flex flex-col items-center justify-center h-24";
    btnNone.innerHTML = `<span class="text-2xl text-slate-400 mb-1">✕</span><span class="text-[10px] font-bold text-white">はずす</span>`;
    btnNone.onclick = () => setPartyMember(targetId, null);
    list.appendChild(btnNone);

    Object.keys(CHAR_MASTER).forEach(pid => {
      const c = CHAR_MASTER[pid];
      const isEquipped = saveData.party.includes(pid);
      
      const btn = document.createElement('button');
      btn.className = `btn-push bg-slate-800 border-2 ${isEquipped ? 'border-red-500 opacity-50' : 'border-indigo-500'} rounded-xl p-2 flex flex-col items-center relative h-24 overflow-hidden`;
      btn.innerHTML = `
        ${c.icon.startsWith('data:image') ? `<img src="${c.icon}" class="w-8 h-8 rounded-full object-cover mb-1">` : `<span class="text-3xl filter drop-shadow mb-1">${c.icon}</span>`}
        <span class="text-[10px] font-black text-white w-full text-center truncate">${c.name}</span>
        <span class="text-[8px] text-yellow-300 mt-auto bg-slate-900 px-1 rounded-full border border-slate-600">Lv ${saveData.crewData[pid] ? saveData.crewData[pid].level : 1}</span>
        ${isEquipped ? `<span class="absolute inset-0 bg-red-900/50 rounded-lg flex items-center justify-center text-[10px] font-black text-white">編成中</span>` : ''}
      `;
      if(!isEquipped) btn.onclick = () => setPartyMember(targetId, pid);
      list.appendChild(btn);
    });

  } else if (type === 'weapon' || type === 'relic') {
    const cMaster = CHAR_MASTER[targetId];
    title.innerText = `${cMaster.name} の${type === 'weapon'?'武器':'遺物'}を選択`;
    
    const invType = type === 'weapon' ? 'weapons' : 'relics';
    const masterData = type === 'weapon' ? WEAPON_MASTER : RELIC_MASTER;

    const btnNone = document.createElement('button');
    btnNone.className = "btn-push bg-slate-700 border-2 border-slate-500 rounded-xl p-2 flex flex-col items-center justify-center h-24";
    btnNone.innerHTML = `<span class="text-2xl mb-1 filter drop-shadow">${type==='weapon'?'✊':'✨'}</span><span class="text-[10px] font-bold text-white">はずす</span>`;
    btnNone.onclick = () => setEquipItem(invType, null);
    list.appendChild(btnNone);

    saveData.inventory[invType].forEach(item => {
      const iMaster = masterData[item.id];
      if(!iMaster) return;

      if (type === 'weapon' && cMaster.weaponType !== 'any' && iMaster.type !== cMaster.weaponType) {
        return; // 得意武器以外は非表示
      }

      const isEquippedByOther = item.equipTo && item.equipTo !== targetId;
      const isEquippedByMe = item.equipTo === targetId;
      
      const btn = document.createElement('button');
      btn.className = `btn-push bg-slate-800 border-2 ${isEquippedByOther ? 'border-red-500 opacity-60' : isEquippedByMe ? 'border-green-500' : 'border-indigo-500'} rounded-xl p-2 flex flex-col items-center relative h-24`;
      btn.innerHTML = `
        <span class="text-3xl filter drop-shadow mb-1">${iMaster.icon}</span>
        <span class="text-[10px] font-black text-white w-full text-center truncate">${iMaster.name}<span class="text-yellow-300">${item.plus > 0 ? '+'+item.plus : ''}</span></span>
        <span class="text-[8px] text-slate-300 mt-auto">${type === 'weapon' ? '攻+'+Math.floor(iMaster.atk*(1+item.plus*0.2)) : 'HP+'+Math.floor(iMaster.hp*(1+item.plus*0.2))}</span>
        ${isEquippedByOther && CHAR_MASTER[item.equipTo] ? `<div class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px] px-1 rounded shadow">${CHAR_MASTER[item.equipTo].name}</div>` : ''}
        ${isEquippedByMe ? `<div class="absolute -top-1 -right-1 bg-green-600 text-white text-[8px] px-1 rounded shadow">装備中</div>` : ''}
      `;
      btn.onclick = () => setEquipItem(invType, item.uid);
      list.appendChild(btn);
    });
  }

  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeSelectModal() {
  const modal = document.getElementById('select-modal');
  if(modal) {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }
}

function setPartyMember(slotIndex, pid) {
  saveData.party[slotIndex] = pid;
  saveGame();
  updateManageUI('party');
  closeSelectModal();
  playSE();
}

function setEquipItem(invType, itemUid) {
  const inv = saveData.inventory[invType];
  const pid = selectingTargetId;
  
  const currentEquip = inv.find(i => i.equipTo === pid);
  if(currentEquip) currentEquip.equipTo = null;

  if (itemUid) {
    const newItem = inv.find(i => i.uid === itemUid);
    if(newItem) {
      if(newItem.equipTo && CHAR_MASTER[newItem.equipTo]) {
        if(!confirm(`${CHAR_MASTER[newItem.equipTo].name}が装備中ですが、外して装備しますか？`)) return;
      }
      newItem.equipTo = pid;
    }
  }

  saveGame();
  updateManageUI('equip');
  closeSelectModal();
  playSE();
}


// ==========================================
// ADV / BATTLE コントローラー
// ==========================================
let currentQuest = null;
let advPhase = 'pre'; // 'pre' or 'post'
let advIndex = 0;

function startQuest(id) {
  currentQuest = STORY_DATA.find(q => q.id === id);
  advPhase = 'pre';
  advIndex = 0;
  
  const advBg = document.getElementById('adv-bg');
  if(advBg) advBg.style.backgroundImage = `url('${currentQuest.bg}')`;
  
  switchScreen('screen-adv');
  showAdvText();
}

function showAdvText() {
  const data = advPhase === 'pre' ? currentQuest.advPre : currentQuest.advPost;
  if (advIndex >= data.length) {
    if (advPhase === 'pre') {
      initBattle();
    } else {
      finishQuest();
    }
    return;
  }

  const line = data[advIndex];
  
  const advSpeaker = document.getElementById('adv-speaker');
  if(advSpeaker) advSpeaker.innerText = line.speaker;
  
  const charImg = document.getElementById('adv-char-img');
  if(charImg) {
    if(line.icon.startsWith('data:image')){
      charImg.innerHTML = `<img src="${line.icon}" class="w-48 h-48 rounded-full object-cover">`;
    }else{
      charImg.innerText = line.icon;
    }
    charImg.style.transform = 'translateY(10px)';
    charImg.style.opacity = '0';
    setTimeout(() => {
      charImg.style.transform = 'translateY(0)';
      charImg.style.opacity = '1';
    }, 50);
  }

  const textEl = document.getElementById('adv-text');
  if(textEl) {
    textEl.innerText = "";
    let charIdx = 0;
    clearInterval(window.advTypeInterval);
    window.advTypeInterval = setInterval(() => {
      if (charIdx < line.text.length) {
        textEl.innerText += line.text.charAt(charIdx);
        charIdx++;
      } else {
        clearInterval(window.advTypeInterval);
      }
    }, 20);
  }
}

function nextAdv() {
  clearInterval(window.advTypeInterval);
  const data = advPhase === 'pre' ? currentQuest.advPre : currentQuest.advPost;
  if (advIndex < data.length) {
    const textEl = document.getElementById('adv-text');
    if (textEl && textEl.innerText.length < data[advIndex].text.length) {
      textEl.innerText = data[advIndex].text;
    } else {
      advIndex++;
      showAdvText();
    }
  }
}

function finishQuest() {
  saveData.questFlags[currentQuest.flagKey] = true;
  saveGame();
  
  updateHomeUI();
  switchScreen('screen-home');
}

// ==========================================
// BATTLE エンジン
// ==========================================
let battleState = {
  active: false,
  auto: false,
  enemy: { hp: 0, maxHp: 0, shield: 0, maxShield: 0, isBroken: false, ct: 0, data: null },
  party: [],
  combo: { count: 0, timer: 0 },
  lastTime: 0
};

function initBattle() {
  switchScreen('screen-battle');
  const battleResult = document.getElementById('battle-result');
  if(battleResult) battleResult.style.display = 'none';
  const resultDrops = document.getElementById('result-drops');
  if(resultDrops) resultDrops.classList.add('hidden');
  
  const bData = currentQuest.battle;
  battleState.enemy = {
    hp: bData.enemyHp,
    maxHp: bData.enemyHp,
    shield: bData.shield || Math.floor(bData.enemyHp * 0.3),
    maxShield: bData.shield || Math.floor(bData.enemyHp * 0.3),
    isBroken: false,
    ct: 0,
    data: bData
  };
  battleState.combo = { count: 0, timer: 0 };
  
  const enemyName = document.getElementById('enemy-name');
  if(enemyName) enemyName.innerText = bData.enemyName;
  const enemySprite = document.getElementById('enemy-sprite');
  if(enemySprite) {
    enemySprite.innerText = bData.enemyIcon;
    enemySprite.classList.remove('enemy-break');
  }
  
  hideComboDisplay();
  hideBreakDisplay();
  updateEnemyHpUI();

  // パーティ初期化
  battleState.party = [];
  saveData.party.forEach((pid, idx) => {
    if (!pid || !CHAR_MASTER[pid]) return;
    
    const cm = CHAR_MASTER[pid];
    const cd = saveData.crewData[pid] || {level:1, exp:0};
    
    const wItem = saveData.inventory.weapons.find(w => w.equipTo === pid);
    const wm = (wItem && WEAPON_MASTER[wItem.id]) ? WEAPON_MASTER[wItem.id] : WEAPON_MASTER["w_none"];
    const wAtk = wm.atk * (1 + (wItem ? wItem.plus * 0.2 : 0));

    const rItem = saveData.inventory.relics.find(r => r.equipTo === pid);
    const rm = (rItem && RELIC_MASTER[rItem.id]) ? RELIC_MASTER[rItem.id] : null;
    const rHp = rm ? rm.hp * (1 + rItem.plus * 0.2) : 0;
    const rAtk = rm ? rm.atk * (1 + rItem.plus * 0.2) : 0;

    const maxHp = cm.baseHp + (cd.level - 1) * 10 + Math.floor(rHp);
    const atk = cm.baseAtk + (cd.level - 1) * 2 + Math.floor(wAtk) + Math.floor(rAtk);

    battleState.party.push({
      ...cm,
      id: pid,
      maxHp: maxHp,
      hp: maxHp,
      atk: atk,
      ct: 0,
      uiIndex: idx
    });
  });

  renderPartyUI();
  
  battleState.active = true;
  battleState.auto = false;
  const btnAuto = document.getElementById('btn-auto');
  if(btnAuto) {
    btnAuto.classList.remove('bg-yellow-500', 'text-black');
    btnAuto.classList.add('bg-slate-700');
  }
  
  battleState.lastTime = performance.now();
  requestAnimationFrame(battleLoop);
}

function renderPartyUI() {
  const container = document.getElementById('party-container');
  if(!container) return;
  container.innerHTML = '';

  for(let i=0; i<4; i++) {
    const p = battleState.party[i];
    const panel = document.createElement('div');
    
    if (p) {
      panel.className = "bg-slate-700 border-2 border-slate-500 rounded-lg flex flex-col items-center p-1 relative overflow-hidden shadow-inner";
      panel.innerHTML = `
        <div class="w-full text-center z-10 mb-1">
          <div class="text-[9px] font-black text-white drop-shadow truncate">${p.name}</div>
          <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-600 mt-0.5">
            <div id="hp-bar-${i}" class="bg-green-500 h-full w-full transition-all"></div>
          </div>
        </div>
        ${p.icon.startsWith('data:image') ? `<img src="${p.icon}" class="w-8 h-8 rounded-full object-cover z-10 my-auto mb-2">` : `<div class="text-3xl filter drop-shadow-md z-10 my-auto mb-2">${p.icon}</div>`}
        
        <div class="relative w-12 h-12 z-10 mt-auto cursor-pointer btn-push" onclick="useSkill(${i})" id="skill-btn-${i}">
          <div class="absolute inset-0 ${p.sBg} rounded-full border-2 ${p.sColor} opacity-50 shadow-inner"></div>
          <svg class="absolute inset-0 w-full h-full ct-ring" viewBox="0 0 36 36">
            <path class="text-slate-900/50" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="ct-path-${i}" stroke-width="4" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--tw-colors-yellow-400') || '#facc15'}" stroke-dasharray="100, 100" stroke-dashoffset="100" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="absolute inset-0 flex items-center justify-center text-xl filter drop-shadow-md">${p.sIcon}</div>
          <div class="absolute -bottom-2 w-[120%] -ml-[10%] bg-slate-900/80 border border-slate-500 text-[8px] font-bold text-center rounded-full truncate px-1 text-white">${p.skill}</div>
        </div>
        <div id="dead-overlay-${i}" class="absolute inset-0 bg-red-900/80 z-20 hidden flex-col items-center justify-center"><span class="text-2xl">💀</span></div>
      `;
    } else {
      panel.className = "bg-slate-800 border-2 border-slate-600 rounded-lg flex flex-col items-center justify-center p-1 shadow-inner opacity-50";
      panel.innerHTML = `<span class="text-xs text-slate-500 font-bold">空き</span>`;
    }
    container.appendChild(panel);
  }
}

function updateEnemyHpUI() {
  const hpPct = Math.max(0, (battleState.enemy.hp / battleState.enemy.maxHp) * 100);
  const hpBar = document.getElementById('enemy-hp-bar');
  if(hpBar) hpBar.style.width = `${hpPct}%`;

  const shieldPct = Math.max(0, (battleState.enemy.shield / battleState.enemy.maxShield) * 100);
  const shieldBar = document.getElementById('enemy-shield-bar');
  if(shieldBar) {
    shieldBar.style.width = `${shieldPct}%`;
    if(battleState.enemy.isBroken) {
      shieldBar.classList.remove('from-blue-300', 'to-cyan-300');
      shieldBar.classList.add('from-red-500', 'to-red-700');
    } else {
      shieldBar.classList.add('from-blue-300', 'to-cyan-300');
      shieldBar.classList.remove('from-red-500', 'to-red-700');
    }
  }
}

function battleLoop(time) {
  if (!battleState.active) return;
  const dt = (time - battleState.lastTime) / 1000;
  battleState.lastTime = time;

  if (battleState.combo.count > 0) {
    battleState.combo.timer -= dt;
    if (battleState.combo.timer <= 0) {
      battleState.combo.count = 0;
      hideComboDisplay();
    }
  }

  if (battleState.enemy.isBroken) {
    battleState.enemy.shield += (battleState.enemy.maxShield * 0.1) * dt; 
    if (battleState.enemy.shield >= battleState.enemy.maxShield) {
      battleState.enemy.shield = battleState.enemy.maxShield;
      battleState.enemy.isBroken = false;
      const sprite = document.getElementById('enemy-sprite');
      if(sprite) sprite.classList.remove('enemy-break');
      hideBreakDisplay();
    }
    updateEnemyHpUI();
  }

  battleState.party.forEach((p, i) => {
    if (p && p.hp > 0 && p.ct < 100) {
      p.ct += 20 * p.ctSpeed * dt;
      if (p.ct >= 100) {
        p.ct = 100;
        const skillBtn = document.getElementById(`skill-btn-${i}`);
        if(skillBtn) skillBtn.classList.add('ct-glow');
        if (battleState.auto) {
          setTimeout(() => useSkill(i), Math.random() * 500);
        }
      }
      const ctPath = document.getElementById(`ct-path-${i}`);
      if(ctPath) ctPath.style.strokeDashoffset = 100 - p.ct;
    }
  });

  if (battleState.enemy.hp > 0 && !battleState.enemy.isBroken) {
    battleState.enemy.ct += 15 * battleState.enemy.data.enemyCtSpeed * dt;
    const actionInd = document.getElementById('enemy-action-indicator');
    if (battleState.enemy.ct > 80 && actionInd) {
      actionInd.style.opacity = '1';
    }
    if (battleState.enemy.ct >= 100) {
      enemyAttack();
    }
  }

  if (battleState.active) {
    requestAnimationFrame(battleLoop);
  }
}

async function useSkill(index) {
  const p = battleState.party[index];
  if (!p || p.hp <= 0 || p.ct < 100 || !battleState.active) return;

  p.ct = 0;
  const skillBtn = document.getElementById(`skill-btn-${index}`);
  if(skillBtn) skillBtn.classList.remove('ct-glow');
  const ctPath = document.getElementById(`ct-path-${index}`);
  if(ctPath) ctPath.style.strokeDashoffset = 100;

  showSkillCutin(p.icon, p.skill);

  if (p.sPower < 0) {
    executeHeal(p, index);
  } else {
    const hits = p.hits || 1;
    for (let h = 0; h < hits; h++) {
      if(battleState.enemy.hp <= 0) break;
      setTimeout(() => executeDamage(p), h * 200 + 300);
    }
  }
}

function showSkillCutin(icon, name) {
  const cutin = document.getElementById('skill-cutin');
  const iconEl = document.getElementById('cutin-icon');
  const nameEl = document.getElementById('cutin-name');
  if(!cutin || !iconEl || !nameEl) return;

  if (icon.startsWith('data:image')) {
    iconEl.innerHTML = `<img src="${icon}" class="w-12 h-12 rounded-full object-cover">`;
  } else {
    iconEl.innerText = icon;
  }
  nameEl.innerText = name;
  
  cutin.classList.remove('cutin-active');
  void cutin.offsetWidth;
  cutin.classList.add('cutin-active');
}

function executeHeal(p, index) {
  setTimeout(() => {
    const heal = Math.floor(p.atk * Math.abs(p.sPower) * 0.5);
    createImpactEffect(false);
    battleState.party.forEach((member, i) => {
      if (member && member.hp > 0) {
        member.hp = Math.min(member.maxHp, member.hp + heal);
        const hpBar = document.getElementById(`hp-bar-${i}`);
        if(hpBar) hpBar.style.width = `${(member.hp / member.maxHp) * 100}%`;
        showDamagePopup(heal, false, true, i);
      }
    });
  }, 300);
}

function executeDamage(p) {
  if(battleState.enemy.hp <= 0) return;

  createSlashEffect();
  
  battleState.combo.count++;
  battleState.combo.timer = 4.0;
  updateComboDisplay();

  let comboMultiplier = 1.0 + (battleState.combo.count - 1) * 0.1;
  let breakMultiplier = battleState.enemy.isBroken ? 2.0 : 1.0;
  
  let baseDmg = (p.atk * p.sPower) / (p.hits || 1);
  let dmg = Math.floor(baseDmg * comboMultiplier * breakMultiplier * (0.9 + Math.random() * 0.2));
  
  const isCrit = Math.random() < 0.15;
  if (isCrit) dmg = Math.floor(dmg * 1.5);

  battleState.enemy.hp -= dmg;
  
  if (!battleState.enemy.isBroken) {
    const shieldDmg = Math.floor(dmg * 0.3);
    battleState.enemy.shield -= shieldDmg;
    if (battleState.enemy.shield <= 0) {
      triggerBreak();
    }
  }

  showDamagePopup(dmg, isCrit, false);
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite && !battleState.enemy.isBroken) {
    sprite.classList.remove('enemy-idle');
    sprite.classList.add('enemy-hurt');
    setTimeout(() => {
      sprite.classList.remove('enemy-hurt');
      sprite.classList.add('enemy-idle');
    }, 200);
  }

  updateEnemyHpUI();

  if (battleState.enemy.hp <= 0) {
    winBattle();
  }
}

function triggerBreak() {
  battleState.enemy.isBroken = true;
  battleState.enemy.shield = 0;
  battleState.enemy.ct = 0;
  
  const actionInd = document.getElementById('enemy-action-indicator');
  if(actionInd) actionInd.style.opacity = '0';
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite) sprite.classList.add('enemy-break');
  
  const breakDisplay = document.getElementById('break-display');
  if(breakDisplay) breakDisplay.classList.remove('hidden');
  
  const container = document.getElementById('game-container');
  if(container) {
    container.style.transform = 'translate(10px, 10px)';
    setTimeout(() => container.style.transform = 'translate(-10px, -10px)', 50);
    setTimeout(() => container.style.transform = 'translate(10px, -5px)', 100);
    setTimeout(() => container.style.transform = 'translate(0, 0)', 150);
  }
}

function updateComboDisplay() {
  const display = document.getElementById('combo-display');
  const count = document.getElementById('combo-count');
  const bonus = document.getElementById('combo-bonus');
  if(!display || !count || !bonus) return;

  if (battleState.combo.count >= 2) {
    display.classList.remove('hidden');
    count.innerText = battleState.combo.count;
    bonus.innerText = `ダメージ +${(battleState.combo.count - 1) * 10}%`;
    display.style.transform = 'scale(1.2)';
    setTimeout(() => display.style.transform = 'scale(1)', 100);
  }
}
function hideComboDisplay() {
  const display = document.getElementById('combo-display');
  if(display) display.classList.add('hidden');
}
function hideBreakDisplay() {
  const display = document.getElementById('break-display');
  if(display) display.classList.add('hidden');
}

function enemyAttack() {
  battleState.enemy.ct = 0;
  const actionInd = document.getElementById('enemy-action-indicator');
  if(actionInd) actionInd.style.opacity = '0';

  const sprite = document.getElementById('enemy-sprite');
  if(sprite) {
    sprite.classList.remove('enemy-idle');
    sprite.classList.add('enemy-attack');
    setTimeout(() => {
      if(!battleState.enemy.isBroken) sprite.classList.add('enemy-idle');
      sprite.classList.remove('enemy-attack');
    }, 300);
  }

  const alive = battleState.party.map((p, i) => ({...p, i})).filter(p => p && p.hp > 0);
  if (alive.length === 0) return;

  const target = alive[Math.floor(Math.random() * alive.length)];
  const dmg = Math.floor(battleState.enemy.data.enemyAtk * (0.8 + Math.random() * 0.4));
  
  battleState.party[target.i].hp -= dmg;
  const pct = Math.max(0, (battleState.party[target.i].hp / target.maxHp) * 100);
  const hpBar = document.getElementById(`hp-bar-${target.i}`);
  if(hpBar) hpBar.style.width = `${pct}%`;

  createImpactEffect(true, target.i);

  const container = document.getElementById('game-container');
  if(container) {
    container.style.transform = 'translate(5px, 5px)';
    setTimeout(() => container.style.transform = 'translate(0, 0)', 50);
  }

  if (battleState.party[target.i].hp <= 0) {
    const deadOverlay = document.getElementById(`dead-overlay-${target.i}`);
    if(deadOverlay) {
      deadOverlay.classList.remove('hidden');
      deadOverlay.classList.add('flex');
    }
    if (battleState.party.every(p => !p || p.hp <= 0)) {
      loseBattle();
    }
  }
}

function createSlashEffect() {
  const e = document.createElement('div');
  e.className = 'slash-effect';
  e.style.setProperty('--rot', `${Math.random() * 360}deg`);
  const container = document.getElementById('enemy-container');
  if(container) {
    container.appendChild(e);
    setTimeout(() => e.remove(), 200);
  }
}

function createImpactEffect(isEnemyAtk, partyIndex = -1) {
  const e = document.createElement('div');
  e.className = 'impact-effect';
  if (isEnemyAtk && partyIndex >= 0) {
    e.style.top = '80%';
    e.style.left = `${12 + partyIndex * 25}%`;
    const screen = document.getElementById('screen-battle');
    if(screen) screen.appendChild(e);
  } else {
    const field = document.getElementById('battle-field');
    if(field) field.appendChild(e);
  }
  setTimeout(() => e.remove(), 300);
}

function showDamagePopup(amount, isCrit, isHeal, partyIndex = -1, isLevelUp = false) {
  const p = document.createElement('div');
  p.innerText = amount;
  
  let styleClass = 'dmg-normal';
  if (isLevelUp) styleClass = 'dmg-lvlup';
  else if (isHeal) styleClass = 'dmg-heal';
  else if (isCrit) styleClass = 'dmg-crit';
  else if (battleState.enemy.isBroken && !isHeal && partyIndex === -1) styleClass = 'dmg-weak';
  
  p.className = `dmg-popup ${styleClass}`;
  p.style.setProperty('--rot', `${(Math.random() - 0.5) * 20}`);
  
  if (partyIndex >= 0) {
    p.style.bottom = isLevelUp ? '40%' : '25%';
    p.style.left = `${5 + partyIndex * 25}%`;
    const screenBattle = document.getElementById('screen-battle');
    if(screenBattle) screenBattle.appendChild(p);
  } else {
    p.style.top = `${30 + (Math.random() - 0.5) * 20}%`;
    p.style.left = `${40 + (Math.random() - 0.5) * 20}%`;
    const battleField = document.getElementById('battle-field');
    if(battleField) battleField.appendChild(p);
  }
  
  setTimeout(() => p.remove(), isLevelUp ? 2000 : 800);
}

function toggleAutoBattle() {
  battleState.auto = !battleState.auto;
  const btn = document.getElementById('btn-auto');
  if(!btn) return;

  if (battleState.auto) {
    btn.classList.remove('bg-slate-700');
    btn.classList.add('bg-yellow-500', 'text-black');
  } else {
    btn.classList.remove('bg-yellow-500', 'text-black');
    btn.classList.add('bg-slate-700');
  }
}

// ------------------------------------
// EXPとドロップ処理
// ------------------------------------
function processBattleRewards() {
  const expGain = currentQuest.battle.exp;
  saveData.coins += currentQuest.battle.coins;
  
  // EXP処理 (生存している出撃キャラのみ)
  const detailsEl = document.getElementById('result-exp-details');
  if(detailsEl) detailsEl.innerHTML = '';
  
  battleState.party.forEach((p, idx) => {
    if (p && p.hp > 0) {
      if(!saveData.crewData[p.id]) saveData.crewData[p.id] = {level:1, exp:0};
      const cData = saveData.crewData[p.id];
      cData.exp += expGain;
      
      let levelUpCount = 0;
      let reqExp = cData.level * 100;
      while (cData.exp >= reqExp) {
        cData.exp -= reqExp;
        cData.level++;
        levelUpCount++;
        reqExp = cData.level * 100;
      }
      
      if(levelUpCount > 0) {
        showDamagePopup("LEVEL UP!", false, false, idx, true);
      }

      if(detailsEl) {
        const iconHtml = p.icon.startsWith('data:image') ? `<img src="${p.icon}" class="w-6 h-6 rounded-full object-cover">` : `<span class="text-lg filter drop-shadow">${p.icon}</span>`;
        detailsEl.innerHTML += `
          <div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
            <span class="text-xs text-white font-bold flex items-center gap-1">${iconHtml} ${p.name}</span>
            <span class="text-xs ${levelUpCount > 0 ? 'text-yellow-400 font-black animate-pulse' : 'text-blue-200'}">Lv.${cData.level} ${levelUpCount > 0 ? '(UP!)' : ''}</span>
          </div>
        `;
      }
    }
  });

  // ドロップ判定
  const resultDrops = document.getElementById('result-drops');
  const dropList = document.getElementById('result-drop-list');
  if(resultDrops && dropList) {
    dropList.innerHTML = '';
    resultDrops.classList.add('hidden');
    
    const drops = currentQuest.battle.drops;
    let droppedItems = [];

    if(drops) {
      if(drops.weapons) {
        drops.weapons.forEach(wId => {
          if(Math.random() < 0.3) {
            saveData.inventory.weapons.push({ uid: "w"+Date.now()+Math.random(), id: wId, plus: 0, equipTo: null });
            droppedItems.push(WEAPON_MASTER[wId]);
          }
        });
      }
      if(drops.relics) {
        drops.relics.forEach(rId => {
          if(Math.random() < 0.2) {
            saveData.inventory.relics.push({ uid: "r"+Date.now()+Math.random(), id: rId, plus: 0, equipTo: null });
            droppedItems.push(RELIC_MASTER[rId]);
          }
        });
      }
    }

    if(droppedItems.length > 0) {
      resultDrops.classList.remove('hidden');
      droppedItems.forEach(master => {
        dropList.innerHTML += `
          <div class="bg-slate-900 border border-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.5)] rounded-lg p-2 flex flex-col items-center relative">
            <span class="absolute -top-2 -right-2 bg-pink-500 text-white text-[8px] font-black px-1 rounded shadow">GET!</span>
            <span class="text-2xl filter drop-shadow">${master.icon}</span>
            <span class="text-[10px] text-white font-bold mt-1 max-w-[60px] truncate text-center">${master.name}</span>
          </div>
        `;
      });
    }
  }

  const resultExpTotal = document.getElementById('result-exp-total');
  if(resultExpTotal) resultExpTotal.innerText = expGain;
  
  saveGame();
}


function winBattle() {
  if(!battleState.active) return;
  battleState.active = false;
  
  const sprite = document.getElementById('enemy-sprite');
  if(sprite) {
    sprite.style.opacity = '0';
    sprite.style.transform = 'scale(0) rotate(180deg)';
    sprite.style.transition = 'all 0.5s';
  }

  setTimeout(() => {
    const title = document.getElementById('result-title');
    if(title) {
      title.innerText = "WIN!";
      title.className = "text-6xl font-black text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,1)] animate-bounce";
    }
    const coins = document.getElementById('result-coins');
    if(coins) coins.innerText = `${currentQuest.battle.coins}`;
    
    // 報酬計算＆反映
    processBattleRewards();
    
    const result = document.getElementById('battle-result');
    if(result) {
      result.style.display = 'flex';
      result.style.opacity = '0';
      result.style.transition = 'opacity 0.5s';
      setTimeout(() => result.style.opacity = '1', 50);
    }
  }, 1000);
}

function loseBattle() {
  if(!battleState.active) return;
  battleState.active = false;
  
  setTimeout(() => {
    const title = document.getElementById('result-title');
    if(title) {
      title.innerText = "LOSE...";
      title.className = "text-5xl font-black text-blue-400 mb-4 drop-shadow-[0_0_10px_rgba(96,165,250,0.8)]";
    }
    const coins = document.getElementById('result-coins');
    if(coins) coins.innerText = `0`;
    const expTotal = document.getElementById('result-exp-total');
    if(expTotal) expTotal.innerText = `0`;
    
    const detailsEl = document.getElementById('result-exp-details');
    if(detailsEl) detailsEl.innerHTML = '<div class="text-center text-xs text-slate-400 font-bold py-2">全滅したため報酬はありません...</div>';
    
    const resultDrops = document.getElementById('result-drops');
    if(resultDrops) resultDrops.classList.add('hidden');
    
    const result = document.getElementById('battle-result');
    if(result) {
      result.style.display = 'flex';
      result.style.opacity = '0';
      result.style.transition = 'opacity 0.5s';
      setTimeout(() => result.style.opacity = '1', 50);
    }
  }, 1000);
}

function endBattle() {
  if (battleState.enemy.hp <= 0) {
    advPhase = 'post';
    advIndex = 0;
    switchScreen('screen-adv');
    showAdvText();
  } else {
    switchScreen('screen-home');
  }
}

window.onload = () => {
  // 起動時の初期化はユーザーアクションを待つためボタンで行う
};

</script>

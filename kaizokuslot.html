<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>海賊スロット</title>

<style>

*{
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    margin:0;
    background:
    radial-gradient(circle,#333,#000);
    color:white;
    text-align:center;
    min-height:100vh;
}


.game{
    width:420px;
    max-width:95%;
    margin:auto;
    padding:20px;
}


h1{
    color:#ffd700;
    text-shadow:
    0 0 10px gold,
    0 0 20px orange;
}


/* コイン表示 */

.info{
    background:#111;
    border:3px solid gold;
    border-radius:15px;
    padding:10px;
    margin-bottom:15px;
    box-shadow:
    0 0 15px gold;
}


.coin{
    font-size:28px;
    color:#00ff99;
}



/* スロット本体 */

.slot{
    background:#222;
    border:8px solid #888;
    border-radius:25px;
    padding:15px;

    box-shadow:
    inset 0 0 30px black,
    0 0 30px #00ffff;
}


.reels{
    display:flex;
    justify-content:center;
    gap:10px;
}


.reel{

    width:110px;
    height:180px;

    background:white;
    color:black;

    border-radius:10px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;

    overflow:hidden;

    border:5px solid #333;

}



/* ボタン */

button{

    margin:8px;

    padding:15px 25px;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}



.bet{

    background:#00aaff;
    color:white;

}



.max{

    background:#ff9900;
    color:white;

}



.start{

    background:#00cc44;
    color:white;

    font-size:25px;

}



.stop{

    background:#ff3333;
    color:white;

}



.back{

    background:#555;
    color:white;

}



/* レバー */

.lever{

    margin:20px auto;

    width:80px;
    height:80px;

    border-radius:50%;

    background:#222;

    border:5px solid gold;

    display:flex;

    justify-content:center;

    align-items:center;

    color:gold;

    box-shadow:
    0 0 20px gold;

}




/* 当たり演出用 */

.win{

animation:
winFlash 0.5s infinite alternate;

}


.jackpot{

animation:
rainbow 0.5s infinite;

}



@keyframes winFlash{

from{

box-shadow:
0 0 10px gold;

}

to{

box-shadow:
0 0 40px yellow;

}

}



@keyframes rainbow{

0%{
box-shadow:
0 0 40px red;
}

25%{
box-shadow:
0 0 40px blue;
}

50%{
box-shadow:
0 0 40px lime;
}

75%{
box-shadow:
0 0 40px purple;
}

100%{
box-shadow:
0 0 40px pink;
}

}

/* ==========================
   豪華演出アップデート
========================== */


body.shake{

animation:shake 0.1s infinite;

}


@keyframes shake{

0%{
transform:translate(0);
}

25%{
transform:translate(5px,-5px);
}

50%{
transform:translate(-5px,5px);
}

75%{
transform:translate(5px,5px);
}

100%{
transform:translate(0);
}

}




.reel.bigWin{


animation:
bigWin 0.3s infinite alternate;


}



@keyframes bigWin{


from{

transform:scale(1);

filter:
brightness(1);

}



to{

transform:scale(1.15);

filter:
brightness(3);

}


}






.reel.rainbow{


animation:
rainbowLight 0.5s infinite;


}



@keyframes rainbowLight{


0%{

box-shadow:
0 0 30px red;

}



20%{

box-shadow:
0 0 40px orange;

}



40%{

box-shadow:
0 0 50px yellow;

}



60%{

box-shadow:
0 0 50px lime;

}



80%{

box-shadow:
0 0 50px cyan;

}



100%{

box-shadow:
0 0 50px purple;

}


}







.coinPop{


position:fixed;

font-size:40px;

animation:
coinFly 1s forwards;

}



@keyframes coinFly{


from{

transform:
translateY(0)
scale(1);

opacity:1;

}


to{

transform:
translateY(-300px)
scale(1.8);

opacity:0;

}


}








.flash{


position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:white;

opacity:0;

pointer-events:none;


}




.flash.active{


animation:
flash 0.5s;


}




@keyframes flash{


0%{

opacity:0;

}


50%{

opacity:0.8;

}


100%{

opacity:0;

}


}

/* =====================
 実機風追加演出
===================== */


.reel.spinning{

animation:
spinBlur 0.08s infinite;

}



@keyframes spinBlur{


0%{

filter:blur(0px);

transform:
translateY(0);

}



50%{

filter:blur(3px);

transform:
translateY(8px);

}



100%{

filter:blur(0px);

transform:
translateY(0);

}


}





.reel.stopAnim{


animation:
stopBounce 0.35s;


}



@keyframes stopBounce{


0%{

transform:
scale(1.2);

}


60%{

transform:
scale(0.9);

}


100%{

transform:
scale(1);

}


}







.lever.active{


animation:
leverMove 0.4s;


}



@keyframes leverMove{


0%{

transform:
rotate(0deg);

}


50%{

transform:
rotate(35deg);

}


100%{

transform:
rotate(0deg);

}


}






.resultText{


position:fixed;

top:40%;

left:50%;

transform:
translate(-50%,-50%);


font-size:55px;

font-weight:bold;

color:white;


text-shadow:
0 0 20px gold,
0 0 40px orange;


z-index:999;


animation:
resultShow 2s forwards;


}



@keyframes resultShow{


0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0.2);

}



30%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.3);

}



100%{

opacity:0;

transform:
translate(-50%,-50%)
scale(1);

}



}

/* ======================
 配当表
====================== */


.payout{

margin-top:20px;

background:#111;

border:2px solid gold;

border-radius:15px;

padding:10px;


box-shadow:
0 0 15px gold;


}



.payout h3{

color:#ffd700;

}




#jackpotBox{


display:none;


position:fixed;

top:50%;

left:50%;


transform:
translate(-50%,-50%);



font-size:45px;

font-weight:bold;



color:white;


z-index:9999;



text-shadow:

0 0 20px red,
0 0 40px yellow,
0 0 60px cyan;



}






#jackpotBox.show{


display:block;


animation:

jackpotText 3s;


}




@keyframes jackpotText{


0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);


}



40%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.3);


}



100%{

opacity:0;

transform:
translate(-50%,-50%)
scale(1);


}



}







@media(max-width:500px){


.game{

width:100%;

padding:10px;


}



.reel{

width:90px;

height:150px;

font-size:45px;

}



button{

padding:12px;

font-size:15px;

}



}

/* =========================
   本物リール方式
========================= */


.reel{

width:110px;
height:180px;

overflow:hidden;

background:#fff;

border:5px solid #555;

}



.reelWindow{

height:100%;

overflow:hidden;

}




.reelStrip{


position:relative;

top:0;


}



.reelStrip div{


height:180px;


display:flex;

justify-content:center;

align-items:center;


font-size:65px;


}



.reelStrip img{


width:100px;

height:100px;

object-fit:contain;


}





.reelRolling{


animation:
reelMove 0.15s linear infinite;


}




@keyframes reelMove{


from{

transform:translateY(0);

}


to{

transform:translateY(-180px);

}


}




.reelStopping{


animation:

stopReelMove 0.5s;


}



@keyframes stopReelMove{


0%{

transform:translateY(-200px);

}


70%{

transform:translateY(20px);

}


100%{

transform:translateY(0);

}


}

/* =========================
 777 虹パーティクル
========================= */


.particle{


position:fixed;


width:12px;

height:12px;


border-radius:50%;


pointer-events:none;


z-index:99999;


animation:
particleMove 2s forwards;


}



@keyframes particleMove{


0%{


transform:
translate(0,0)
scale(1);


opacity:1;


}



100%{


transform:
translate(
var(--x),
var(--y)
)
scale(0);



opacity:0;


}



}



.jackpotAura{


position:fixed;


top:50%;

left:50%;


width:300px;

height:300px;


transform:
translate(-50%,-50%);


border-radius:50%;


background:
radial-gradient(
circle,
rgba(255,255,255,0.9),
rgba(255,0,255,0)
);



animation:

auraPulse 0.5s infinite;


z-index:9998;


pointer-events:none;


}




@keyframes auraPulse{


0%{

transform:
translate(-50%,-50%)
scale(0.8);


opacity:0.5;


}



100%{


transform:
translate(-50%,-50%)
scale(1.5);


opacity:0;


}


}

/* =========================
   777 黄金筐体演出
========================= */


.slot.jackpotGold{


background:
linear-gradient(
135deg,
#fff3a0,
#ffd700,
#b8860b,
#fff3a0
);


border-color:#fff;


box-shadow:

0 0 20px gold,
0 0 50px orange,
0 0 100px yellow;


animation:

goldMachine 0.5s infinite alternate;


}



@keyframes goldMachine{


from{


filter:
brightness(1);


transform:
scale(1);


}



to{


filter:
brightness(1.8);


transform:
scale(1.03);


}



}




.slot.jackpotGold::before{


content:"";


position:absolute;


inset:0;


border-radius:25px;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.8),
transparent
);


animation:

goldSweep 1s infinite;


}



@keyframes goldSweep{


0%{


transform:
translateX(-120%);


}



100%{


transform:
translateX(120%);


}


}

/* ==========================
   777 JACKPOT筐体演出
========================== */


.jackpotTitle{

position:fixed;

top:18%;

left:50%;

transform:
translateX(-50%);


font-size:70px;

font-weight:900;


color:#fff;


text-shadow:

0 0 20px red,
0 0 40px gold,
0 0 70px cyan;


z-index:10000;


animation:

jackpotTitleAnim 3s;


}



@keyframes jackpotTitleAnim{


0%{

opacity:0;

transform:
translateX(-50%)
scale(0);


}


30%{

opacity:1;

transform:
translateX(-50%)
scale(1.2);


}



100%{

opacity:0;

transform:
translateX(-50%)
scale(1);


}


}






.jackpotLamp{


animation:

lampFlash 0.3s infinite;


}



@keyframes lampFlash{


0%{

box-shadow:
0 0 10px red;


}


33%{

box-shadow:
0 0 20px yellow;


}



66%{

box-shadow:
0 0 30px cyan;


}



100%{

box-shadow:
0 0 20px purple;


}


}





.jackpotButton{


background:

linear-gradient(
gold,
orange
)!important;


color:white!important;


box-shadow:

0 0 20px gold;


}



.jackpotLever{


background:

gold!important;


color:black!important;


box-shadow:

0 0 40px yellow!important;


}





.payoutCounter{


position:fixed;


bottom:20%;

left:50%;


transform:
translateX(-50%);


font-size:45px;


font-weight:bold;


color:#fff;


text-shadow:

0 0 20px gold;


z-index:10001;


}

/* =========================
777確定リーチ演出
========================= */


.reachScreen{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:
radial-gradient(
circle,
rgba(255,215,0,0.8),
rgba(0,0,0,0.95)
);


z-index:20000;

display:flex;

align-items:center;

justify-content:center;


}



.reachText{

font-size:80px;

font-weight:900;

color:white;


text-shadow:

0 0 20px red,
0 0 40px gold,
0 0 80px orange;


animation:

reachPulse 0.4s infinite alternate;


}



@keyframes reachPulse{


from{

transform:scale(1);

}


to{

transform:scale(1.2);

}


}





.final777{


animation:

final777Flash 0.2s infinite;


}



@keyframes final777Flash{


0%{

filter:
brightness(1);


}



50%{

filter:
brightness(4);


}



100%{

filter:
brightness(1);


}



}

</style>

</head>


<body>


<div class="game">


<h1>🏴‍☠️ 海賊スロット 🏴‍☠️</h1>



<div class="info">

<div>
草コイン
</div>

<div class="coin" id="coins">
50000
</div>


<div>
BET:
<span id="bet">
0
</span>

</div>


</div>




<div class="slot">


<div class="reels">


<div class="reel">

<div class="reelWindow">

<div class="reelStrip" id="reel1">

<div>🍒</div>
<div>🍇</div>
<div>🔔</div>
<div>🍉</div>

<div>
<img src="777.png">
</div>

<div>🍎</div>

</div>

</div>

</div>>


<div class="reel">

<div class="reelWindow">

<div class="reelStrip" id="reel2">

<div>🍒</div>
<div>🍇</div>
<div>🔔</div>
<div>🍉</div>

<div>
<img src="777.png">
</div>

<div>🍎</div>

</div>

</div>

</div>

<div class="reel">

<div class="reelWindow">

<div class="reelStrip" id="reel3">

<div>🍒</div>
<div>🍇</div>
<div>🔔</div>
<div>🍉</div>

<div>
<img src="777.png">
</div>

<div>🍎</div>

</div>

</div>

</div>
</div>



<div>


<button class="stop" id="stop1">
STOP
</button>

<button class="stop" id="stop2">
STOP
</button>

<button class="stop" id="stop3">
STOP
</button>


</div>


</div>




<div class="lever" id="lever">

レバー

</div>



<button class="start" id="start">

START

</button>



<br>



<button class="bet" id="betBtn">

BET

</button>


<button class="max" id="maxBtn">

MAX BET

</button>


<div class="payout">

<h3>🎰 配当表</h3>

<p>🌈 777 → BET ×10</p>
<p>🍇 🍒 🍎 🍉 🔔 → BET ×3</p>

</div>


<div id="jackpotBox"></div>


<br>


<button class="back"
onclick="location.href='kaizoku.html'">

🏴‍☠️ 戻る

</button>



</div>





<!-- 音声 -->

<audio id="bgm" src="スロット.mp3" loop></audio>


<audio id="startSE"
src="スタートレバー.mp3">
</audio>


<audio id="stopSE"
src="ストップボタン.mp3">
</audio>


<audio id="betSE"
src="ベット.mp3">
</audio>


<audio id="winSE"
src="当たり.mp3">
</audio>


<audio id="jackpotSE"
src="超当たり.mp3">
</audio>



<script>


const SAVE_NAME="kaizoku";


const symbols=[
"777",
"🍇",
"🍒",
"🍎",
"🍉",
"🔔"
];


// コイン

let coins=50000;


// BET

let bet=0;


// リール状態

let reels=[
0,
0,
0
];


let spinning=[
false,
false,
false
];


let timers=[
null,
null,
null
];



// 要素

const coinsEl=document.getElementById("coins");

const betEl=document.getElementById("bet");


const reelEls=[
document.getElementById("reel1"),
document.getElementById("reel2"),
document.getElementById("reel3")
];


const bgm=document.getElementById("bgm");

const startSE=document.getElementById("startSE");

const stopSE=document.getElementById("stopSE");

const betSE=document.getElementById("betSE");




// セーブ読み込み

try{

let data=
JSON.parse(
localStorage.getItem(SAVE_NAME)||"{}"
);


if(typeof data.coins==="number"){

coins=data.coins;

}


}catch(e){}




function saveCoins(){

let data={};

try{

data=
JSON.parse(
localStorage.getItem(SAVE_NAME)||"{}"
);


}catch(e){}



data.coins=coins;


localStorage.setItem(
SAVE_NAME,
JSON.stringify(data)
);


coinsEl.textContent=
coins.toLocaleString();

}




saveCoins();





// BET

document.getElementById("betBtn")
.onclick=function(){


if(coins<=0)return;


bet++;


if(bet>1000){

bet=1000;

}


betEl.textContent=bet;


betSE.currentTime=0;

betSE.play();



};







// MAX BET

document.getElementById("maxBtn")
.onclick=function(){


if(coins<=0)return;


bet=coins;


betEl.textContent=
bet;


betSE.currentTime=0;

betSE.play();


};









// BGM開始

function playBGM(){

bgm.volume=0.5;

bgm.play();

}





// START

document.getElementById("start")
.onclick=function(){


if(bet<=0){

alert("BETしてください");

return;

}


if(bet>coins){

alert("コイン不足");

return;

}



coins-=bet;


saveCoins();



playBGM();


startSE.currentTime=0;

startSE.play();



startSpin();



};









// レバーでも開始

document.getElementById("lever")
.onclick=function(){

document.getElementById("start").click();

};








// 回転開始

function startSpin(){


for(let i=0;i<3;i++){


spinning[i]=true;



let strip=
reelEls[i]
.querySelector(".reelStrip");



strip.classList.add(
"reelRolling"
);



}

}








// STOP

function stopReel(index){


if(!spinning[index]) return;



let strip=
reelEls[index]
.querySelector(".reelStrip");



strip.classList.remove(
"reelRolling"
);



strip.classList.add(
"reelStopping"
);



spinning[index]=false;



stopSE.currentTime=0;

stopSE.play();



setTimeout(()=>{


strip.classList.remove(
"reelStopping"
);



},600);



checkAllStop();


}




document.getElementById("stop1")
.onclick=function(){

stopReel(0);

};



document.getElementById("stop2")
.onclick=function(){

stopReel(1);

};



document.getElementById("stop3")
.onclick=function(){

stopReel(2);

};







// リールを押して停止

reelEls[0].onclick=function(){

stopReel(0);

};


reelEls[1].onclick=function(){

stopReel(1);

};


reelEls[2].onclick=function(){

stopReel(2);

};

// ============================
// Part3 追加コード
// ============================


// 777画像表示
function showSymbol(index){


if(symbols[reels[index]]==="777"){


reelEls[index].innerHTML=
`
<img src="777.png"
style="
width:90px;
height:90px;
object-fit:contain;
">
`;

}else{


reelEls[index].textContent=
symbols[reels[index]];


}


}




// 全停止チェック

function checkAllStop(){


if(
spinning[0]||
spinning[1]||
spinning[2]
){

return;

}



checkResult();



}






// 停止処理を上書き

const oldStopReel=stopReel;


stopReel=function(index){


oldStopReel(index);



showSymbol(index);



setTimeout(()=>{

checkAllStop();


},300);



};








// 払い出し

function addCoins(amount){


coins+=amount;


saveCoins();


}








// 当たり判定

function checkResult(){



let result=


[
symbols[reels[0]],
symbols[reels[1]],
symbols[reels[2]]
];





let payout=0;





// 777

if(
result[0]==="777" &&
result[1]==="777" &&
result[2]==="777"
){


payout=bet*10;


jackpotEffect();



}





// 通常当たり


else if(
result[0]===result[1] &&
result[1]===result[2]
){



payout=bet*3;


normalEffect();



}





// 2個一致


else if(
result[0]===result[1] ||
result[1]===result[2] ||
result[0]===result[2]
){



payout=bet*1;


normalEffect();


}





if(payout>0){


addCoins(payout);



}else{


saveCoins();


}





bet=0;

betEl.textContent=0;



}










// 通常当たり演出

function normalEffect(){

// コイン演出

function coinEffect(count=20){



for(let i=0;i<count;i++){



let coin=
document.createElement("div");


coin.className="coinPop";


coin.textContent="🪙";



coin.style.left=
Math.random()*100+"%";


coin.style.top=
"60%";



coin.style.animationDelay=
(Math.random()*0.5)+"s";



document.body.appendChild(coin);



setTimeout(()=>{


coin.remove();


},1500);



}


}

// =========================
// 777 虹パーティクル
// =========================


function createRainbowParticles(amount=150){



for(let i=0;i<amount;i++){



let p=
document.createElement("div");



p.className="particle";



let colors=[

"red",
"orange",
"yellow",
"lime",
"cyan",
"blue",
"purple",
"pink"

];



p.style.background=
colors[
Math.floor(
Math.random()*colors.length
)
];




p.style.left=
"50%";


p.style.top=
"50%";




let x=
(Math.random()-0.5)
*window.innerWidth*1.5;



let y=
(Math.random()-0.5)
*window.innerHeight*1.5;



p.style.setProperty(
"--x",
x+"px"
);



p.style.setProperty(
"--y",
y+"px"
);



p.style.animationDelay=
(Math.random()*0.8)+"s";



document.body.appendChild(p);



setTimeout(()=>{


p.remove();


},2500);



}


}

function payoutCounter(amount){


let counter=
document.createElement("div");


counter.className=
"payoutCounter";


document.body.appendChild(counter);



let num=0;



let timer=
setInterval(()=>{


num+=Math.ceil(
amount/50
);



if(num>=amount){

num=amount;

clearInterval(timer);


}



counter.textContent=
"払い出し "+num+" COIN";



},30);




setTimeout(()=>{


counter.remove();


},4000);



}

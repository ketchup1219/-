<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>海賊スロット</title>

<style>

*{
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    margin:0;
    background:
    radial-gradient(circle at top,#7b6a2b 0%,#1d1505 30%,#020202 100%);
    color:white;
    text-align:center;
    min-height:100vh;
    padding:24px 0 50px;
    position:relative;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.16), transparent 50%),
    repeating-linear-gradient(120deg, rgba(255,255,255,.04) 0 2px, transparent 2px 12px);
    mix-blend-mode:screen;
    pointer-events:none;
    animation:shine 12s linear infinite;
}

.game{
    width:500px;
    max-width:96%;
    margin:auto;
    padding:26px 24px 24px;
    position:relative;
    border-radius:32px;
    background:linear-gradient(145deg,#302a20,#101010 70%);
    border:4px solid #c7a23c;
    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -10px 30px rgba(0,0,0,.45),
    0 22px 60px rgba(0,0,0,.6),
    0 0 0 2px rgba(255,255,255,.08);
}

.game::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%);
    pointer-events:none;
}


h1{
    color:#ffd700;
    text-shadow:
    0 0 10px gold,
    0 0 20px orange;
}


/* コイン表示 */

.info{
    background:linear-gradient(145deg,#3b2f19,#171311);
    border:3px solid #e6c04f;
    border-radius:18px;
    padding:12px 16px;
    margin-bottom:16px;
    box-shadow:inset 0 0 12px rgba(255,255,255,0.08), 0 0 24px rgba(255,194,0,0.18);
}


.coin{
    font-size:28px;
    color:#00ff99;
}



/* スロット本体 */

.slot{
    background:linear-gradient(145deg,#4c3f2b,#171717 60%,#2a2015);
    border:10px solid #d8c18a;
    border-radius:30px;
    padding:18px;
    position:relative;
    box-shadow:
    inset 0 0 35px rgba(0,0,0,0.8),
    0 0 45px rgba(0,255,255,0.14),
    0 16px 30px rgba(0,0,0,.4);
    overflow:hidden;
}

.slot::before{
    content:"";
    position:absolute;
    inset:8px;
    border:2px solid rgba(255,255,255,.24);
    border-radius:24px;
    pointer-events:none;
}

.slot::after{
    content:"";
    position:absolute;
    top:-20%;
    left:-20%;
    width:140%;
    height:140%;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.16), transparent 50%);
    pointer-events:none;
}


.reels{
    display:flex;
    justify-content:center;
    gap:12px;
}


.reel{

    width:120px;
    height:190px;

    background:linear-gradient(180deg,#fefcf8 0%,#d6c8a0 45%,#8f6e2f 100%);
    color:black;

    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;

    overflow:hidden;

    border:5px solid #2e280d;
    box-shadow:inset 0 0 20px rgba(0,0,0,0.35), 0 8px 16px rgba(0,0,0,0.3);
    position:relative;

}

.reel::before{
    content:"";
    position:absolute;
    inset:4px;
    border:2px solid rgba(255,255,255,.45);
    border-radius:12px;
    pointer-events:none;
}



/* ボタン */

button{

    margin:8px;

    padding:14px 24px;

    border:none;

    border-radius:18px;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    transition:transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    color:white;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);

}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.06);
}



.bet{

    background:linear-gradient(180deg,#30b3ff,#0d6ccc);
    box-shadow:0 10px 20px rgba(0, 120, 255, .24);

}



.max{

    background:linear-gradient(180deg,#ffb341,#ff7800);
    box-shadow:0 10px 20px rgba(255, 133, 0, .24);

}



.stop{

    background:linear-gradient(180deg,#ff5f5f,#bb0d00);
    box-shadow:0 10px 20px rgba(255, 59, 59, .24);

}



.back{

    background:linear-gradient(180deg,#666,#222);
    color:white;

}



/* レバー */

.lever{

    position:absolute;
    left:24px;
    bottom:24px;

    width:112px;
    height:112px;

    border-radius:50%;

    background:linear-gradient(145deg,#4e4330,#111);

    border:7px solid #d7a900;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#ffe48a;

    box-shadow:0 0 24px rgba(255,215,0,0.2), inset 0 0 18px rgba(255,255,255,0.16), 0 12px 24px rgba(0,0,0,0.35);
    font-weight:800;

    transform-origin:bottom center;
    letter-spacing:0.04em;

}

.lever::before{
    content:"";
    position:absolute;
    inset:9px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.18);
    pointer-events:none;
}

.lever::after{
    content:"";
    position:absolute;
    inset:16px 18px auto auto;
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle, #fff3b7 0%, transparent 70%);
    opacity:0.8;
    pointer-events:none;
}

.lever.active{
    animation:leverPull 0.45s ease;
}

.lever.disabled{
    opacity:0.65;
    filter:grayscale(0.1);
    pointer-events:none;
}

@keyframes leverPull{
    0%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(18deg) scale(1.03);}
    100%{transform:rotate(0deg) scale(1);}
}

@keyframes shine{
    0%{transform:translate3d(-3%, -3%, 0);}
    50%{transform:translate3d(3%, 3%, 0);}
    100%{transform:translate3d(-3%, -3%, 0);}
}




/* 当たり演出用 */

.win{

animation:
winFlash 0.5s infinite alternate;

}


.jackpot{

animation:
rainbow 0.5s infinite;

}



@keyframes winFlash{

from{

box-shadow:
0 0 10px gold;

}

to{

box-shadow:
0 0 40px yellow;

}

}



@keyframes rainbow{

0%{
box-shadow:
0 0 40px red;
}

25%{
box-shadow:
0 0 40px blue;
}

50%{
box-shadow:
0 0 40px lime;
}

75%{
box-shadow:
0 0 40px purple;
}

100%{
box-shadow:
0 0 40px pink;
}

}

/* ==========================
   豪華演出アップデート
========================== */


body.shake{

animation:shake 0.1s infinite;

}


@keyframes shake{

0%{
transform:translate(0);
}

25%{
transform:translate(5px,-5px);
}

50%{
transform:translate(-5px,5px);
}

75%{
transform:translate(5px,5px);
}

100%{
transform:translate(0);
}

}




.reel.bigWin{


animation:
bigWin 0.3s infinite alternate;


}



@keyframes bigWin{


from{

transform:scale(1);

filter:
brightness(1);

}



to{

transform:scale(1.15);

filter:
brightness(3);

}


}






.reel.rainbow{


animation:
rainbowLight 0.5s infinite;


}



@keyframes rainbowLight{


0%{

box-shadow:
0 0 30px red;

}



20%{

box-shadow:
0 0 40px orange;

}



40%{

box-shadow:
0 0 50px yellow;

}



60%{

box-shadow:
0 0 50px lime;

}



80%{

box-shadow:
0 0 50px cyan;

}



100%{

box-shadow:
0 0 50px purple;

}


}







.coinPop{


position:fixed;

font-size:40px;

animation:
coinFly 1s forwards;

}



@keyframes coinFly{


from{

transform:
translateY(0)
scale(1);

opacity:1;

}


to{

transform:
translateY(-300px)
scale(1.8);

opacity:0;

}


}








.flash{


position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:white;

opacity:0;

pointer-events:none;


}




.flash.active{


animation:
flash 0.5s;


}




@keyframes flash{


0%{

opacity:0;

}


50%{

opacity:0.8;

}


100%{

opacity:0;

}


}

/* =====================
 実機風追加演出
===================== */


.reel.spinning{

animation:
spinBlur 0.08s infinite;

}



@keyframes spinBlur{


0%{

filter:blur(0px);

transform:
translateY(0);

}



50%{

filter:blur(3px);

transform:
translateY(8px);

}



100%{

filter:blur(0px);

transform:
translateY(0);

}


}





.reel.stopAnim{


animation:
stopBounce 0.35s;


}



@keyframes stopBounce{


0%{

transform:
scale(1.2);

}


60%{

transform:
scale(0.9);

}


100%{

transform:
scale(1);

}


}







.lever.active{


animation:
leverMove 0.4s;


}



@keyframes leverMove{


0%{

transform:
rotate(0deg);

}


50%{

transform:
rotate(35deg);

}


100%{

transform:
rotate(0deg);

}


}






.resultText{


position:fixed;

top:40%;

left:50%;

transform:
translate(-50%,-50%);


font-size:55px;

font-weight:bold;

color:white;


text-shadow:
0 0 20px gold,
0 0 40px orange;


z-index:999;


animation:
resultShow 2s forwards;


}



@keyframes resultShow{


0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0.2);

}



30%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.3);

}



100%{

opacity:0;

transform:
translate(-50%,-50%)
scale(1);

}



}

/* ======================
 配当表
====================== */


.payout{

margin-top:20px;

background:#111;

border:2px solid gold;

border-radius:15px;

padding:10px;


box-shadow:
0 0 15px gold;


}



.payout h3{

color:#ffd700;

}




#jackpotBox{


display:none;


position:fixed;

top:50%;

left:50%;


transform:
translate(-50%,-50%);



font-size:45px;

font-weight:bold;



color:white;


z-index:9999;



text-shadow:

0 0 20px red,
0 0 40px yellow,
0 0 60px cyan;



}






#jackpotBox.show{


display:block;


animation:

jackpotText 3s;


}




@keyframes jackpotText{


0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);


}



40%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.3);


}



100%{

opacity:0;

transform:
translate(-50%,-50%)
scale(1);


}



}







@media(max-width:500px){


.game{

width:100%;

padding:10px;


}



.reel{

width:90px;

height:150px;

font-size:45px;

}



button{

padding:12px;

font-size:15px;

}



}

/* =========================
   本物リール方式
========================= */


.reel{

width:110px;
height:180px;

overflow:hidden;

background:#fff;

border:5px solid #555;

}



.reelWindow{

height:100%;

overflow:hidden;

}




.reelStrip{

position:relative;
top:0;
display:flex;
flex-direction:column;
will-change:transform;

}



.reelStrip div{


height:180px;


display:flex;

justify-content:center;

align-items:center;


font-size:65px;


}



.reelStrip img{


width:100px;

height:100px;

object-fit:contain;


}





.reelRolling{


animation:
reelMove 0.15s linear infinite;


}




@keyframes reelMove{


from{

transform:translateY(0);

}


to{

transform:translateY(-180px);

}


}




.reelStopping{


animation:

stopReelMove 0.5s;


}



@keyframes stopReelMove{


0%{

transform:translateY(-200px);

}


70%{

transform:translateY(20px);

}


100%{

transform:translateY(0);

}


}

/* =========================
 777 虹パーティクル
========================= */


.particle{


position:fixed;


width:12px;

height:12px;


border-radius:50%;


pointer-events:none;


z-index:99999;


animation:
particleMove 2s forwards;


}



@keyframes particleMove{


0%{


transform:
translate(0,0)
scale(1);


opacity:1;


}



100%{


transform:
translate(
var(--x),
var(--y)
)
scale(0);



opacity:0;


}



}



.jackpotAura{


position:fixed;


top:50%;

left:50%;


width:300px;

height:300px;


transform:
translate(-50%,-50%);


border-radius:50%;


background:
radial-gradient(
circle,
rgba(255,255,255,0.9),
rgba(255,0,255,0)
);



animation:

auraPulse 0.5s infinite;


z-index:9998;


pointer-events:none;


}




@keyframes auraPulse{


0%{

transform:
translate(-50%,-50%)
scale(0.8);


opacity:0.5;


}



100%{


transform:
translate(-50%,-50%)
scale(1.5);


opacity:0;


}


}

/* =========================
   777 黄金筐体演出
========================= */


.slot.jackpotGold{


background:
linear-gradient(
135deg,
#fff3a0,
#ffd700,
#b8860b,
#fff3a0
);


border-color:#fff;


box-shadow:

0 0 20px gold,
0 0 50px orange,
0 0 100px yellow;


animation:

goldMachine 0.5s infinite alternate;


}



@keyframes goldMachine{


from{


filter:
brightness(1);


transform:
scale(1);


}



to{


filter:
brightness(1.8);


transform:
scale(1.03);


}



}




.slot.jackpotGold::before{


content:"";


position:absolute;


inset:0;


border-radius:25px;


background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.8),
transparent
);


animation:

goldSweep 1s infinite;


}



@keyframes goldSweep{


0%{


transform:
translateX(-120%);


}



100%{


transform:
translateX(120%);


}


}

/* ==========================
   777 JACKPOT筐体演出
========================== */


.jackpotTitle{

position:fixed;

top:18%;

left:50%;

transform:
translateX(-50%);


font-size:70px;

font-weight:900;


color:#fff;


text-shadow:

0 0 20px red,
0 0 40px gold,
0 0 70px cyan;


z-index:10000;


animation:

jackpotTitleAnim 3s;


}



@keyframes jackpotTitleAnim{


0%{

opacity:0;

transform:
translateX(-50%)
scale(0);


}


30%{

opacity:1;

transform:
translateX(-50%)
scale(1.2);


}



100%{

opacity:0;

transform:
translateX(-50%)
scale(1);


}


}






.jackpotLamp{


animation:

lampFlash 0.3s infinite;


}



@keyframes lampFlash{


0%{

box-shadow:
0 0 10px red;


}


33%{

box-shadow:
0 0 20px yellow;


}



66%{

box-shadow:
0 0 30px cyan;


}



100%{

box-shadow:
0 0 20px purple;


}


}





.jackpotButton{


background:

linear-gradient(
gold,
orange
)!important;


color:white!important;


box-shadow:

0 0 20px gold;


}



.jackpotLever{


background:

gold!important;


color:black!important;


box-shadow:

0 0 40px yellow!important;


}





.payoutCounter{


position:fixed;


bottom:20%;

left:50%;


transform:
translateX(-50%);


font-size:45px;


font-weight:bold;


color:#fff;


text-shadow:

0 0 20px gold;


z-index:10001;


}

/* =========================
777確定リーチ演出
========================= */


.reachScreen{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:
radial-gradient(
circle,
rgba(255,215,0,0.8),
rgba(0,0,0,0.95)
);


z-index:20000;

display:flex;

align-items:center;

justify-content:center;


}



.reachText{

font-size:80px;

font-weight:900;

color:white;


text-shadow:

0 0 20px red,
0 0 40px gold,
0 0 80px orange;


animation:

reachPulse 0.4s infinite alternate;


}



@keyframes reachPulse{


from{

transform:scale(1);

}


to{

transform:scale(1.2);

}


}





.final777{


animation:

final777Flash 0.2s infinite;


}



@keyframes final777Flash{


0%{

filter:
brightness(1);


}



50%{

filter:
brightness(4);


}



100%{

filter:
brightness(1);


}



}

</style>

</head>

<script>
const SAVE_NAME = "kaizoku";
const symbolNames = ["777", "🍇", "🍒", "🍎", "🍉", "🔔"];
const reelItems = ["🍒", "🍇", "🔔", "🍉", "🍎", "777"];

let coins = 50000;
let bet = 0;
let reels = [0, 0, 0];
let spinning = [false, false, false];
let roundActive = false;

const coinsEl = document.getElementById("coins");
const betEl = document.getElementById("bet");
const reelEls = Array.from(document.querySelectorAll(".reel"));
const leverEl = document.getElementById("lever");
const bgm = document.getElementById("bgm");
const startSE = document.getElementById("startSE");
const stopSE = document.getElementById("stopSE");
const betSE = document.getElementById("betSE");
const winSE = document.getElementById("winSE");
const jackpotSE = document.getElementById("jackpotSE");
const slotMachineEl = document.getElementById("slotMachine") || document.querySelector(".slot");
const gameRoot = document.querySelector(".game");
const slotStatusEl = document.createElement("div");
slotStatusEl.id = "slotStatus";
slotStatusEl.style.cssText = "margin:10px 0 12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.14);color:#fff;font-weight:700;letter-spacing:0.4px;";
slotStatusEl.textContent = "🎰 BETしてレバーを引く！";

function saveCoins() {
  let data = {};
  try {
    data = JSON.parse(localStorage.getItem(SAVE_NAME) || "{}");
  } catch (e) {}
  data.coins = coins;
  localStorage.setItem(SAVE_NAME, JSON.stringify(data));
  coinsEl.textContent = coins.toLocaleString();
}

function playBGM() {
  bgm.volume = 0.5;
  bgm.play();
}

function updateStatus(text, color = "#fff") {
  slotStatusEl.textContent = text;
  slotStatusEl.style.color = color;
}

function setSpinControls(spinningNow) {
  const betBtn = document.getElementById("betBtn");
  const maxBtn = document.getElementById("maxBtn");
  const stopButtons = document.querySelectorAll(".stop");

  betBtn.disabled = spinningNow;
  maxBtn.disabled = spinningNow;
  stopButtons.forEach((btn) => {
    btn.disabled = !spinningNow;
  });

  betBtn.style.opacity = spinningNow ? "0.6" : "1";
  maxBtn.style.opacity = spinningNow ? "0.6" : "1";
  leverEl.classList.toggle("disabled", spinningNow);
  leverEl.style.opacity = spinningNow ? "0.65" : "1";
}

function buildReelMarkup() {
  return reelItems.map((item) => `<div>${item === "777" ? '<img src="777.png" style="width:90px;height:90px;object-fit:contain;">' : item}</div>`).join("");
}

function getReelStrip(index) {
  return reelEls[index].querySelector(".reelStrip");
}

function startSpin() {
  if (roundActive || spinning.some(Boolean)) return;
  if (bet <= 0) {
    alert("BETしてください");
    return;
  }
  if (bet > coins) {
    alert("コイン不足");
    return;
  }

  coins -= bet;
  saveCoins();
  roundActive = true;
  setSpinControls(true);
  updateStatus("🎰 スピン中…", "#ffd700");

  playBGM();
  startSE.currentTime = 0;
  startSE.play();

  reelEls.forEach((reelEl, index) => {
    const strip = getReelStrip(index);
    if (!strip) return;
    spinning[index] = true;
    reels[index] = Math.floor(Math.random() * symbolNames.length);
    strip.classList.remove("reelStopping");
    strip.classList.add("reelRolling");
    strip.innerHTML = buildReelMarkup();
    strip.style.transform = "translateY(0)";
    strip.style.transition = "none";
    strip.style.animation = "reelMove 0.12s linear infinite";
    // clear any previous final-symbol marker so DOM is source-of-truth
    reelEl.removeAttribute('data-symbol');
  });
}

function stopReel(index) {
  if (!roundActive || !spinning[index]) return;

  spinning[index] = false;
  reels[index] = Math.floor(Math.random() * symbolNames.length);

  const strip = getReelStrip(index);
  if (!strip) return;

  strip.classList.remove("reelRolling");
  strip.classList.add("reelStopping");
  strip.style.animation = "none";
  strip.innerHTML = `<div>${symbolNames[reels[index]] === "777" ? '<img src="777.png" style="width:90px;height:90px;object-fit:contain;">' : symbolNames[reels[index]]}</div>`;

  // mark the visible symbol on the reel element so result checks the actual display
  reelEls[index].setAttribute('data-symbol', symbolNames[reels[index]]);

  stopSE.currentTime = 0;
  stopSE.play();

  setTimeout(() => {
    strip.classList.remove("reelStopping");
  }, 480);

  if (!spinning.some(Boolean)) {
    setTimeout(checkResult, 650);
  }
}

function addCoins(amount) {
  coins += amount;
  saveCoins();
}

function evaluatePayout(result, roundBet) {
  // only pay out for three of a kind
  if (result.every((symbol) => symbol === "777")) return roundBet * 10;
  if (result.every((symbol) => symbol === result[0])) return roundBet * 3;
  return 0;
}

function showResult(text) {
  const div = document.createElement("div");
  div.className = "resultText";
  div.textContent = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1800);
}

function createFlash() {
  const flash = document.createElement("div");
  flash.className = "flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.classList.add("active"), 10);
  setTimeout(() => flash.remove(), 700);
}

function triggerWinEffect(payout, result, roundBet) {
  createFlash();

  // count symbols to avoid relying on payout math
  const counts = result.reduce((acc, s) => {
    acc[s] = (acc[s] || 0) + 1;
    return acc;
  }, {});
  const maxCount = Math.max(...Object.values(counts));

  if (maxCount === 3) {
    // three of a kind
    const threeSymbol = Object.keys(counts).find((k) => counts[k] === 3);
    if (threeSymbol === "777") {
      showResult("🌈 JACKPOT 777 🌈");
      jackpotSE.currentTime = 0;
      jackpotSE.play();
      slotMachineEl.classList.add("jackpotGold");
      document.body.classList.add("shake");
      setTimeout(() => {
        slotMachineEl.classList.remove("jackpotGold");
        document.body.classList.remove("shake");
      }, 4000);
      return;
    }
    showResult("🎉 BIG WIN 🎉");
    winSE.currentTime = 0;
    winSE.play();
    slotMachineEl.classList.add("win");
    setTimeout(() => slotMachineEl.classList.remove("win"), 1800);
    return;
  }

}

function checkResult() {
  const roundBet = bet;
  // prefer the symbol recorded on the DOM (what's actually shown). Fallback to internal `reels`.
  const result = reelEls.map((el, idx) => el.getAttribute('data-symbol') || symbolNames[reels[idx]]);
  const payout = evaluatePayout(result, roundBet);

  if (payout > 0) {
    addCoins(payout);
    triggerWinEffect(payout, result, roundBet);
    updateStatus(`🎉 ${payout.toLocaleString()} COIN 獲得！`, "#00ff99");
  } else {
    saveCoins();
    showResult("😢 もう一回");
    updateStatus("😢 もう一回挑戦！", "#ffcc00");
  }

  bet = 0;
  betEl.textContent = "0";
  roundActive = false;
  setSpinControls(false);
  updateStatus("🎰 BETしてレバーを引く！", "#ffd700");
}

try {
  const data = JSON.parse(localStorage.getItem(SAVE_NAME) || "{}");
  if (typeof data.coins === "number") coins = data.coins;
} catch (e) {}

saveCoins();

document.getElementById("betBtn").onclick = function () {
  if (roundActive || coins <= 0) return;
  bet = Math.min(coins, bet + 100);
  betEl.textContent = bet.toLocaleString();
  betSE.currentTime = 0;
  betSE.play();
  updateStatus(`💰 BET ${bet.toLocaleString()} COIN`, "#00e5ff");
};

document.getElementById("maxBtn").onclick = function () {
  if (roundActive || coins <= 0) return;
  bet = coins;
  betEl.textContent = bet.toLocaleString();
  betSE.currentTime = 0;
  betSE.play();
  updateStatus(`💎 MAX BET ${bet.toLocaleString()} COIN`, "#ffb300");
};

leverEl.onclick = function () {
  leverEl.classList.remove("active");
  void leverEl.offsetWidth;
  leverEl.classList.add("active");
  startSpin();
};

document.getElementById("stop1").onclick = function () { stopReel(0); };
document.getElementById("stop2").onclick = function () { stopReel(1); };
document.getElementById("stop3").onclick = function () { stopReel(2); };
reelEls[0].onclick = function () { stopReel(0); };
reelEls[1].onclick = function () { stopReel(1); };
reelEls[2].onclick = function () { stopReel(2); };

setSpinControls(false);
updateStatus("🎰 BETしてレバーを引く！", "#ffd700");
</script>


</body>
</html>

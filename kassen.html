<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASSEN - Cyberpunk Samurai MOBA (v30.0 Ultimate FPS)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Share+Tech+Mono&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #87CEEB; color: #fff; overflow: hidden; font-family: 'Share Tech Mono', monospace; user-select: none; touch-action: none;}
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #customize-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #051515 0%, #010203 100%); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .customize-panel { background: rgba(0, 20, 30, 0.85); border: 1px solid #0ff; padding: 35px; width: 420px; box-shadow: 0 0 40px rgba(0, 255, 255, 0.2); text-align: center; backdrop-filter: blur(10px); }
        .customize-panel h1 { font-family: 'Noto Serif JP', serif; color: #0ff; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 10px #0ff; font-size: 24px;}
        
        .picker-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; text-align: left; }
        .picker-item { display: flex; justify-content: space-between; align-items: center; }
        .picker-item label { font-size: 14px; color: #add8e6; }
        select { width: 100%; padding: 10px; background: rgba(0, 20, 30, 0.8); color: #0ff; border: 1px solid #0ff; font-family: 'Noto Serif JP', serif; font-size: 14px; outline: none; }
        
        .main-btn { background: rgba(0, 255, 255, 0.1); color: #0ff; border: 1px solid #0ff; padding: 12px 20px; width: 100%; font-size: 16px; font-family: 'Noto Serif JP', serif; cursor: pointer; transition: all 0.2s; letter-spacing: 2px; }
        .main-btn:hover:not(:disabled) { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }
        .sub-btn { background: transparent; color: #aaa; border: 1px solid #aaa; padding: 8px 15px; width: 100%; font-size: 14px; font-family: 'Noto Serif JP', serif; cursor: pointer; transition: all 0.2s; margin-top: 10px;}
        .sub-btn:hover { background: #333; color: #fff; }

        .lobby-list-item { display: flex; justify-content: space-between; background: rgba(0, 255, 255, 0.05); border: 1px solid rgba(0,255,255,0.3); padding: 10px; margin-bottom: 8px; align-items: center; }
        .lobby-list-item button { background: #0ff; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-family: 'Noto Serif JP'; font-weight: bold;}
        .player-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px dashed rgba(0,255,255,0.3); font-size: 14px;}
        .player-ready { color: #0f0; font-weight: bold; }
        .player-not-ready { color: #f00; font-weight: bold; }

        #error-toast { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,0,0,0.8); color: #fff; padding: 15px 30px; border: 2px solid #f00; border-radius: 5px; z-index: 999; font-weight: bold; font-family: 'Noto Serif JP', serif; box-shadow: 0 0 20px #f00; }

        /* HUD Styles */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; opacity: 0.3; }
        #top-left-hud { position: absolute; top: 40px; left: 40px; }
        .multi-diamond { position: relative; width: 80px; height: 80px; }
        .dia-outer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid #0ff; transform: rotate(45deg); box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .dia-inner { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 1px solid #fff; transform: rotate(45deg); background: rgba(0, 30, 40, 0.8); display: flex; justify-content: center; align-items: center; }
        .dia-inner span { transform: rotate(-45deg); font-size: 24px; font-weight: bold; color: #fff; }
        #minimap-container { position: absolute; top: 40px; right: 40px; width: 180px; height: 180px; border: 2px solid #0ff; border-radius: 50%; background: rgba(0, 20, 30, 0.5); box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); z-index: 10; overflow: hidden;}
        @media (max-width: 900px) { #minimap-container { width: 120px; height: 120px; top: 20px; right: 20px; } }
        #minimap { width: 100%; height: 100%; display: block; }
        #timer-hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; }
        .timer-line { width: 150px; height: 2px; background: linear-gradient(90deg, transparent, #0ff); position: relative; }
        .timer-line.right { background: linear-gradient(-90deg, transparent, #0ff); }
        #hud-time { font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 0 15px #0ff; letter-spacing: 2px; }
        #bottom-left-hud { position: absolute; bottom: 40px; left: 40px; display: flex; flex-direction: column; gap: 8px; width: 350px; }
        @media (max-width: 900px) { #bottom-left-hud { bottom: 200px; width: 250px; } }
        #hud-info-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px; }
        #hud-lives { font-size: 24px; text-shadow: 0 0 10px #f0f; }
        #hud-kills { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #f05; }
        .hud-bar-row { display: flex; align-items: center; gap: 12px; }
        .hud-icon { width: 25px; text-align: center; font-size: 16px; font-weight: bold; color: #0ff; }
        .bar-bg { flex-grow: 1; height: 10px; background: rgba(0, 40, 50, 0.6); border: 1px solid rgba(0, 255, 255, 0.4); clip-path: polygon(0 0, 100% 0, 98% 100%, 0% 100%); }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #0aa, #0ff); box-shadow: 0 0 8px #0ff; transition: width 0.1s linear; }
        .bar-fill.danger { background: linear-gradient(90deg, #a0a, #f0f); box-shadow: 0 0 8px #f0f; }
        #ammo-hud { position: absolute; bottom: 100px; right: 40px; font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #0ff; text-align: right;}
        .reloading-text { color: #f05 !important; text-shadow: 0 0 10px #f05 !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        #reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 1px solid rgba(0, 255, 255, 0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        #reticle::before { content: ''; position: absolute; width: 60px; height: 1px; background: rgba(0,255,255,0.3); }
        #reticle::after { content: ''; position: absolute; width: 1px; height: 60px; background: rgba(0,255,255,0.3); }
        .reticle-dot { width: 4px; height: 4px; background: #0ff; z-index: 2; border-radius: 50%; box-shadow: 0 0 5px #0ff;}

        /* Enemy Label & HP Bar */
        #enemy-hp-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .enemy-label { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0.85; }
        .enemy-name { font-size: 11px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 2px; white-space: nowrap; border: 1px solid rgba(255,0,80,0.5); }
        .enemy-hp-bg { width: 50px; height: 5px; background: rgba(0,0,0,0.8); border: 1px solid #f05; }
        .enemy-hp-fill { height: 100%; background: #f05; box-shadow: 0 0 5px #f05;}
        
        #announce-container { position: absolute; top: 30%; left: 0; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .announce-text { font-family: 'Noto Serif JP', serif; font-size: 4rem; font-weight: 900; color: transparent; -webkit-text-stroke: 1.5px #fff; text-shadow: 0 0 25px #0ff; opacity: 0; }
        .show-announce { animation: popIn 4s forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(2); filter: blur(5px); } 10% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-30px); } }
        
        #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #result-title { font-family: 'Noto Serif JP', serif; font-size: 6rem; color: #fff; text-shadow: 0 0 30px #f00; margin-bottom: 30px; text-align: center; letter-spacing: 10px; white-space: pre-line;}
        #btn-restart { background: none; border: 2px solid #fff; color: #fff; padding: 15px 50px; font-size: 22px; cursor: pointer; font-family: 'Share Tech Mono', monospace; transition: 0.3s; pointer-events: auto;}
        #btn-restart:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff;}

        #damage-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.4) 100%); opacity: 0; z-index: 2; pointer-events: none; transition: opacity 0.1s;}
        
        /* Touch UI */
        #touch-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
        .joy-zone { position: absolute; bottom: 30px; width: 140px; height: 140px; background: rgba(0,255,255,0.1); border: 2px solid rgba(0,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        .joy-stick { position: absolute; top: 45px; left: 45px; width: 50px; height: 50px; background: rgba(0,255,255,0.6); border-radius: 50%; box-shadow: 0 0 10px #0ff; }
        #joy-move-zone { left: 30px; }
        #joy-look-zone { right: 200px; }
        #touch-btns { position: absolute; bottom: 30px; right: 20px; display: grid; grid-template-columns: 70px 70px; gap: 15px; pointer-events: auto; }
        .t-btn { width: 70px; height: 70px; background: rgba(0,40,60,0.8); border: 2px solid #0ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #0ff; font-weight: bold; font-family: 'Share Tech Mono'; font-size: 14px; text-shadow: 0 0 5px #0ff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .t-btn.active { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    </style>
    <!-- Three.js & Firebase -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/",
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>

<div id="error-toast"></div>

<!-- LOBBY & SETUP UI -->
<div id="customize-screen">
    <div class="customize-panel" id="panel-setup">
        <h1>装備・外観の選択</h1>
        <div class="picker-group">
            <div class="picker-item">
                <label>スキン</label>
                <select id="preset-select">
                    <option value="kogetsu">孤月（コゲツ）</option>
                    <option value="default">標準（サイバーブルー）</option>
                    <option value="crimson">真紅（クリムゾン）</option>
                    <option value="forest">隠密（フォレスト）</option>
                </select>
            </div>
        </div>
        <div class="picker-group weapon-section">
            <div class="picker-item">
                <label>武器</label>
                <select id="weapon-select">
                    <option value="kanabo">鬼の金棒 (Kanabo)</option>
                    <option value="dual_swords">ワイヤー付2刀流剣</option>
                    <option value="gun">銃 (Gun)</option>
                    <option value="hammer">ハンマー (Hammer)</option>
                    <option value="bow">弓 (Bow)</option>
                    <option value="fan">扇 (Fan)</option>
                </select>
            </div>
        </div>
        
        <div class="picker-group weapon-section" style="border-top: none; padding-top: 0;">
            <div class="picker-item">
                <label style="color: #ffaa00; font-weight: bold;">超軽いモード<br><span style="font-size: 10px; color: #aaa;">低スペックでもヌルサク動作</span></label>
                <input type="checkbox" id="low-spec-mode" style="width: 25px; height: 25px; cursor: pointer;">
            </div>
        </div>

        <div id="auth-status" style="color:#0ff; margin-bottom:15px; font-weight:bold; font-family:'Noto Serif JP'; animation: blink 1s infinite;">サーバー接続中...</div>
        <button id="btn-to-mp" class="main-btn" style="display:none;">マルチプレイ / ロビー選択へ</button>
    </div>

    <div class="customize-panel" id="panel-mp-menu" style="display:none;">
        <h1>ONLINE 3v3 MODE</h1>
        <button id="btn-create-lobby" class="main-btn" style="margin-bottom:15px;">新規ロビーを作成</button>
        <button id="btn-find-lobby" class="main-btn">ロビーを探す</button>
        <button id="btn-back-setup" class="sub-btn">装備選択へ戻る</button>
    </div>

    <div class="customize-panel" id="panel-lobby-list" style="display:none;">
        <h1>LOBBY LIST</h1>
        <div id="lobby-list-container" style="max-height:200px; overflow-y:auto; margin-bottom:15px; padding:10px; border:1px solid rgba(0,255,255,0.3); background:rgba(0,0,0,0.5);">
        </div>
        <button id="btn-refresh-lobbies" class="main-btn" style="margin-bottom:10px;">一覧を更新</button>
        <button id="btn-back-mp" class="sub-btn">戻る</button>
    </div>

    <div class="customize-panel" id="panel-lobby-room" style="display:none;">
        <h1>ROOM: <span id="room-id-display" style="font-size:14px; color:#aaa;">----</span></h1>
        <div id="room-players-list" style="max-height:200px; overflow-y:auto; margin-bottom:15px; padding:10px; border:1px solid #0ff; background:rgba(0,20,40,0.8);">
        </div>
        <button id="btn-ready" class="main-btn" style="margin-bottom:15px; background:rgba(0,255,0,0.2); border-color:#0f0;">準備完了 (READY)</button>
        <button id="btn-start-game" class="main-btn" style="display:none; margin-bottom:15px; background:#0ff; color:#000;">START KASSEN</button>
        <button id="btn-leave-lobby" class="sub-btn">ロビーを退出</button>
    </div>
</div>

<div id="result-screen">
    <div id="result-title">YOU DIED</div>
    <button id="btn-restart">REBOOT SYSTEM</button>
</div>

<div id="touch-ui">
    <div id="joy-move-zone" class="joy-zone"><div id="joy-move-stick" class="joy-stick"></div></div>
    <div id="joy-look-zone" class="joy-zone"><div id="joy-look-stick" class="joy-stick"></div></div>
    <div id="touch-btns"><div id="t-btn-ult" class="t-btn">ULT (Q)</div><div id="t-btn-atk" class="t-btn">ATK</div><div id="t-btn-dash" class="t-btn">DASH</div><div id="t-btn-jump" class="t-btn">JUMP</div></div>
</div>

<div id="game-canvas"></div>
<div id="damage-overlay"></div>
<div id="enemy-hp-container"></div>
<div id="hud">
    <div class="scanlines"></div>
    <div id="top-left-hud"><div class="multi-diamond"><div class="dia-outer"></div><div class="dia-inner"><span id="hud-score">0</span></div></div></div>
    <div id="minimap-container"><canvas id="minimap" width="200" height="200"></canvas></div>
    <div id="ammo-hud">AMMO: <span id="ammo-text">∞</span></div>
    <div id="timer-hud"><div class="timer-line"></div><span id="hud-time">00:00</span><div class="timer-line right"></div></div>
    <div id="bottom-left-hud">
        <div id="hud-info-row">
            <div id="hud-lives">🍑🍑🍑</div>
            <div id="hud-kills">KILLS: 0</div>
        </div>
        <div class="hud-bar-row"><div class="hud-icon">HP</div><div class="bar-bg"><div id="player-hp-bar" class="bar-fill"></div></div></div>
        <div class="hud-bar-row"><div class="hud-icon">SP</div><div class="bar-bg"><div id="player-sp-bar" class="bar-fill" style="background: linear-gradient(90deg, #0a5, #0f8); box-shadow:0 0 5px #0f8;"></div></div></div>
        <div class="hud-bar-row"><div class="hud-icon">EX</div><div class="bar-bg"><div id="player-ult-bar" class="bar-fill danger" style="width:0%;"></div></div></div>
    </div>
    <div id="reticle"><div class="reticle-dot"></div></div>
    <div id="announce-container"><div id="announce1" class="announce-text"></div><div id="announce2" class="announce-text" style="font-size: 2.5rem; animation-delay: 0.2s;"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, onSnapshot } from 'firebase/firestore';

const firebaseConfig = {
    apiKey: "AIzaSyDjq5pOJAea9QcaJH9s5usG-iriu2NhWp8",
    authDomain: "kassen-eba57.firebaseapp.com",
    projectId: "kassen-eba57",
    storageBucket: "kassen-eba57.firebasestorage.app",
    messagingSenderId: "148168913681",
    appId: "1:148168913681:web:bcff99366c0e09118ed2b0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = 'kassen-3v3';

let currentUser = null;
let currentLobbyId = null;
let currentLobbyData = null;
let lobbyUnsubscribe = null;
let isAuthInit = false;
let isOfflineMode = false; 

const showError = (msg) => {
    const el = document.getElementById('error-toast');
    if (!el) return;
    el.innerText = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 5000);
};

const showPanel = (id) => {
    ['panel-setup', 'panel-mp-menu', 'panel-lobby-list', 'panel-lobby-room'].forEach(pid => {
        document.getElementById(pid).style.display = pid === id ? 'flex' : 'none';
    });
};

const startOfflineGame = () => {
    document.getElementById('customize-screen').style.display = 'none';
    const skinData = SKINS[document.getElementById('preset-select').value] || SKINS['default'];
    const isLowSpec = document.getElementById('low-spec-mode').checked;
    const dummyPlayer = {
        uid: "local-user",
        name: "YOU(OFFLINE)",
        skin: document.getElementById('preset-select').value,
        weapon: document.getElementById('weapon-select').value,
        team: 0
    };
    window.gameEngine = new Engine(skinData, dummyPlayer.weapon, 0, [dummyPlayer], isLowSpec);
};

const initAuth = async () => {
    try { await signInAnonymously(auth); } catch(e) {
        isOfflineMode = true;
        document.getElementById('auth-status').style.display = 'none';
        const btn = document.getElementById('btn-to-mp');
        if(btn) { btn.innerText = "ソロプレイで出撃 (オフライン)"; btn.style.display = 'block'; btn.onclick = startOfflineGame; }
        showError("サーバーに接続できませんでした。ソロモードで開始します。");
    }
};

onAuthStateChanged(auth, (user) => {
    if(isOfflineMode) return;
    currentUser = user;
    if(user && !isAuthInit) {
        isAuthInit = true;
        document.getElementById('auth-status').style.display = 'none';
        const btn = document.getElementById('btn-to-mp');
        if(btn) { btn.style.display = 'block'; btn.onclick = () => showPanel('panel-mp-menu'); }
    }
});
initAuth();

document.getElementById('btn-back-setup').onclick = () => showPanel('panel-setup');
document.getElementById('btn-back-mp').onclick = () => showPanel('panel-mp-menu');

document.getElementById('btn-create-lobby').onclick = async () => {
    if(!currentUser || isOfflineMode) return;
    document.getElementById('btn-create-lobby').disabled = true;
    try {
        const newLobbyId = 'lobby_' + Math.random().toString(36).substring(2, 9);
        const lobbyRef = doc(db, 'artifacts', appId, 'public', 'data', 'lobbies', newLobbyId);
        await setDoc(lobbyRef, {
            hostId: currentUser.uid,
            status: 'waiting',
            players: [{
                uid: currentUser.uid, name: 'P_' + currentUser.uid.substring(0,4),
                skin: document.getElementById('preset-select').value,
                weapon: document.getElementById('weapon-select').value,
                ready: true, team: 0
            }]
        });
        await joinLobby(newLobbyId);
    } catch(e) { showError("ロビー作成失敗: " + e.message); document.getElementById('btn-create-lobby').disabled = false; }
};

document.getElementById('btn-find-lobby').onclick = () => { showPanel('panel-lobby-list'); refreshLobbies(); };
document.getElementById('btn-refresh-lobbies').onclick = () => refreshLobbies();

const refreshLobbies = async () => {
    if(!currentUser || isOfflineMode) return;
    document.getElementById('btn-refresh-lobbies').disabled = true;
    try {
        const lobbiesRef = collection(db, 'artifacts', appId, 'public', 'data', 'lobbies');
        const snap = await getDocs(lobbiesRef);
        const listEl = document.getElementById('lobby-list-container'); listEl.innerHTML = '';
        snap.forEach(docSnap => {
            const data = docSnap.data();
            if (data.status === 'waiting' && data.players.length < 6) {
                const div = document.createElement('div'); div.className = 'lobby-list-item';
                div.innerHTML = `<span>ロビー ${docSnap.id.substring(6,10)} [${data.players.length}/6]</span>`;
                const btn = document.createElement('button'); btn.innerText = '参加'; btn.onclick = () => joinLobby(docSnap.id);
                div.appendChild(btn); listEl.appendChild(div);
            }
        });
        if(listEl.innerHTML === '') listEl.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">待機中のロビーはありません</div>';
    } catch(e) { showError("取得エラー: " + e.message); }
    document.getElementById('btn-refresh-lobbies').disabled = false;
};

const joinLobby = async (lobbyId) => {
    if(!currentUser || isOfflineMode) return;
    const lobbyRef = doc(db, 'artifacts', appId, 'public', 'data', 'lobbies', lobbyId);
    try {
        const snap = await getDoc(lobbyRef);
        if(!snap.exists()) return showError("ロビーが見つかりません。");
        const data = snap.data();
        if(data.status !== 'waiting') return showError("すでに開始されています。");
        
        const isHost = data.hostId === currentUser.uid;
        if (!isHost) {
            const isAlreadyIn = data.players.some(p => p.uid === currentUser.uid);
            if (!isAlreadyIn) {
                if (data.players.length >= 6) return showError("満員です。");
                data.players.push({
                    uid: currentUser.uid, name: 'P_' + currentUser.uid.substring(0,4),
                    skin: document.getElementById('preset-select').value, weapon: document.getElementById('weapon-select').value,
                    ready: false, team: data.players.length % 2
                });
                await updateDoc(lobbyRef, { players: data.players });
            }
        }
        currentLobbyId = lobbyId; document.getElementById('room-id-display').innerText = lobbyId.substring(6,10); showPanel('panel-lobby-room');

        lobbyUnsubscribe = onSnapshot(lobbyRef, (docSnap) => {
            if(!docSnap.exists()) { showError("ロビーが解散されました。"); leaveLobby(); return; }
            currentLobbyData = docSnap.data(); renderLobbyRoom(currentLobbyData);
            if (currentLobbyData.status === 'playing' && !window.gameEngine) startGame();
        }, err => showError(err.message));
    } catch(e) { showError("参加エラー: " + e.message); }
};

const renderLobbyRoom = (data) => {
    const listEl = document.getElementById('room-players-list'); listEl.innerHTML = ''; let allReady = true;
    data.players.forEach(p => {
        const isMe = p.uid === (currentUser ? currentUser.uid : "local-user");
        const div = document.createElement('div'); div.className = 'player-item'; div.style.color = p.team === 0 ? '#0ff' : '#f05';
        const readyText = p.ready ? '<span class="player-ready">READY</span>' : '<span class="player-not-ready">WAITING</span>';
        if(!p.ready) allReady = false;
        div.innerHTML = `<span>${p.name} (${p.weapon}) ${isMe?'(YOU)':''}</span> ${readyText}`; listEl.appendChild(div);
    });

    const isHost = currentUser && data.hostId === currentUser.uid;
    const startBtn = document.getElementById('btn-start-game'); const readyBtn = document.getElementById('btn-ready');

    if (isHost) { startBtn.style.display = 'block'; startBtn.disabled = !allReady; readyBtn.style.display = 'none'; } 
    else {
        startBtn.style.display = 'none'; readyBtn.style.display = 'block';
        const myData = data.players.find(p => p.uid === (currentUser ? currentUser.uid : "local-user"));
        if(myData) { readyBtn.innerText = myData.ready ? "準備解除 (CANCEL)" : "準備完了 (READY)"; readyBtn.style.borderColor = myData.ready ? "#f00" : "#0f0"; readyBtn.style.color = myData.ready ? "#f00" : "#0f0"; }
    }
};

class VirtualJoystick {
    constructor(zoneId, stickId, isLook) {
        this.zone = document.getElementById(zoneId); this.stick = document.getElementById(stickId); this.isLook = isLook; this.active = false; this.val = {x:0, y:0}; this.origin = {x:0, y:0}; this.touchId = null;
        this.zone.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; this.touchId = t.identifier; this.active = true; const rect = this.zone.getBoundingClientRect(); this.origin = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; this.updateStick(t.clientX, t.clientY); }, {passive: false});
        this.zone.addEventListener('touchmove', e => { e.preventDefault(); if(!this.active) return; for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === this.touchId) this.updateStick(e.changedTouches[i].clientX, e.changedTouches[i].clientY); }, {passive: false});
        const end = (e) => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === this.touchId) { this.active = false; this.touchId = null; this.stick.style.transform = `translate(0px, 0px)`; this.val = {x:0, y:0}; } };
        this.zone.addEventListener('touchend', end); this.zone.addEventListener('touchcancel', end);
    }
    updateStick(x, y) {
        let dx = x - this.origin.x, dy = y - this.origin.y; const maxR = 45; const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
        this.stick.style.transform = `translate(${dx}px, ${dy}px)`;
        // ★ スマホの感度を大幅アップ
        if(this.isLook) { this.val.x = dx * 0.15; this.val.y = dy * 0.15; } else { this.val.x = dx / maxR; this.val.y = dy / maxR; }
    }
}

class InputManager {
    constructor() {
        this.keys = {}; this.mouseMove = {x:0, y:0}; this.locked = false; this.isTouch = false; this.isMouseDown = false; 
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => this.keys[e.code] = false);
        window.addEventListener('mousemove', e => { if(this.locked) { this.mouseMove.x += e.movementX; this.mouseMove.y += e.movementY; } });
        window.addEventListener('mousedown', () => { if(!this.isTouch && !this.locked) document.body.requestPointerLock(); else if (this.locked) this.isMouseDown = true; });
        window.addEventListener('mouseup', () => { this.isMouseDown = false; });
        document.addEventListener('pointerlockchange', () => this.locked = document.pointerLockElement === document.body);
        window.addEventListener('touchstart', () => { if(!this.isTouch) { this.isTouch = true; document.getElementById('touch-ui').style.display = 'block'; } }, {once:true});
        this.joyMove = new VirtualJoystick('joy-move-zone', 'joy-move-stick', false); this.joyLook = new VirtualJoystick('joy-look-zone', 'joy-look-stick', true);
        this.btns = {jump:false, dash:false, atk:false, ult:false};
        const bindBtn = (id, key) => { const el = document.getElementById(id); el.addEventListener('touchstart', e=>{ e.preventDefault(); this.btns[key]=true; el.classList.add('active'); }); el.addEventListener('touchend', e=>{ e.preventDefault(); this.btns[key]=false; el.classList.remove('active'); }); };
        bindBtn('t-btn-jump', 'jump'); bindBtn('t-btn-dash', 'dash'); bindBtn('t-btn-atk', 'atk'); bindBtn('t-btn-ult', 'ult');
    }
    update() {
        let mX=0, mY=0, lX=0, lY=0, j=false, d=false, u=false, a=false, r=false;
        if(this.keys['KeyW']) mY-=1; if(this.keys['KeyS']) mY+=1; if(this.keys['KeyA']) mX-=1; if(this.keys['KeyD']) mX+=1;
        j = this.keys['Space']; d = this.keys['ShiftLeft']; u = this.keys['KeyQ']; r = this.keys['KeyR'] || false;
        lX = this.mouseMove.x; lY = this.mouseMove.y; this.mouseMove = {x:0, y:0};
        a = this.isMouseDown; 
        if(this.isTouch) { mX += this.joyMove.val.x; mY += this.joyMove.val.y; lX += this.joyLook.val.x; lY += this.joyLook.val.y; this.joyLook.val = {x:0, y:0}; j=j||this.btns.jump; d=d||this.btns.dash; a=a||this.btns.atk; u=u||this.btns.ult; }
        const pads = navigator.getGamepads();
        if(pads && pads[0]) { const pad = pads[0]; if(Math.abs(pad.axes[0])>0.1) mX += pad.axes[0]; if(Math.abs(pad.axes[1])>0.1) mY += pad.axes[1]; if(Math.abs(pad.axes[2])>0.1) lX += pad.axes[2]*25; if(Math.abs(pad.axes[3])>0.1) lY += pad.axes[3]*25; j=j||pad.buttons[0].pressed; d=d||pad.buttons[1].pressed||pad.buttons[5].pressed; a=a||pad.buttons[7].pressed||pad.buttons[2].pressed; u=u||pad.buttons[3].pressed; r=r||pad.buttons[2].pressed; }
        return { mX, mY, lX, lY, j, d, a, u, r };
    }
}

function createExplosion(scene, pos, color, count, size=20, spread=600) {
    if (window.gameEngine && window.gameEngine.isLowSpec) { count = Math.floor(count / 5); size = size * 0.8; }
    if (count <= 0) return;
    const geo = new THREE.BufferGeometry(); const posArray = new Float32Array(count * 3); const velArray = [];
    for(let i=0; i<count; i++) { posArray[i*3]=pos.x; posArray[i*3+1]=pos.y; posArray[i*3+2]=pos.z; const theta=Math.random()*Math.PI*2; const phi=Math.acos((Math.random()*2)-1); const speed=Math.random()*spread+100; velArray.push(new THREE.Vector3(Math.sin(phi)*Math.cos(theta)*speed, Math.sin(phi)*Math.sin(theta)*speed, Math.cos(phi)*speed)); }
    geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3)); 
    const mat = new THREE.PointsMaterial({ color: color, size: size, map: particleTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const pMesh = new THREE.Points(geo, mat); scene.add(pMesh); particles.push({ mesh: pMesh, vels: velArray, life: window.gameEngine && window.gameEngine.isLowSpec ? 0.8 : 1.5 });
}

function createKanaboMesh(scale = 1.0) {
    const kanabo = new THREE.Group();
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5), new THREE.MeshBasicMaterial({color: '#222'}));
    handle.rotation.x = Math.PI/2; handle.position.set(0, 0, -2.5); kanabo.add(handle);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.1, 8, 16), new THREE.MeshBasicMaterial({color: '#222'}));
    ring.rotation.x = Math.PI/2; ring.position.set(0, 0, 0.4); kanabo.add(ring);
    const headHeight = 16; const goldMat = new THREE.MeshBasicMaterial({color: '#FFD700'});
    const head = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 0.8, headHeight), goldMat);
    head.rotation.x = Math.PI/2; head.position.set(0, 0, -(5 + headHeight/2)); kanabo.add(head);

    for(let i=0; i<40; i++){
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.0, 4), goldMat);
        const h = (Math.random() - 0.5) * (headHeight - 2); const angle = Math.random() * Math.PI * 2;
        const r = 1.15 + (h / (headHeight/2)) * 0.35; 
        spike.position.set(Math.cos(angle) * r, h, Math.sin(angle) * r);
        spike.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).normalize());
        head.add(spike);
    }
    kanabo.scale.set(scale, scale, scale); return kanabo;
}

function updateAvatarAnimation(mesh, speed, isGrounded, isDashing, weaponType, dt) {
    const data = mesh.userData; if (!data.leftArm) return; if (data.attackTimer > 0) data.attackTimer -= dt;
    const time = Date.now() * 0.015; const breathe = Math.sin(Date.now() * 0.003) * 0.05;
    if (isDashing) {
        data.bodyGroup.rotation.x = 0.3; data.leftLeg.rotation.x = -0.5; data.rightLeg.rotation.x = 0.5; 
        if(data.dashEff) data.dashEffect.mesh.visible = true; data.bodyGroup.position.y = breathe * 2;
    } else {
        data.bodyGroup.rotation.y = 0; if(data.dashEff) data.dashEffect.mesh.visible = false;
        if (!isGrounded) { 
            data.bodyGroup.rotation.x = -0.1; data.leftLeg.rotation.x = -0.4; data.rightLeg.rotation.x = 0.2; 
            if (data.attackTimer <= 0) { data.leftArm.rotation.x = -0.8; data.rightArm.rotation.x = -0.8; } 
        } else if (speed > 10) { 
            data.bodyGroup.rotation.x = 0.15; 
            data.leftLeg.rotation.x = Math.sin(time) * 1.0; data.leftLeg.position.y = Math.max(0, Math.cos(time)) * 2 - 3;
            data.rightLeg.rotation.x = Math.sin(time + Math.PI) * 1.0; data.rightLeg.position.y = Math.max(0, Math.cos(time + Math.PI)) * 2 - 3;
            data.leftArm.rotation.x = Math.sin(time + Math.PI) * 0.8; data.leftArm.rotation.z = 0.1;
            if (data.attackTimer <= 0) { data.rightArm.rotation.x = Math.sin(time) * 0.8; data.rightArm.rotation.z = -0.1; }
            data.bodyGroup.rotation.z = Math.sin(time * 0.5) * 0.08; data.bodyGroup.position.y = Math.abs(Math.sin(time)) * 1.5;
        } else { 
            data.bodyGroup.rotation.x = 0; data.leftLeg.rotation.x = 0; data.rightLeg.rotation.x = 0; 
            data.leftLeg.position.y = -3; data.rightLeg.position.y = -3;
            data.leftArm.rotation.x = 0; data.leftArm.rotation.z = 0.05 + breathe;
            data.bodyGroup.rotation.z = 0; data.bodyGroup.position.y = breathe * 5;
            if (data.attackTimer <= 0) { data.rightArm.rotation.x = 0; data.rightArm.rotation.z = -0.05 - breathe; }
        }
        if (data.attackTimer > 0) { 
            const prog = data.attackTimer / 0.3; const ease = 1 - Math.pow(1 - prog, 3);
            data.rightArm.rotation.x = -(Math.PI * 1.0) * ease; data.rightArm.rotation.z = -0.2 * ease;
            data.leftArm.rotation.x = -(Math.PI * 1.0) * ease; data.leftArm.rotation.z = 0.2 * ease;
        }
    }
}

class RemotePlayer {
    constructor(scene, data) {
        const sData = SKINS[data.skin] || SKINS['default']; this.mesh = createBoxAvatar(sData.colors, 1.0, data.weapon); this.scene = scene; this.scene.add(this.mesh);
        this.targetPos = new THREE.Vector3(data.x || 0, data.y || RULES.GROUND_Y, data.z || 0); this.targetRot = new THREE.Euler(0, data.yaw || 0, 0, 'YXZ'); this.mesh.position.copy(this.targetPos); this.team = data.team;
        this.uiElem = document.createElement('div'); this.uiElem.className = 'enemy-label'; const color = this.team === 0 ? '#0ff' : '#f05'; this.uiElem.innerHTML = `<div class="enemy-name" style="color:${color}; border-color:${color};">${data.name}</div>`; document.getElementById('enemy-hp-container').appendChild(this.uiElem);
    }
    update(dt, camera) {
        this.mesh.position.lerp(this.targetPos, 10 * dt); const q = new THREE.Quaternion().setFromEuler(this.targetRot); this.mesh.quaternion.slerp(q, 10 * dt);

// 桜の配置 (デフォルトで1000本)
function distToSegmentSquared(px, pz, vx, vz, wx, wz) {
    let l2 = (vx - wx)**2 + (vz - wz)**2;
    if (l2 === 0) return (px - vx)**2 + (pz - vz)**2;
    let t = ((px - vx) * (wx - vx) + (pz - vz) * (wz - vz)) / l2;
    t = Math.max(0, Math.min(1, t));
    return (px - (vx + t * (wx - vx)))**2 + (pz - (vz + t * (wz - vz)))**2;
}

function createNature(scene, engine) {
    engine.treeGrid = {};
    const treeCount = 1000; // ★ デフォルトで超軽いモードと同じ本数
    
    const sakuraMat = new THREE.MeshBasicMaterial({color: 0xffb7c5}); const trunkMat = new THREE.MeshBasicMaterial({color: 0x332211});
    const trunkGeo = new THREE.CylinderGeometry(15, 20, 100); const leavesGeo = new THREE.DodecahedronGeometry(60, 1);
    const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount); const leavesMesh = new THREE.InstancedMesh(leavesGeo, sakuraMat, treeCount);
    const dummy = new THREE.Object3D(); let addedCount = 0; let attempts = 0;
    
    const pathSegments = [
        {vx: -25000, vz: 0, wx: 25000, wz: 0},
        {vx: -25000, vz: 0, wx: 0, wz: -15000},
        {vx: 0, vz: -15000, wx: 25000, wz: 0},
        {vx: -25000, vz: 0, wx: 0, wz: 15000},
        {vx: 0, vz: 15000, wx: 25000, wz: 0}
    ];

    while(addedCount < treeCount && attempts < treeCount * 5) {
        attempts++;
        const x = (Math.random()-0.5)*RULES.MAP_LIMIT*2; const z = (Math.random()-0.5)*RULES.MAP_LIMIT*2;
        let validPos = true;

        // ★ レーンと川を避ける
        for (let seg of pathSegments) {
            if (Math.sqrt(distToSegmentSquared(x, z, seg.vx, seg.vz, seg.wx, seg.wz)) < 1500) { validPos = false; break; }
        }
        if (Math.abs(x) < 2000) validPos = false;

        // ★ 櫓の周辺を避ける
        const yaguraZs = [-15000, 15000];
        for(let yz of yaguraZs) {
            const distToYagura = Math.sqrt(Math.pow(x - 0, 2) + Math.pow(z - yz, 2));
            if (distToYagura < 4000) { validPos = false; break; }
        }

        // 拠点を避ける
        if (Math.abs(x - (-25000)) < 3000 || Math.abs(x - 25000) < 3000) validPos = false;

        if (validPos) {
            dummy.scale.set(5, 5, 5);
            dummy.position.set(x, 250, z); dummy.updateMatrix(); trunkMesh.setMatrixAt(addedCount, dummy.matrix);
            dummy.position.set(x, 600, z); dummy.updateMatrix(); leavesMesh.setMatrixAt(addedCount, dummy.matrix);
            
            const gx = Math.floor(x / 1000); const gz = Math.floor(z / 1000); const key = `${gx},${gz}`;
            if (!engine.treeGrid[key]) engine.treeGrid[key] = [];
            engine.treeGrid[key].push({x: x, z: z, radius: 75, height: 600});
            addedCount++;
        }
    }
    trunkMesh.count = addedCount; leavesMesh.count = addedCount; scene.add(trunkMesh); scene.add(leavesMesh);
}

class PlayerLocal {
    constructor(scene, camera, skinData, weaponType, spawnX) { 
        this.scene = scene; this.camera = camera; this.weaponType = weaponType; 
        this.position = new THREE.Vector3(spawnX, RULES.GROUND_Y, 0); this.velocity = new THREE.Vector3(); this.yaw = spawnX > 0 ? Math.PI/2 : -Math.PI/2; this.pitch = 0; 
        this.maxHp = 450; this.hp = 450; this.maxSp = 150; this.sp = 150; this.ult = 0; this.lives = 3; this.isGrounded = true; this.glowColor = skinData.colors.glow; 
        this.weaponStats = WEAPON_STATS[weaponType]; this.ammo = this.weaponStats.ammo; this.isReloading = false; this.reloadTimer = 0; this.atkCooldown = 0;
        this.viewmodel = createViewmodel(weaponType, this.glowColor); this.camera.add(this.viewmodel); this.scene.add(this.camera); this.bobTimer = 0; this.spawnX = spawnX;
    }
    takeDamage(v) { 
        if(window.gameEngine.isGameOver) return; this.hp -= v; const ol = document.getElementById('damage-overlay'); ol.style.opacity = '1'; setTimeout(()=>ol.style.opacity='0', 100);
        if(this.hp <= 0) { 
            this.lives--; 
            if(this.lives > 0) { 
                this.hp = this.maxHp; this.sp = this.maxSp; 
                this.position.set(this.spawnX, RULES.GROUND_Y, 0); this.velocity.set(0,0,0); 
                this.yaw = this.spawnX > 0 ? Math.PI/2 : -Math.PI/2; this.pitch = 0;
                window.gameEngine.announce("残機減少", "再出撃します", "#ff0000"); this.ammo = this.weaponStats.ammo; this.isReloading = false; 
            } else { window.gameEngine.gameOver(false, "SYSTEM OFFLINE\n\nYOU DIED"); } 
        } 
    }
    update(dt, input, groundY) {
        if (this.atkCooldown > 0) this.atkCooldown -= dt;
        if (this.isReloading) { this.reloadTimer -= dt; if (this.reloadTimer <= 0) { this.isReloading = false; this.ammo = this.weaponStats.ammo; } } 
        else if (input.r && this.ammo < this.weaponStats.ammo) { this.isReloading = true; this.reloadTimer = this.weaponStats.reload; }

        this.yaw -= input.lX * 0.002; this.pitch -= input.lY * 0.002; this.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, this.pitch)); this.camera.quaternion.setFromEuler(new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ'));
        const moveDir = new THREE.Vector3(); const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.yaw).normalize(); const rgt = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), this.yaw).normalize(); moveDir.addScaledVector(fwd, -input.mY); moveDir.addScaledVector(rgt, input.mX);

        let currentSpeed = RULES.PLAYER_SPEED; let isDashing = input.d && this.sp > 0;
        if (isDashing) { currentSpeed *= 3.5; this.sp -= 45 * dt; if(moveDir.lengthSq()===0) moveDir.copy(fwd); this.velocity.y = 0; } 
        else { this.sp = Math.min(this.maxSp, this.sp + 15 * dt); this.velocity.y -= RULES.GRAVITY * dt; }
        
        if (moveDir.lengthSq() > 0) moveDir.normalize(); this.velocity.x = moveDir.x * currentSpeed; this.velocity.z = moveDir.z * currentSpeed;
        if (input.j && this.isGrounded) { this.velocity.y = RULES.JUMP_FORCE; this.isGrounded = false; }
        this.position.addScaledVector(this.velocity, dt);

        let pX = this.position.x; let pZ = this.position.z; const pRadius = 20; const gx = Math.floor(pX / 1000); const gz = Math.floor(pZ / 1000);
        if (window.gameEngine && window.gameEngine.treeGrid) {
            for(let i = -1; i <= 1; i++) {
                for(let j = -1; j <= 1; j++) {
                    const key = `${gx+i},${gz+j}`; const trees = window.gameEngine.treeGrid[key];
                    if(trees) {
                        for(let k=0; k<trees.length; k++) {
                            const t = trees[k]; if (this.position.y > t.height) continue;
                            const dx = pX - t.x; const dz = pZ - t.z; const distSq = dx*dx + dz*dz; const minDist = pRadius + t.radius;
                            if(distSq < minDist * minDist) {
                                const dist = Math.sqrt(distSq) || 1; const overlap = minDist - dist;
                                pX += (dx/dist) * overlap; pZ += (dz/dist) * overlap;
                            }
                        }
                    }
                }
            }
        }
        this.position.x = pX; this.position.z = pZ;

        if (this.position.y <= groundY) { this.position.y = groundY; this.velocity.y = Math.max(0, this.velocity.y); this.isGrounded = true; } else { this.isGrounded = false; }
        this.position.x = Math.max(-RULES.MAP_LIMIT, Math.min(RULES.MAP_LIMIT, this.position.x)); this.position.z = Math.max(-RULES.MAP_LIMIT, Math.min(RULES.MAP_LIMIT, this.position.z));
        this.camera.position.copy(this.position).setY(this.position.y + 25);
        
        const spd = Math.sqrt(this.velocity.x**2 + this.velocity.z**2);
        if (this.isGrounded && spd > 10) { this.bobTimer += dt * (isDashing?20:10); this.camera.position.y += Math.sin(this.bobTimer) * 1.5; }
        
        const vd = this.viewmodel.userData;
        if(vd.attackTimer > 0) {
            vd.attackTimer -= dt; const p = vd.attackTimer / this.weaponStats.cooldown; const ease = p * p * (3 - 2 * p); const heavyEase = Math.pow(p, 4);
            if(this.weaponType === 'gun' || this.weaponType === 'bow') { this.viewmodel.position.z = vd.originalPos.z + ease * 3.0; this.viewmodel.rotation.x = vd.originalRot.x + ease * 0.5; } 
            else if (this.weaponType === 'kanabo') { this.viewmodel.position.z = vd.originalPos.z - heavyEase * 6.0; this.viewmodel.rotation.x = vd.originalRot.x - heavyEase * 2.5; this.viewmodel.rotation.z = vd.originalRot.z + heavyEase * 0.5; }
            else { this.viewmodel.position.z = vd.originalPos.z - ease * 4.0; this.viewmodel.rotation.x = vd.originalRot.x - ease * 2.0; this.viewmodel.rotation.z = vd.originalRot.z - ease * 2.0; }
        } else { 
            const breathe = Math.sin(Date.now() * 0.002) * 0.05; const targetPos = vd.originalPos.clone(); targetPos.y += breathe;
            this.viewmodel.position.lerp(targetPos, 0.1); this.viewmodel.quaternion.slerp(new THREE.Quaternion().setFromEuler(vd.originalRot), 0.1); 
        }
    }
}

class Projectile {
    constructor(scene, pos, dir, colorStr, team, type='gun', isUlt=false, damage=15) {
        this.scene=scene; this.team=team; this.type=type; this.active=true; this.life=2.5; this.damage=damage; 
        this.speed = 10000; 
        let geo, mat = new THREE.MeshBasicMaterial({ color: colorStr });
        if (isUlt) { geo = new THREE.SphereGeometry(12, 8, 8); this.speed = 3000; } 
        else if (type === 'hammer') { geo = new THREE.BoxGeometry(40, 40, 40); mat = new THREE.MeshBasicMaterial({ color: colorStr, wireframe: true }); this.speed = 1500; this.life = 0.3; } 
        else if (type === 'ushi_hammer') { geo = new THREE.BoxGeometry(200, 200, 200); mat = new THREE.MeshBasicMaterial({ color: colorStr, wireframe: true }); this.speed = 1500; this.life = 5.0; }
        else if (type === 'kanabo') { geo = new THREE.CylinderGeometry(15, 15, 80); geo.rotateX(Math.PI/2); mat = new THREE.MeshBasicMaterial({ color: colorStr, wireframe: true }); this.speed = 1500; this.life = 0.4; } 
        else if (type === 'bow') { geo = new THREE.CylinderGeometry(1, 1, 40); geo.rotateX(Math.PI/2); this.speed = 8000; this.life = 1.5; } 
        else if (type === 'dual_swords') { geo = new THREE.BoxGeometry(35, 1, 10); this.speed = 5000; this.life = 0.15; } 
        else if (type === 'fan') { geo = new THREE.SphereGeometry(15, 8, 8); this.speed = 4000; this.life = 0.3; } 
        else { geo = new THREE.CylinderGeometry(2, 2, 80); geo.rotateX(Math.PI/2); this.speed = 10000; } 
        
        this.mesh = new THREE.Group(); const mainMesh = new THREE.Mesh(geo, mat); this.mesh.add(mainMesh);
        if((type==='gun' || type==='bow') && (!window.gameEngine || !window.gameEngine.isLowSpec)) { const trail = new THREE.Mesh(new THREE.CylinderGeometry(4, 0, 100), new THREE.MeshBasicMaterial({color:colorStr, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending})); trail.rotateX(Math.PI/2); trail.position.z = 50; this.mesh.add(trail); }
        this.mesh.position.copy(pos); if (type === 'bow' || type === 'dual_swords' || type === 'gun' || type === 'kanabo') this.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir); 
        this.dir = dir.clone().normalize(); scene.add(this.mesh);
    }
    update(dt) { 
        this.mesh.position.addScaledVector(this.dir, this.speed * dt); 
        this.life -= dt; 
        
        if (window.gameEngine && window.gameEngine.treeGrid) {
            const px = this.mesh.position.x; const py = this.mesh.position.y; const pz = this.mesh.position.z;
            const gx = Math.floor(px / 1000); const gz = Math.floor(pz / 1000); const key = `${gx},${gz}`;
            const trees = window.gameEngine.treeGrid[key];
            if (trees) {
                for(let k=0; k<trees.length; k++) {
                    const t = trees[k];
                    if (py > 0 && py < t.height) { 
                        const dx = px - t.x; const dz = pz - t.z;
                        if (dx*dx + dz*dz < (t.radius + 30) * (t.radius + 30)) { this.life = 0; break; }
                    }
                }
            }
        }
        if (this.life <= 0) this.destroy(); 
    }
    destroy() { this.active = false; this.scene.remove(this.mesh); }
}

class EnemyBase {
    constructor(scene, pos, hp, isBoss = false) {
        this.scene = scene; this.isBoss = isBoss; this.active = true; this.hp = hp; this.maxHp = hp; this.currentSpeed = 0;
        if(isBoss) { this.scale = 30.0; this.mesh = createUshiOniModel(this.scale); } else { this.scale = 1.8; this.mesh = createBoxAvatar(ENEMY_COLS.colors, this.scale, 'bow'); }
        this.mesh.position.copy(pos); scene.add(this.mesh); this.uiElem = document.createElement('div'); this.uiElem.className = 'enemy-label'; this.uiElem.innerHTML = `<div class="enemy-name">Entity</div><div class="enemy-hp-bg"><div class="enemy-hp-fill"></div></div>`; this.hpFillElem = this.uiElem.querySelector('.enemy-hp-fill'); document.getElementById('enemy-hp-container').appendChild(this.uiElem);
    }
    update(dt, playerPos, camera) {
        if (!this.active) return; const targetPos = playerPos.clone(); targetPos.y = this.mesh.position.y; this.mesh.lookAt(targetPos); const screenPos = this.mesh.position.clone(); screenPos.y += 20 * this.scale; screenPos.project(camera);
        if (screenPos.z < 1) { this.uiElem.style.left = `${(screenPos.x * .5 + .5) * window.innerWidth}px`; this.uiElem.style.top = `${(screenPos.y * -.5 + .5) * window.innerHeight}px`; this.uiElem.style.display = 'flex'; this.hpFillElem.style.width = `${(this.hp/this.maxHp)*100}%`; } else { this.uiElem.style.display = 'none'; }
        
        if(this.isBoss) { 
            if(this.currentSpeed > 0) { 
                const time = Date.now() * 0.005; 
                this.mesh.userData.legs.forEach(l => { 
                    l.pivot.rotation.x = Math.sin(time + l.offset) * 0.6; 
                    l.pivot.position.y = 15 + Math.abs(Math.cos(time + l.offset)) * 5;
                }); 
                const gy = window.gameEngine ? window.gameEngine.getGroundY(this.mesh.position.x, this.mesh.position.z) : RULES.GROUND_Y;
                this.mesh.position.y = gy + (this.scale * 10) + Math.abs(Math.sin(time * 2)) * 10;
            } 
        } else {
            const gy = window.gameEngine ? window.gameEngine.getGroundY(this.mesh.position.x, this.mesh.position.z) : RULES.GROUND_Y;
            this.mesh.position.y = gy + (this.scale * 4.5);
        }
        
        let pX = this.mesh.position.x; let pZ = this.mesh.position.z; const pRadius = this.scale * 10; const gx = Math.floor(pX / 1000); const gz = Math.floor(pZ / 1000);
        if (window.gameEngine && window.gameEngine.treeGrid) {
            for(let i = -1; i <= 1; i++) {
                for(let j = -1; j <= 1; j++) {
                    const key = `${gx+i},${gz+j}`; const trees = window.gameEngine.treeGrid[key];
                    if(trees) {
                        for(let k=0; k<trees.length; k++) {
                            const t = trees[k]; const dx = pX - t.x; const dz = pZ - t.z; const distSq = dx*dx + dz*dz; const minDist = pRadius + t.radius;
                            if(distSq < minDist * minDist) {
                                const dist = Math.sqrt(distSq) || 1; const overlap = minDist - dist;
                                pX += (dx/dist) * overlap; pZ += (dz/dist) * overlap;
                            }
                        }
                    }
                }
            }
        }
        this.mesh.position.x = pX; this.mesh.position.z = pZ;
    }
    takeDamage(v) { if (!this.active) return; this.hp -= v; if(this.hp <= 0) this.die(); else { this.mesh.children.forEach(c => { if(c.material && c.material.color) { const o=c.material.color.getHex(); c.material.color.setHex(0xffffff); setTimeout(()=>{if(c)c.material.color.setHex(o)},50);}}); } }
    die() { this.active = false; this.scene.remove(this.mesh); createExplosion(this.scene, this.mesh.position, this.isBoss?0xffaa00:0xff0055, this.isBoss?150:50, this.isBoss?30:15); if(this.uiElem && this.uiElem.parentNode) this.uiElem.parentNode.removeChild(this.uiElem); }
}

class Minion extends EnemyBase { 
    constructor(scene, pos) { 
        super(scene, pos, 20, false); 
        this.uiElem.querySelector('.enemy-name').innerText = "ミニオン"; 
        this.fireTimer = Math.random() * 2; 
        this.moveAngle = (Math.random() - 0.5) * Math.PI; 
        this.moveTimer = 0;
    } 
    update(dt, playerPos, camera, playerHeight) { 
        this.currentSpeed = 0; super.update(dt, playerPos, camera, playerHeight); if (!this.active || playerHeight > RULES.STEALTH_HEIGHT) return; 
        const dist = this.mesh.position.distanceTo(playerPos);
        if (dist < 4000) { 
            this.moveTimer += dt;
            if (this.moveTimer > 1.5) { this.moveAngle = (Math.random() - 0.5) * Math.PI; this.moveTimer = 0; }
            const dirToPlayer = playerPos.clone().sub(this.mesh.position).normalize(); dirToPlayer.y = 0;
            let moveDir = dirToPlayer.clone().applyAxisAngle(new THREE.Vector3(0,1,0), this.moveAngle);
            if (dist < 800) { moveDir = dirToPlayer.clone().negate().applyAxisAngle(new THREE.Vector3(0,1,0), this.moveAngle); } 
            else if (dist > 1500) { moveDir.lerp(dirToPlayer, 0.5).normalize(); }
            this.currentSpeed = 350; this.mesh.position.addScaledVector(moveDir, this.currentSpeed * dt);
            this.fireTimer -= dt; 
            if (this.fireTimer <= 0) { 
                const shootDir = playerPos.clone().sub(this.mesh.position).normalize(); 
                window.gameEngine.projectiles.push(new Projectile(this.scene, this.mesh.position.clone().setY(20), shootDir, '#ff0055', 1, 'bow', false, 8.0)); 
                this.fireTimer = 2.0; 
            } 
        } 
    } 
}

class UshiOni extends EnemyBase { 
    constructor(scene, pos, yagura) { 
        super(scene, pos, 5555, true); 
        this.yagura = yagura; 
        this.uiElem.querySelector('.enemy-name').innerText = "牛鬼 (魔物)"; 
        this.uiElem.querySelector('.enemy-hp-bg').classList.add('boss-hp-bg'); this.hpFillElem.classList.add('boss-hp-fill'); this.fireTimer = 1.0; 
    } 
    update(dt, playerPos, camera, playerHeight) { 
        this.currentSpeed = 0; super.update(dt, playerPos, camera, playerHeight); if (!this.active) return; 
        const dist = this.mesh.position.distanceTo(playerPos);
        if (dist < 30000) { 
            if (dist > 5000) { const dir = playerPos.clone().sub(this.mesh.position).normalize(); dir.y=0; this.currentSpeed = 1000; this.mesh.position.addScaledVector(dir, this.currentSpeed * dt); }
            this.fireTimer -= dt; 
            if (this.fireTimer <= 0) { 
                const dir = playerPos.clone().sub(this.mesh.position).normalize(); 
                window.gameEngine.projectiles.push(new Projectile(this.scene, this.mesh.position.clone().add(new THREE.Vector3(0, 300, 0)), dir, '#ffaa00', 1, 'ushi_hammer', false, 40)); 
                this.fireTimer = 2.0; 
            } 
        } 
    }
    die() { super.die(); this.yagura.isBossDead = true; window.gameEngine.announce("牛鬼撃破！", "鐘を鳴らせ！", "#ffaa00"); }
}

class Engine {
    constructor(skinData, weaponType, myTeam, allPlayersData, isLowSpec = false) { 
        this.isLowSpec = isLowSpec;
        this.skinData = skinData; this.weaponType = weaponType; this.myTeam = myTeam; this.allPlayersData = allPlayersData; 
        this.score = 0; this.kills = 0; this.startTime = Date.now(); this.isGameOver = false; this.shakeTimer = 0; 
        window.gameEngine = this; 
        this.initThree(); this.inputMgr = new InputManager(); this.buildWorld(); 
        
        this.remotePlayers = {}; this.processedActions = {}; this.lastSyncTime = 0;
        if (!isOfflineMode) this.startNetworkSync();
        
        this.animate(); 
    }
    initThree() { 
        this.scene = new THREE.Scene(); 
        this.scene.background = new THREE.Color(0x87CEEB); 
        this.camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 1, 150000); 
        this.renderer = new THREE.WebGLRenderer({ antialias: !this.isLowSpec, alpha: false }); 
        this.renderer.setSize(window.innerWidth, window.innerHeight); 
        this.renderer.setClearColor(0x87CEEB); 
        this.renderer.setPixelRatio(this.isLowSpec ? 1 : window.devicePixelRatio);
        document.getElementById('game-canvas').appendChild(this.renderer.domElement); 
        
        if (!this.isLowSpec) {
            try {
                this.composer = new EffectComposer(this.renderer); 
                this.composer.addPass(new RenderPass(this.scene, this.camera)); 
                this.composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.85)); 
            } catch(e) { this.composer = null; }
        } else {
            this.composer = null;
        }

        window.addEventListener('resize', () => { 
            this.camera.aspect = window.innerWidth / window.innerHeight; 
            this.camera.updateProjectionMatrix(); 
            this.renderer.setSize(window.innerWidth, window.innerHeight); 
            if(this.composer) this.composer.setSize(window.innerWidth, window.innerHeight); 
        }); 
    }
    
    // ★ 直線と円を組み合わせた滑らかな地形判定 (画像ベースのMOBAマップ)
    getGroundY(x, z) {
        let gy = RULES.GROUND_Y;
        // 上下の櫓の判定
        const yaguraPositions = [
            {x: 0, z: -15000},
            {x: 0, z: 15000}
        ];
        
        for(let p of yaguraPositions) {
            const dx = x - p.x; const dz = z - p.z;
            
            if (Math.abs(dx) < 500 && Math.abs(dz) < 500) { gy = Math.max(gy, 100); } 
            if (Math.abs(dx) < 600 && Math.abs(dz) < 600) { gy = Math.max(gy, 515); } 
            
            // 左階段 (味方側から)
            if (dx >= -2540 && dx < -500 && Math.abs(dz) < 300) { 
                const ratio = (dx - (-2500)) / (-500 - (-2500)); 
                gy = Math.max(gy, Math.max(RULES.GROUND_Y, 5 + ratio * 500)); 
            }
            // 右階段 (敵側から)
            if (dx <= 2540 && dx > 500 && Math.abs(dz) < 300) {
                const ratio = (2500 - dx) / (2500 - 500);
                gy = Math.max(gy, Math.max(RULES.GROUND_Y, 5 + ratio * 500));
            }
        }
        
        // 中央レーンの橋 (X=0, Z=0)
        if (Math.abs(x) < 2000 && Math.abs(z) < 500) {
            const ratio = x / 2000; 
            const sy = Math.cos(ratio * Math.PI/2) * 500;
            gy = Math.max(gy, sy);
        }
        return gy;
    }

    buildWorld() {
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.9)); const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); dirLight.position.set(100, 500, -100); this.scene.add(dirLight); 
        
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x113311, roughness: 0.9 });
        if (!this.isLowSpec) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('草床.jpg', (tex) => { tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(800, 800); groundMat.map = tex; groundMat.color.setHex(0xffffff); groundMat.needsUpdate = true; }, undefined, (err) => { console.warn("画像の読み込みに失敗しました。", err); });
            textureLoader.load('空.jpg', (tex) => { const skyGeo = new THREE.SphereGeometry(100000, 32, 32); const skyMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }); const sky = new THREE.Mesh(skyGeo, skyMat); this.scene.add(sky); }, undefined, (err) => { console.warn("空.jpg の読み込みに失敗しました。", err); });
        }
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(120000, 120000), groundMat); ground.rotation.x = -Math.PI/2; this.scene.add(ground); 

        // ★ MOBAスタイルの美しいルート生成
        const pathMat = new THREE.MeshBasicMaterial({ color: 0x4a3c31 }); 
        const addPath = (x1, z1, x2, z2) => {
            const length = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
            const pathGeo = new THREE.PlaneGeometry(length, 2000);
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.rotation.z = Math.atan2(z2-z1, x2-x1);
            path.position.set((x1+x2)/2, 0.5, (z1+z2)/2);
            this.scene.add(path);
        };
        
        // ミッドレーン
        addPath(-25000, 0, 25000, 0);
        // トップレーン
        addPath(-25000, 0, 0, -15000);
        addPath(0, -15000, 25000, 0);
        // ボットレーン
        addPath(-25000, 0, 0, 15000);
        addPath(0, 15000, 25000, 0);

        // 中央の川
        const riverMat = new THREE.MeshBasicMaterial({color: 0x44aaff, transparent: true, opacity: 0.8});
        const river = new THREE.Mesh(new THREE.PlaneGeometry(3000, 80000), riverMat);
        river.rotation.x = -Math.PI / 2; river.position.set(0, 10, 0); this.scene.add(river);

        // 中央の橋
        const bridgeGroup = new THREE.Group(); const bMat = new THREE.MeshBasicMaterial({color: 0x882222});
        for(let i=-20; i<=20; i++) {
            const ratio = i/20; const h = Math.cos(ratio * Math.PI/2) * 500;
            const step = new THREE.Mesh(new THREE.BoxGeometry(100, 20, 1000), bMat);
            step.position.set(i * 100, h, 0); step.rotation.z = -Math.sin(ratio * Math.PI/2) * Math.PI/4; bridgeGroup.add(step);
        }
        bridgeGroup.position.set(0, 0, 0); this.scene.add(bridgeGroup);

        createNature(this.scene, this);

        const enemyCastle = createJapaneseCastle(RULES.BASE_POS_X, 0, true); this.scene.add(enemyCastle);
        const allyCastle = createJapaneseCastle(-RULES.BASE_POS_X, 0, false); this.scene.add(allyCastle);

        this.enemyBase = new DarumaTower(this.scene, new THREE.Vector3(RULES.BASE_POS_X, 0, 0), true, enemyCastle); 
        this.allyBase = new DarumaTower(this.scene, new THREE.Vector3(-RULES.BASE_POS_X, 0, 0), false, allyCastle); 
        
        const spawnX = this.myTeam === 0 ? -RULES.BASE_POS_X + 4000 : RULES.BASE_POS_X - 4000;
        this.player = new PlayerLocal(this.scene, this.camera, this.skinData, this.weaponType, spawnX); 
        
        this.enemies = []; this.projectiles = []; this.yaguras = [];
        
        const myUid = currentUser ? currentUser.uid : "local-user";
        if(this.allPlayersData && Array.isArray(this.allPlayersData)) { this.allPlayersData.forEach(p => { if (p.uid !== myUid) { this.remotePlayers[p.uid] = new RemotePlayer(this.scene, p); } }); }

        const spawnSq = (cx, cz, n, r) => { for(let i=0; i<n; i++) { const a=Math.random()*Math.PI*2; const d=Math.random()*r; this.enemies.push(new Minion(this.scene, new THREE.Vector3(cx+Math.cos(a)*d, RULES.GROUND_Y, cz+Math.sin(a)*d))); } };
        
        // ★ 櫓と牛鬼は「この世に2つ」 (トップとボット)
        const yagTop = new Yagura(this.scene, new THREE.Vector3(0, 0, -15000), "TOP"); this.yaguras.push(yagTop); 
        this.enemies.push(new UshiOni(this.scene, new THREE.Vector3(0, 515, -14000), yagTop)); 
        spawnSq(-5000, -12000, 20, 600); spawnSq(5000, -12000, 20, 600);
        
        const yagBot = new Yagura(this.scene, new THREE.Vector3(0, 0, 15000), "BOTTOM"); this.yaguras.push(yagBot);
        this.enemies.push(new UshiOni(this.scene, new THREE.Vector3(0, 515, 14000), yagBot)); 
        spawnSq(-5000, 12000, 20, 600); spawnSq(5000, 12000, 20, 600);
        
        // ミッドのミニオン
        spawnSq(-6000, 0, 30, 800); spawnSq(6000, 0, 30, 800);
        
        setTimeout(() => { this.announce("合戦開始", "敵陣を制圧せよ！", "#0ff"); }, 500);
    }
    
    startNetworkSync() {
        if(!currentLobbyId || !currentUser) return;
        const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'game_' + currentLobbyId + '_players');
        this.playersUnsub = onSnapshot(playersRef, (snap) => { snap.forEach(doc => { if (doc.id !== currentUser.uid && this.remotePlayers[doc.id]) { const data = doc.data(); this.remotePlayers[doc.id].targetPos.set(data.x, data.y, data.z); this.remotePlayers[doc.id].targetRot.set(0, data.yaw, 0, 'YXZ'); } }); });
        const actionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'game_' + currentLobbyId + '_actions');
        this.actionsUnsub = onSnapshot(actionsRef, (snap) => { snap.forEach(doc => { const data = doc.data(); if (data.uid !== currentUser.uid && !this.processedActions[doc.id]) { this.processedActions[doc.id] = true; const pos = new THREE.Vector3(data.x, data.y, data.z); const dir = new THREE.Vector3(data.dirX, data.dirY, data.dirZ); this.projectiles.push(new Projectile(this.scene, pos, dir, data.team === 0 ? '#0ff' : '#f05', data.team, data.weapon, false, WEAPON_STATS[data.weapon].damage)); } }); });
    }

    announce(t1, t2 = "", c = "#0ff") { const e1 = document.getElementById('announce1'); const e2 = document.getElementById('announce2'); e1.innerText = t1; e1.style.textShadow = `0 0 20px ${c}`; e2.innerText = t2; e2.style.textShadow = `0 0 10px ${c}`; e1.classList.remove('show-announce'); e2.classList.remove('show-announce'); void e1.offsetWidth; void e2.offsetWidth; e1.classList.add('show-announce'); e2.classList.add('show-announce'); }
    gameOver(isWin, text) { if(this.isGameOver) return; this.isGameOver = true; document.exitPointerLock(); if(this.playersUnsub) this.playersUnsub(); if(this.actionsUnsub) this.actionsUnsub(); document.getElementById('result-screen').style.display = 'flex'; const title = document.getElementById('result-title'); title.innerText = text; title.style.color = isWin ? '#0ff' : '#f00'; title.style.textShadow = isWin ? '0 0 30px #0ff' : '0 0 30px #f00'; }
    
    checkCaptureState() {
        let caps = 0; this.yaguras.forEach(y => { if(y.owner === this.myTeam || y.owner === 0) caps++; });
        if (caps > 0 && !this.enemyBase.vulnerable) { this.enemyBase.setVulnerable(); this.announce("超巨大だるま 出現！", "一撃で敵城を破壊せよ！", "#00ffff"); }
    }
    
    drawMinimap() {
        const canvas = document.getElementById('minimap'); if (!canvas) return; const ctx = canvas.getContext('2d'); const w = canvas.width; const h = canvas.height;
        ctx.clearRect(0, 0, w, h); const scale = w / (RULES.MAP_LIMIT * 2.2); const cx = w / 2; const cy = h / 2;
        ctx.beginPath(); ctx.arc(cx, cy, w/2, 0, Math.PI*2); ctx.fillStyle = 'rgba(0, 30, 40, 0.7)'; ctx.fill(); ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
        const drawPt = (pos, color, size) => { const mapX = cx + pos.x * scale; const mapZ = cy + pos.z * scale; if(Math.sqrt((mapX-cx)**2 + (mapZ-cy)**2) > w/2 - size) return; ctx.beginPath(); ctx.arc(mapX, mapZ, size, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill(); };
        
        drawPt(this.enemyBase.mesh.position, this.myTeam === 0 ? '#f00' : '#0aa', 8); drawPt(this.allyBase.mesh.position, this.myTeam === 0 ? '#0aa' : '#f00', 8);
        this.yaguras.forEach(y => drawPt(y.mesh.position, y.owner===this.myTeam || y.owner===0 ?'#0ff':'#fa0', 5));
        this.enemies.forEach(e => { if(e.active) drawPt(e.mesh.position, e.isBoss?'#fa0':'#f05', e.isBoss?5:3); });
        
        Object.values(this.remotePlayers).forEach(rp => { drawPt(rp.mesh.position, rp.team === this.myTeam ? '#0f0' : '#f00', 6); });

        const px = cx + this.player.position.x * scale; const pz = cy + this.player.position.z * scale;
        if(Math.sqrt((px-cx)**2 + (pz-cy)**2) < w/2 - 4) { ctx.save(); ctx.translate(px, pz); ctx.rotate(this.player.yaw); ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fillStyle = '#0ff'; ctx.fill(); ctx.restore(); }
    }
    
    animate() {
        requestAnimationFrame(() => this.animate()); if(this.isGameOver) return; const dt = 0.016; this.allyBase.update(dt); this.enemyBase.update(dt); const input = this.inputMgr.update(); 
        
        const groundY = this.getGroundY(this.player.position.x, this.player.position.z);
        this.player.update(dt, input, groundY);
        Object.values(this.remotePlayers).forEach(rp => rp.update(dt, this.camera));

        if (!isOfflineMode && Date.now() - this.lastSyncTime > 200 && currentLobbyId && currentUser) {
            this.lastSyncTime = Date.now();
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'game_' + currentLobbyId + '_players', currentUser.uid), { x: this.player.position.x, y: this.player.position.y, z: this.player.position.z, yaw: this.player.yaw, timestamp: Date.now() }).catch(()=>{});
        }

        if(input.a && this.player.atkCooldown <= 0 && !this.player.isReloading && this.player.ammo > 0) { 
            this.player.atkCooldown = this.player.weaponStats.cooldown; 
            if (this.player.weaponStats.ammo !== Infinity) { this.player.ammo--; if (this.player.ammo <= 0) { this.player.isReloading = true; this.player.reloadTimer = this.player.weaponStats.reload; } }
            
            this.player.viewmodel.userData.attackTimer = this.player.weaponStats.cooldown; const dir = new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion); const spawnPos = new THREE.Vector3(); spawnPos.copy(this.camera.position).add(dir.clone().multiplyScalar(5)).setY(this.camera.position.y - 2); 
            const w = this.weaponType; const wd = this.player.weaponStats.damage;
            
            const fire = (d) => { this.projectiles.push(new Projectile(this.scene, spawnPos, d, this.player.glowColor, this.myTeam, w, false, wd)); };
            if (w === 'dual_swords') { fire(dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), 0.1)); fire(dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), -0.1)); } 
            else if (w === 'fan') { fire(dir.clone()); fire(dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), 0.15)); fire(dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), -0.15)); } 
            else { fire(dir); } 
            
            createExplosion(this.scene, spawnPos, 0x00ffff, 15, 10, 300);

            if (!isOfflineMode && currentLobbyId && currentUser) {
                setDoc(doc(collection(db, 'artifacts', appId, 'public', 'data', 'game_' + currentLobbyId + '_actions')), { uid: currentUser.uid, team: this.myTeam, weapon: w, x: spawnPos.x, y: spawnPos.y, z: spawnPos.z, dirX: dir.x, dirY: dir.y, dirZ: dir.z, timestamp: Date.now() }).catch(()=>{});
            }
        }
        
        if(input.u && this.player.ult >= 100) { this.player.ult = 0; this.player.viewmodel.userData.attackTimer = 0.5; this.announce("奥義発動", "", "#f0f"); for(let i=0; i<12; i++) { const a=(i/12)*Math.PI*2; this.projectiles.push(new Projectile(this.scene, this.camera.position.clone(), new THREE.Vector3(Math.cos(a),0,Math.sin(a)), '#ff00ff', 0, 'gun', true, 15)); } }
        
        for(let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.life -= dt; if(p.life <= 0) { this.scene.remove(p.mesh); particles.splice(i, 1); continue; } const posAttr = p.mesh.geometry.attributes.position; for(let j=0; j<p.vels.length; j++) { posAttr.array[j*3]+=p.vels[j].x*dt; posAttr.array[j*3+1]+=p.vels[j].y*dt; posAttr.array[j*3+2]+=p.vels[j].z*dt; } posAttr.needsUpdate = true; p.mesh.material.opacity = p.life; }
        
        this.projectiles.forEach(p => { 
            p.update(dt); 
            if (p.team === this.myTeam) { 
                this.enemies.forEach(e => { 
                    const baseHitRad = (p.type === 'hammer' ? 70 : (p.type === 'kanabo' ? 100 : (p.type === 'dual_swords' || p.type === 'fan' ? 40 : 25)));
                    if(e.active && p.mesh.position.distanceTo(e.mesh.position) < baseHitRad * e.scale) { e.takeDamage(p.damage); p.destroy(); if(!e.active) { this.player.ult = Math.min(100, this.player.ult + (e.isBoss?30:10)); this.score += (e.isBoss?100:10); this.kills++; } } 
                }); 
                if (this.enemyBase.vulnerable && this.enemyBase.isSpawned && !this.enemyBase.blown) { 
                    const distToCenter = new THREE.Vector2(p.mesh.position.x, p.mesh.position.z).distanceTo(new THREE.Vector2(this.enemyBase.mesh.position.x, this.enemyBase.mesh.position.z));
                    const relY = p.mesh.position.y - this.enemyBase.mesh.position.y;
                    if (distToCenter < this.enemyBase.hitRadius && relY > 0 && relY < (this.enemyBase.blockCount * this.enemyBase.blockHeight)) { 
                        this.enemyBase.takeDamage(99999); p.destroy(); 
                    } 
                } 
                this.yaguras.forEach(y => { if(y.takeHit(p.mesh.position)) p.destroy(); });

                Object.values(this.remotePlayers).forEach(rp => {
                    if (rp.team !== this.myTeam && p.mesh.position.distanceTo(rp.mesh.position) < 30) { p.destroy(); createExplosion(this.scene, p.mesh.position, '#f05', 20, 10, 300); }
                });

            } else if (p.team !== this.myTeam) {
                let hitDist = 30;
                if (p.type === 'ushi_hammer') hitDist = 200;
                if (p.mesh.position.distanceTo(this.player.position) < hitDist) { this.player.takeDamage(p.damage); p.destroy(); } 
            }
        });
        
        this.yaguras.forEach(y => y.checkPlayerTouch(this.player.position));
        this.projectiles = this.projectiles.filter(p => p.active); 
        this.enemies.forEach(e => { if (e.active) e.update(dt, this.player.position, this.camera, this.player.position.y); }); 
        this.enemies = this.enemies.filter(e => e.active);
        
        if(this.shakeTimer > 0) { this.shakeTimer -= dt; this.camera.position.x += (Math.random()-0.5)*15; this.camera.position.y += (Math.random()-0.5)*15; } 
        
        this.drawMinimap();
        
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000); document.getElementById('hud-time').innerText = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
        document.getElementById('hud-lives').innerText = '🍑'.repeat(Math.max(0, this.player.lives)); 
        document.getElementById('hud-kills').innerText = `KILLS: ${this.kills}`;
        document.getElementById('player-hp-bar').style.width = `${(this.player.hp / this.player.maxHp) * 100}%`; 
        document.getElementById('player-sp-bar').style.width = `${(this.player.sp / this.player.maxSp) * 100}%`; 
        document.getElementById('player-ult-bar').style.width = `${this.player.ult}%`; document.getElementById('hud-score').innerText = this.score;
        
        const ammoText = document.getElementById('ammo-text');
        if (this.player.isReloading) { ammoText.innerText = "RELOADING"; ammoText.parentElement.classList.add('reloading-text'); } 
        else { ammoText.innerText = this.player.weaponStats.ammo === Infinity ? '∞' : this.player.ammo; ammoText.parentElement.classList.remove('reloading-text'); }
        
        if (this.composer) {
            try { this.composer.render(); } catch (err) { this.renderer.render(this.scene, this.camera); }
        } else {
            this.renderer.render(this.scene, this.camera);
        }
    }
}
</script>

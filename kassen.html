<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Share+Tech+Mono&display=swap');
body,html{margin:0;padding:0;width:100%;height:100%;background-color:#87CEEB;color:#fff;overflow:hidden;font-family:'Share Tech Mono',monospace;user-select:none;touch-action:none;}
#game-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}

.customize-panel{background:rgba(0,20,30,0.85);border:1px solid #0ff;padding:35px;width:420px;box-shadow:0 0 40px rgba(0,255,255,0.2);text-align:center;backdrop-filter:blur(10px);}
.customize-panel h1{font-family:'Noto Serif JP',serif;color:#0ff;letter-spacing:5px;margin-bottom:20px;text-shadow:0 0 10px #0ff;font-size:24px;}
.picker-group{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;text-align:left;}
.picker-item{display:flex;justify-content:space-between;align-items:center;}
.picker-item label{font-size:14px;color:#add8e6;}
select{width:100%;padding:10px;background:rgba(0,20,30,0.8);color:#0ff;border:1px solid #0ff;font-family:'Noto Serif JP',serif;font-size:14px;outline:none;}
.main-btn{background:rgba(0,255,255,0.1);color:#0ff;border:1px solid #0ff;padding:12px 20px;width:100%;font-size:16px;font-family:'Noto Serif JP',serif;cursor:pointer;transition:all 0.2s;letter-spacing:2px;}
.main-btn:hover:not(:disabled){background:#0ff;color:#000;box-shadow:0 0 20px #0ff;}
.main-btn:disabled{opacity:0.5;cursor:not-allowed;border-color:#555;color:#555;}
.sub-btn{background:transparent;color:#aaa;border:1px solid #aaa;padding:8px 15px;width:100%;font-size:14px;font-family:'Noto Serif JP',serif;cursor:pointer;transition:all 0.2s;margin-top:10px;}
.sub-btn:hover{background:#333;color:#fff;}
.lobby-list-item{display:flex;justify-content:space-between;background:rgba(0,255,255,0.05);border:1px solid rgba(0,255,255,0.3);padding:10px;margin-bottom:8px;align-items:center;}
.lobby-list-item button{background:#0ff;color:#000;border:none;padding:5px 15px;cursor:pointer;font-family:'Noto Serif JP';font-weight:bold;}
.player-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px dashed rgba(0,255,255,0.3);font-size:14px;}
.player-ready{color:#0f0;font-weight:bold;} .player-not-ready{color:#f00;font-weight:bold;}

#hud{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;}
.scanlines{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,0.25) 50%);background-size:100% 4px;opacity:0.3;}
#top-left-hud{position:absolute;top:40px;left:40px;}
.multi-diamond{position:relative;width:80px;height:80px;}
.dia-outer{position:absolute;top:0;left:0;width:100%;height:100%;border:3px solid #0ff;transform:rotate(45deg);box-shadow:0 0 15px rgba(0,255,255,0.4);}
.dia-inner{position:absolute;top:10%;left:10%;width:80%;height:80%;border:1px solid #fff;transform:rotate(45deg);background:rgba(0,30,40,0.8);display:flex;justify-content:center;align-items:center;}
.dia-inner span{transform:rotate(-45deg);font-size:24px;font-weight:bold;color:#fff;}
#minimap-container{position:absolute;top:40px;right:40px;width:180px;height:180px;border:2px solid #0ff;border-radius:50%;background:rgba(0,20,30,0.5);box-shadow:0 0 15px rgba(0,255,255,0.3);z-index:10;overflow:hidden;}
@media(max-width:900px){#minimap-container{width:120px;height:120px;top:20px;right:20px;}}
#minimap{width:100%;height:100%;display:block;}
#timer-hud{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;}
.timer-line{width:150px;height:2px;background:linear-gradient(90deg,transparent,#0ff);position:relative;}
.timer-line.right{background:linear-gradient(-90deg,transparent,#0ff);}
#hud-time{font-size:38px;font-weight:bold;color:#fff;text-shadow:0 0 15px #0ff;letter-spacing:2px;}
#bottom-left-hud{position:absolute;bottom:40px;left:40px;display:flex;flex-direction:column;gap:8px;width:350px;}
@media(max-width:900px){#bottom-left-hud{bottom:200px;width:250px;}}

.hud-icon{width:25px;text-align:center;font-size:16px;font-weight:bold;color:#0ff;}
.bar-bg{flex-grow:1;height:10px;background:rgba(0,40,50,0.6);border:1px solid rgba(0,255,255,0.4);clip-path:polygon(0 0,100% 0,98% 100%,0% 100%);}

.bar-fill.danger{background:linear-gradient(90deg,#a0a,#f0f);box-shadow:0 0 8px #f0f;}

#reticle::after{content:'';position:absolute;width:1px;height:60px;background:rgba(0,255,255,0.3);}

#enemy-hp-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.enemy-label{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0.85;}

.enemy-hp-bg{width:50px;height:5px;background:rgba(0,0,0,0.8);border:1px solid #f05;}
.enemy-hp-fill{height:100%;background:#f05;box-shadow:0 0 5px #f05;}
#announce-container{position:absolute;top:30%;left:0;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.announce-text{font-family:'Noto Serif JP',serif;font-size:4rem;font-weight:900;color:transparent;-webkit-text-stroke:1.5px #fff;text-shadow:0 0 25px #0ff;opacity:0;}
.show-announce{animation:popIn 4s forwards;}

#result-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:200;display:none;flex-direction:column;justify-content:center;align-items:center;}
#result-title{font-family:'Noto Serif JP',serif;font-size:6rem;color:#fff;text-shadow:0 0 30px #f00;margin-bottom:30px;text-align:center;letter-spacing:10px;white-space:pre-line;}
#btn-restart{background:none;border:2px solid #fff;color:#fff;padding:15px 50px;font-size:22px;cursor:pointer;font-family:'Share Tech Mono',monospace;transition:0.3s;pointer-events:auto;}
#btn-restart:hover{background:#fff;color:#000;box-shadow:0 0 20px #fff;}
#damage-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 50%,rgba(255,0,0,0.4) 100%);opacity:0;z-index:2;pointer-events:none;transition:opacity 0.1s;}
#touch-ui{display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;}
.joy-zone{position:absolute;bottom:30px;width:140px;height:140px;background:rgba(0,255,255,0.1);border:2px solid rgba(0,255,255,0.3);border-radius:50%;pointer-events:auto;}
.joy-stick{position:absolute;top:45px;left:45px;width:50px;height:50px;background:rgba(0,255,255,0.6);border-radius:50%;box-shadow:0 0 10px #0ff;}
#joy-move-zone{left:30px;} #joy-look-zone{right:200px;}
#touch-btns{position:absolute;bottom:30px;right:20px;display:grid;grid-template-columns:60px 60px 60px;gap:10px;pointer-events:auto;}
.t-btn{width:60px;height:60px;background:rgba(0,40,60,0.8);border:2px solid #0ff;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#0ff;font-weight:bold;font-family:'Share Tech Mono';font-size:12px;text-shadow:0 0 5px #0ff;box-shadow:0 0 10px rgba(0,255,255,0.3);}
.t-btn.active{background:#0ff;color:#000;box-shadow:0 0 20px #0ff;}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, onSnapshot } from 'firebase/firestore';

const firebaseConfig={apiKey:"AIzaSyDjq5pOJAea9QcaJH9s5usG-iriu2NhWp8",authDomain:"kassen-eba57.firebaseapp.com",projectId:"kassen-eba57",storageBucket:"kassen-eba57.firebasestorage.app",messagingSenderId:"148168913681",appId:"1:148168913681:web:bcff99366c0e09118ed2b0"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const appId='kassen-3v3';
let currentUser=null, currentLobbyId=null, currentLobbyData=null, lobbyUnsubscribe=null, isAuthInit=false, isOfflineMode=false;

const showError=(m)=>{const e=document.getElementById('error-toast');if(!e)return;e.innerText=m;e.style.display='block';setTimeout(()=>e.style.display='none',5000);};
const showPanel=(i)=>{['panel-setup','panel-mp-menu','panel-lobby-list','panel-lobby-room'].forEach(p=>document.getElementById(p).style.display=p===i?'flex':'none');};
const startOfflineGame=()=>{
    document.getElementById('customize-screen').style.display='none';
    const sData=SKINS[document.getElementById('preset-select').value]||SKINS['default'];
    const p={uid:"local-user",name:"YOU(OFFLINE)",skin:document.getElementById('preset-select').value,weapon:document.getElementById('weapon-select').value,team:0};
    window.gameEngine=new Engine(sData,p.weapon,0,[p],document.getElementById('low-spec-mode').checked);
};
const initAuth=async()=>{try{await signInAnonymously(auth);}catch(e){isOfflineMode=true;document.getElementById('auth-status').style.display='none';const b=document.getElementById('btn-to-mp');if(b){b.innerText="ソロプレイで出撃 (オフライン)";b.style.display='block';b.onclick=startOfflineGame;}showError("サーバー接続失敗。ソロモード起動。");}};
onAuthStateChanged(auth,(u)=>{if(isOfflineMode)return;currentUser=u;if(u&&!isAuthInit){isAuthInit=true;document.getElementById('auth-status').style.display='none';const b=document.getElementById('btn-to-mp');if(b){b.style.display='block';b.onclick=()=>showPanel('panel-mp-menu');}}});
initAuth();

document.getElementById('btn-back-setup').onclick=()=>showPanel('panel-setup'); document.getElementById('btn-back-mp').onclick=()=>showPanel('panel-mp-menu');
document.getElementById('btn-create-lobby').onclick=async()=>{if(!currentUser||isOfflineMode)return;document.getElementById('btn-create-lobby').disabled=true;try{const id='lobby_'+Math.random().toString(36).substring(2,9);await setDoc(doc(db,'artifacts',appId,'public','data','lobbies',id),{hostId:currentUser.uid,status:'waiting',players:[{uid:currentUser.uid,name:'P_'+currentUser.uid.substring(0,4),skin:document.getElementById('preset-select').value,weapon:document.getElementById('weapon-select').value,ready:true,team:0}]});await joinLobby(id);}catch(e){showError("失敗: "+e.message);document.getElementById('btn-create-lobby').disabled=false;}};
document.getElementById('btn-find-lobby').onclick=()=>{showPanel('panel-lobby-list');refreshLobbies();}; document.getElementById('btn-refresh-lobbies').onclick=()=>refreshLobbies();
const refreshLobbies=async()=>{if(!currentUser||isOfflineMode)return;document.getElementById('btn-refresh-lobbies').disabled=true;try{const sn=await getDocs(collection(db,'artifacts',appId,'public','data','lobbies'));const c=document.getElementById('lobby-list-container');c.innerHTML='';sn.forEach(d=>{const v=d.data();if(v.status==='waiting'&&v.players.length<6){const dv=document.createElement('div');dv.className='lobby-list-item';dv.innerHTML=`<span>ロビー ${d.id.substring(6,10)} [${v.players.length}/6]</span>`;const bt=document.createElement('button');bt.innerText='参加';bt.onclick=()=>joinLobby(d.id);dv.appendChild(bt);c.appendChild(dv);}});if(c.innerHTML==='')c.innerHTML='<div style="color:#aaa;text-align:center;padding:20px;">待機中なし</div>';}catch(e){}document.getElementById('btn-refresh-lobbies').disabled=false;};
const joinLobby=async(id)=>{if(!currentUser||isOfflineMode)return;const rf=doc(db,'artifacts',appId,'public','data','lobbies',id);try{const sn=await getDoc(rf);if(!sn.exists())return showError("不明なロビー");const v=sn.data();if(v.status!=='waiting')return showError("進行中");if(v.hostId!==currentUser.uid){if(!v.players.some(p=>p.uid===currentUser.uid)){if(v.players.length>=6)return showError("満員");v.players.push({uid:currentUser.uid,name:'P_'+currentUser.uid.substring(0,4),skin:document.getElementById('preset-select').value,weapon:document.getElementById('weapon-select').value,ready:false,team:v.players.length%2});await updateDoc(rf,{players:v.players});}}currentLobbyId=id;document.getElementById('room-id-display').innerText=id.substring(6,10);showPanel('panel-lobby-room');lobbyUnsubscribe=onSnapshot(rf,(ds)=>{if(!ds.exists()){leaveLobby();return;}currentLobbyData=ds.data();renderLobbyRoom(currentLobbyData);if(currentLobbyData.status==='playing'&&!window.gameEngine)startGame();});}catch(e){}};
const renderLobbyRoom=(d)=>{const c=document.getElementById('room-players-list');c.innerHTML='';let ar=true;d.players.forEach(p=>{const im=p.uid===(currentUser?currentUser.uid:"");const dv=document.createElement('div');dv.className='player-item';dv.style.color=p.team===0?'#0ff':'#f05';const rt=p.ready?'<span class="player-ready">READY</span>':'<span class="player-not-ready">WAITING</span>';if(!p.ready)ar=false;dv.innerHTML=`<span>${p.name} (${p.weapon}) ${im?'(YOU)':''}</span> ${rt}`;c.appendChild(dv);});const isH=currentUser&&d.hostId===currentUser.uid;const sb=document.getElementById('btn-start-game'),rb=document.getElementById('btn-ready');if(isH){sb.style.display='block';sb.disabled=!ar;rb.style.display='none';}else{sb.style.display='none';rb.style.display='block';const mp=d.players.find(p=>p.uid===(currentUser?currentUser.uid:""));if(mp){rb.innerText=mp.ready?"準備解除":"準備完了";rb.style.borderColor=mp.ready?"#f00":"#0f0";rb.style.color=mp.ready?"#f00":"#0f0";}}};

function createParticleTexture(){const c=document.createElement('canvas');c.width=64;c.height=64;const ctx=c.getContext('2d');const g=ctx.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.2,'rgba(255,255,200,0.8)');g.addColorStop(1,'rgba(255,200,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}

function createWaterTexture(){const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#0044aa';ctx.fillRect(0,0,256,256);ctx.fillStyle='#0066cc';for(let i=0;i<200;i++)ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*20+10,Math.random()*5+2);const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.wrapT=THREE.RepeatWrapping;return t;}

class VirtualJoystick {
    constructor(zid, sid, isL) {
        this.z=document.getElementById(zid); this.s=document.getElementById(sid); this.isL=isL; this.act=false; this.val={x:0,y:0}; this.org={x:0,y:0}; this.tId=null;
        this.z.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];this.tId=t.identifier;this.act=true;const r=this.z.getBoundingClientRect();this.org={x:r.left+r.width/2,y:r.top+r.height/2};this.upd(t.clientX,t.clientY);},{passive:false});
        this.z.addEventListener('touchmove',e=>{e.preventDefault();if(!this.act)return;for(let i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===this.tId)this.upd(e.changedTouches[i].clientX,e.changedTouches[i].clientY);},{passive:false});
        const end=e=>{for(let i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===this.tId){this.act=false;this.tId=null;this.s.style.transform=`translate(0px, 0px)`;this.val={x:0,y:0};}};
        this.z.addEventListener('touchend',end); this.z.addEventListener('touchcancel',end);
    }
    upd(x,y){let dx=x-this.org.x, dy=y-this.org.y;const mR=45,d=Math.sqrt(dx*dx+dy*dy);if(d>mR){dx=(dx/d)*mR;dy=(dy/d)*mR;}this.s.style.transform=`translate(${dx}px, ${dy}px)`;if(this.isL){this.val.x=dx*0.15;this.val.y=dy*0.15;}else{this.val.x=dx/mR;this.val.y=dy/mR;}}
}

class InputManager {
    constructor() {
        this.keys={}; this.mM={x:0,y:0}; this.lck=false; this.isT=false; this.mD=false; this.rD=false;
        window.addEventListener('keydown',e=>this.keys[e.code]=true); window.addEventListener('keyup',e=>this.keys[e.code]=false);
        window.addEventListener('mousemove',e=>{if(this.lck){this.mM.x+=(parseFloat(e.movementX)||0);this.mM.y+=(parseFloat(e.movementY)||0);}});
        window.addEventListener('mousedown',e=>{if(!this.isT&&!this.lck)document.body.requestPointerLock();else if(this.lck){if(e.button===0)this.mD=true;if(e.button===2)this.rD=true;}});
        window.addEventListener('mouseup',e=>{if(e.button===0)this.mD=false;if(e.button===2)this.rD=false;}); window.addEventListener('contextmenu',e=>e.preventDefault());
        document.addEventListener('pointerlockchange',()=>this.lck=document.pointerLockElement===document.body);
        window.addEventListener('touchstart',()=>{if(!this.isT){this.isT=true;document.getElementById('touch-ui').style.display='block';}},{once:true});
        this.jM=new VirtualJoystick('joy-move-zone','joy-move-stick',false); this.jL=new VirtualJoystick('joy-look-zone','joy-look-stick',true);
        this.b={j:false,d:false,a:false,u:false,s:false};
        const bb=(id,k)=>{const e=document.getElementById(id);e.addEventListener('touchstart',ev=>{ev.preventDefault();this.b[k]=true;e.classList.add('active');});e.addEventListener('touchend',ev=>{ev.preventDefault();this.b[k]=false;e.classList.remove('active');});};
        bb('t-btn-jump','j');bb('t-btn-dash','d');bb('t-btn-atk','a');bb('t-btn-ult','u');bb('t-btn-shield','s');
    }
    update() {
        let mx=0,my=0,lx=0,ly=0,j=false,d=false,u=false,a=this.mD,r=this.keys['KeyR'],s=this.rD;
        if(this.keys['KeyW'])my-=1;if(this.keys['KeyS'])my+=1;if(this.keys['KeyA'])mx-=1;if(this.keys['KeyD'])mx+=1;
        j=this.keys['Space'];d=this.keys['ShiftLeft'];u=this.keys['KeyQ'];
        lx=isNaN(this.mM.x)?0:this.mM.x;ly=isNaN(this.mM.y)?0:this.mM.y;this.mM={x:0,y:0};
        if(this.isT){mx+=this.jM.val.x;my+=this.jM.val.y;lx+=this.jL.val.x;ly+=this.jL.val.y;this.jL.val={x:0,y:0};j=j||this.b.j;d=d||this.b.d;a=a||this.b.a;u=u||this.b.u;s=s||this.b.s;}
        const ps=navigator.getGamepads?navigator.getGamepads():[];
        if(ps&&ps[0]){const p=ps[0];if(p.axes&&p.axes.length>=4){if(Math.abs(p.axes[0])>0.1)mx+=p.axes[0];if(Math.abs(p.axes[1])>0.1)my+=p.axes[1];if(Math.abs(p.axes[2])>0.1)lx+=p.axes[2]*25;if(Math.abs(p.axes[3])>0.1)ly+=p.axes[3]*25;}if(p.buttons){const bn=(i)=>p.buttons.length>i&&p.buttons[i].pressed;j=j||bn(0);d=d||bn(1)||bn(5);a=a||bn(7)||bn(2);u=u||bn(3);r=r||bn(2);s=s||bn(6);}}
        return {mX:mx,mY:my,lX:lx,lY:ly,j,d,a,u,r,s};
    }
}

const particles=[];
function createExplosion(sc,pos,col,cnt,sz=20,spr=600){
    if(window.gameEngine&&window.gameEngine.ls){cnt=Math.floor(cnt/5);sz*=0.8;} if(cnt<=0)return;
    const g=new THREE.BufferGeometry();const pa=new Float32Array(cnt*3);const va=[];
    for(let i=0;i<cnt;i++){pa[i*3]=pos.x;pa[i*3+1]=pos.y;pa[i*3+2]=pos.z;const th=Math.random()*Math.PI*2;const ph=Math.acos((Math.random()*2)-1);const sp=Math.random()*spr+100;va.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp,Math.sin(ph)*Math.sin(th)*sp,Math.cos(ph)*sp));}
    g.setAttribute('position',new THREE.BufferAttribute(pa,3));
    const m=new THREE.Points(g,new THREE.PointsMaterial({color:col,size:sz,map:particleTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    sc.add(m);particles.push({m:m,v:va,l:window.gameEngine&&window.gameEngine.ls?0.8:1.5});
}

    r.rotation.x=Math.PI/2;r.position.set(0,0,0.4);k.add(r);

    for(let i=0;i<40;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(0.2,1.0,4),gm);const h1=(Math.random()-0.5)*(hh-2);const a=Math.random()*Math.PI*2;const r1=1.15+(h1/(hh/2))*0.35;s.position.set(Math.cos(a)*r1,h1,Math.sin(a)*r1);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(Math.cos(a),0,Math.sin(a)).normalize());hd.add(s);}

function updateAvatarAnimation(m,spd,isG,isD,wT,dt){
    const d=m.userData;if(!d.lA)return;if(d.atk>0)d.atk-=dt;
    const t=Date.now()*0.015, br=Math.sin(Date.now()*0.003)*0.05;
    if(isD){d.bG.rotation.x=0.3;d.lL.rotation.x=-0.5;d.rL.rotation.x=0.5;if(d.dashEff)d.dashEffect.mesh.visible=true;d.bG.position.y=br*2;}
    else{
        d.bG.rotation.y=0;if(d.dashEff)d.dashEffect.mesh.visible=false;
        if(!isG){d.bG.rotation.x=-0.1;d.lL.rotation.x=-0.4;d.rL.rotation.x=0.2;if(d.atk<=0){d.lA.rotation.x=-0.8;d.rA.rotation.x=-0.8;}}
        else if(spd>10){d.bG.rotation.x=0.15;d.lL.rotation.x=Math.sin(t)*1.0;d.lL.position.y=Math.max(0,Math.cos(t))*2-3;d.rL.rotation.x=Math.sin(t+Math.PI)*1.0;d.rL.position.y=Math.max(0,Math.cos(t+Math.PI))*2-3;d.lA.rotation.x=Math.sin(t+Math.PI)*0.8;d.lA.rotation.z=0.1;if(d.atk<=0){d.rA.rotation.x=Math.sin(t)*0.8;d.rA.rotation.z=-0.1;}d.bG.rotation.z=Math.sin(t*0.5)*0.08;d.bG.position.y=Math.abs(Math.sin(t))*1.5;}
        else{d.bG.rotation.x=0;d.lL.rotation.x=0;d.rL.rotation.x=0;d.lL.position.y=-3;d.rL.position.y=-3;d.lA.rotation.x=0;d.lA.rotation.z=0.05+br;d.bG.rotation.z=0;d.bG.position.y=br*5;if(d.atk<=0){d.rA.rotation.x=0;d.rA.rotation.z=-0.05-br;}}
        if(d.atk>0){const p=d.atk/0.3,e=1-Math.pow(1-p,3);d.rA.rotation.x=-(Math.PI*1.0)*e;d.rA.rotation.z=-0.2*e;d.lA.rotation.x=-(Math.PI*1.0)*e;d.lA.rotation.z=0.2*e;}
    }
}

class Boomerang {
    constructor(sc,pos,dir,col,type,dmg,own){
        this.sc=sc;this.own=own;this.dmg=dmg;this.type=type;this.act=true;this.ret=false;this.spd=4000;this.mD=6000;
        this.sP=pos.clone();this.dir=dir.clone().normalize();this.m=createViewmodel(type,col);this.m.scale.set(2,2,2);this.m.position.copy(pos);this.sc.add(this.m);
        this.hL=new Set(); // ★ 無限爆発フリーズ防止の履歴セット
    }
    update(dt,pPos){
        if(!this.act)return;this.m.rotation.y+=dt*20;this.m.rotation.x+=dt*15;
        if(!this.ret){this.m.position.addScaledVector(this.dir,this.spd*dt);if(this.m.position.distanceTo(this.sP)>this.mD)this.ret=true;}
        else{const to=pPos.clone().sub(this.m.position).normalize();this.m.position.addScaledVector(to,this.spd*1.5*dt);if(this.m.position.distanceTo(pPos)<200)this.destroy();}
    }
    destroy(){this.act=false;this.sc.remove(this.m);}
}

        tw(-18000,-18000,0,"Top Tower A"); tw(-10000,0,0,"Mid Tower A"); tw(-18000,18000,0,"Bot Tower A");
        tw(18000,-18000,1,"Top Tower B"); tw(10000,0,1,"Mid Tower B"); tw(18000,18000,1,"Bot Tower B");
        
        const yg1=new Yagura(this.scene,new THREE.Vector3(0,0,-25000));const yg2=new Yagura(this.scene,new THREE.Vector3(0,0,25000));
        
        sSq(-10000,-18000,15,600,0,1); sSq(-8000,0,20,600,0,0); sSq(-10000,18000,15,600,0,2);
        sSq(10000,-18000,15,600,1,1); sSq(8000,0,20,600,1,0); sSq(10000,18000,15,600,1,2);
        setTimeout(()=>this.announce("合戦開始","敵タワーを破壊せよ！","#0ff"),500);
    }
    startNetworkSync(){if(!currentLobbyId||!currentUser)return;const pR=collection(db,'artifacts',appId,'public','data','game_'+currentLobbyId+'_players');this.playersUnsub=onSnapshot(pR,(sn)=>{sn.forEach(d=>{if(d.id!==currentUser.uid&&this.remotePlayers[d.id]){const dt=d.data();this.remotePlayers[d.id].tP.set(dt.x,dt.y,dt.z);this.remotePlayers[d.id].tR.set(0,dt.yaw,0,'YXZ');}});});const aR=collection(db,'artifacts',appId,'public','data','game_'+currentLobbyId+'_actions');this.actionsUnsub=onSnapshot(aR,(sn)=>{sn.forEach(d=>{const dt=d.data();if(dt.uid!==currentUser.uid&&!this.processedActions[d.id]){this.processedActions[d.id]=true;this.projectiles.push(new Projectile(this.scene,new THREE.Vector3(dt.x,dt.y,dt.z),new THREE.Vector3(dt.dirX,dt.dirY,dt.dirZ),dt.team===0?'#0ff':'#f05',dt.team,dt.weapon,false,WEAPON_STATS[dt.weapon].damage));}});});}
    announce(t1,t2="",c="#0ff"){const e1=document.getElementById('announce1'),e2=document.getElementById('announce2');e1.innerText=t1;e1.style.textShadow=`0 0 20px ${c}`;e2.innerText=t2;e2.style.textShadow=`0 0 10px ${c}`;e1.classList.remove('show-announce');e2.classList.remove('show-announce');void e1.offsetWidth;void e2.offsetWidth;e1.classList.add('show-announce');e2.classList.add('show-announce');}
    gameOver(isW,txt){if(this.isGameOver)return;this.isGameOver=true;document.exitPointerLock();if(this.playersUnsub)this.playersUnsub();if(this.actionsUnsub)this.actionsUnsub();document.getElementById('result-screen').style.display='flex';const t=document.getElementById('result-title');t.innerText=txt;t.style.color=isW?'#0ff':'#f00';t.style.textShadow=isW?'0 0 30px #0ff':'0 0 30px #f00';}
    checkCaptureState(){let eT=0,aT=0;this.towers.forEach(t=>{if(t.team!==this.myTeam&&t.act)eT++;if(t.team===this.myTeam&&t.act)aT++;});if(eT===0&&!this.enemyBase.vul){this.enemyBase.setVul();this.announce("敵の全防衛網が沈黙！","敵本陣を破壊せよ！","#0ff");}if(aT===0&&!this.allyBase.vul){this.allyBase.setVul();this.announce("味方の防衛網が全滅！","本陣を死守せよ！","#f00");}}
    drawMinimap(){const c=document.getElementById('minimap');if(!c)return;const cx=c.getContext('2d'),w=c.width,h=c.height;cx.clearRect(0,0,w,h);const sc=w/(RULES.MAP_LIMIT*2.2),cx_=w/2,cy_=h/2;cx.beginPath();cx.arc(cx_,cy_,w/2,0,Math.PI*2);cx.fillStyle='rgba(0,30,40,0.7)';cx.fill();cx.strokeStyle='#0ff';cx.lineWidth=1;cx.stroke();const dP=(p,cl,sz)=>{const mx=cx_+p.x*sc,mz=cy_+p.z*sc;if(Math.sqrt((mx-cx_)**2+(mz-cy_)**2)>w/2-sz)return;cx.beginPath();cx.arc(mx,mz,sz,0,Math.PI*2);cx.fillStyle=cl;cx.fill();};dP(this.enemyBase.m.position,this.myTeam===0?'#f00':'#0aa',8);dP(this.allyBase.m.position,this.myTeam===0?'#0aa':'#f00',8);this.towers.forEach(t=>dP(t.m.position,t.team===0?'#0ff':'#f05',5));this.enemies.forEach(e=>{if(e.act)dP(e.m.position,e.isB?'#fa0':'#f05',e.isB?5:3);});Object.values(this.remotePlayers).forEach(rp=>dP(rp.tP,rp.team===this.myTeam?'#0f0':'#f00',6));this.aiPlayers.forEach(a=>{if(a.act)dP(a.pos,a.tm===this.myTeam?'#0f0':'#f00',5);});const px=cx_+this.player.pos.x*sc,pz=cy_+this.player.pos.z*sc;if(Math.sqrt((px-cx_)**2+(pz-cy_)**2)<w/2-4){cx.save();cx.translate(px,pz);cx.rotate(this.player.yaw);cx.beginPath();cx.moveTo(0,-8);cx.lineTo(6,6);cx.lineTo(-6,6);cx.closePath();cx.fillStyle='#0ff';cx.fill();cx.restore();}}
    animate(){
        requestAnimationFrame(()=>this.animate());if(this.isGameOver)return;const dt=0.016; 
        if(this.clouds)this.clouds.forEach(c=>{c.position.x+=dt*200;if(c.position.x>60000)c.position.x=-60000;});
        this.allyBase.update(dt);this.enemyBase.update(dt);const i=this.inputMgr.update(); 
        
        let px=this.player.pos.x,pz=this.player.pos.z;if(px<-30000+12500&&Math.abs(pz)<12500)px=-30000+12500;if(px>30000-12500&&Math.abs(pz)<12500)px=30000-12500;this.player.pos.x=px;this.player.pos.z=pz;
        const gY=this.getGroundY(px,pz,this.player.pos.y);this.player.update(dt,i,gY);
        Object.values(this.remotePlayers).forEach(rp=>rp.update(dt,this.camera));
        // ★ エラーの完全修正: eng(this)をしっかり渡す
        this.aiPlayers.forEach(a=>a.update(dt,this,this.camera));
        
        if(!isOfflineMode&&Date.now()-this.lastSyncTime>200&&currentLobbyId&&currentUser){this.lastSyncTime=Date.now();setDoc(doc(db,'artifacts',appId,'public','data','game_'+currentLobbyId+'_players',currentUser.uid),{x:this.player.pos.x,y:this.player.pos.y,z:this.player.pos.z,yaw:this.player.yaw,timestamp:Date.now()}).catch(()=>{});}
        
        if(this.player.bmr){
            this.player.bmr.update(dt,this.player.pos);const bp=this.player.bmr.m.position;
            const hit=(tgt)=>{if(!this.player.bmr.hL.has(tgt)){this.player.bmr.hL.add(tgt);tgt.takeDmg?tgt.takeDmg(this.player.bmr.dmg):tgt.takeDamage(this.player.bmr.dmg);createExplosion(this.scene,bp,this.player.gCol,20,8);}};
            this.enemies.forEach(e=>{if(e.act&&bp.distanceTo(e.m.position)<300)hit(e);});
            this.aiPlayers.forEach(a=>{if(a.act&&a.tm!==this.myTeam&&bp.distanceTo(a.pos)<300)hit(a);});
            this.towers.forEach(t=>{if(t.act&&t.team!==this.myTeam&&bp.distanceTo(t.m.position)<500)hit(t);});
            if(!this.player.bmr.act){this.player.bmr=null;this.player.vm.children.forEach(c=>{if(c!==this.player.sMsh)c.visible=true;});}
        }

        if(i.s&&i.a&&this.player.aCd<=0&&this.player.sPh===1){if(!this.player.bmr){this.player.aCd=1.0;const d=new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion),sP=new THREE.Vector3().copy(this.camera.position).add(d.clone().multiplyScalar(10)).setY(this.camera.position.y-10);this.player.bmr=new Boomerang(this.scene,sP,d,this.player.gCol,this.weaponType,this.player.wSt.damage*2.5,this.player);this.player.vm.children.forEach(c=>{if(c!==this.player.sMsh)c.visible=false;});}}else if(i.a&&!i.s&&this.player.aCd<=0&&!this.player.isR&&this.player.ammo>0&&this.player.sPh===1&&!this.player.bmr){this.player.aCd=this.player.wSt.cooldown;if(this.player.wSt.ammo!==Infinity){this.player.ammo--;if(this.player.ammo<=0){this.player.isR=true;this.player.rTm=this.player.wSt.reload;}}this.player.vm.userData.atk=this.player.wSt.cooldown;const d=new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion),sP=new THREE.Vector3().copy(this.camera.position).add(d.clone().multiplyScalar(5)).setY(this.camera.position.y-2),w=this.weaponType,wd=this.player.wSt.damage;const f=(dv)=>{this.projectiles.push(new Projectile(this.scene,sP,dv,this.player.gCol,this.myTeam,w,false,wd));};if(w==='dual_swords'){f(d.clone().applyAxisAngle(new THREE.Vector3(0,1,0),0.1));f(d.clone().applyAxisAngle(new THREE.Vector3(0,1,0),-0.1));}else if(w==='fan'){f(d.clone());f(d.clone().applyAxisAngle(new THREE.Vector3(0,1,0),0.15));f(d.clone().applyAxisAngle(new THREE.Vector3(0,1,0),-0.15));}else{f(d);}createExplosion(this.scene,sP,0x0ff,15,10,300);if(!isOfflineMode&&currentLobbyId&&currentUser){setDoc(doc(collection(db,'artifacts',appId,'public','data','game_'+currentLobbyId+'_actions')),{uid:currentUser.uid,team:this.myTeam,weapon:w,x:sP.x,y:sP.y,z:sP.z,dirX:d.x,dirY:d.y,dirZ:d.z,timestamp:Date.now()}).catch(()=>{});}}
        if(i.u&&this.player.ult>=100){this.player.ult=0;this.player.vm.userData.atk=0.5;this.announce("奥義発動","","#f0f");for(let k=0;k<12;k++){const a=(k/12)*Math.PI*2;this.projectiles.push(new Projectile(this.scene,this.camera.position.clone(),new THREE.Vector3(Math.cos(a),0,Math.sin(a)),'#f0f',0,'gun',true,15));}}
        for(let k=particles.length-1;k>=0;k--){let p=particles[k];p.l-=dt;if(p.l<=0){this.scene.remove(p.m);particles.splice(k,1);continue;}const pA=p.m.geometry.attributes.position;for(let j=0;j<p.v.length;j++){pA.array[j*3]+=p.v[j].x*dt;pA.array[j*3+1]+=p.v[j].y*dt;pA.array[j*3+2]+=p.v[j].z*dt;}pA.needsUpdate=true;p.m.material.opacity=p.l;}
        
        this.projectiles.forEach(p=>{
            p.update(dt);
            if(p.m.position.x<-30000+12500&&Math.abs(p.m.position.z)<12500)p.lf=0;if(p.m.position.x>30000-12500&&Math.abs(p.m.position.z)<12500)p.lf=0;
            if(p.tm===this.myTeam){
                this.enemies.forEach(e=>{const bR=p.tp==='hammer'?70:(p.tp==='kanabo'?100:(p.tp==='dual_swords'||p.tp==='fan'?40:25));if(e.act&&p.m.position.distanceTo(e.m.position)<bR*e.scl){e.takeDamage(p.dmg);p.destroy();if(!e.act){this.player.ult=Math.min(100,this.player.ult+(e.isB?30:10));this.score+=(e.isB?100:10);this.kills++;}}});
                this.aiPlayers.forEach(a=>{if(a.act&&a.tm!==this.myTeam&&p.m.position.distanceTo(a.pos)<120){a.takeDmg(p.dmg);p.destroy();}});
                if(this.enemyBase.vul&&this.enemyBase.isS&&!this.enemyBase.blwn){const dC=new THREE.Vector2(p.m.position.x,p.m.position.z).distanceTo(new THREE.Vector2(this.enemyBase.m.position.x,this.enemyBase.m.position.z)),rY=p.m.position.y-this.enemyBase.m.position.y;if(dC<this.enemyBase.hR&&rY>0&&rY<(this.enemyBase.bCnt*this.enemyBase.bH)){this.enemyBase.takeDamage(99999);p.destroy();}}
                this.towers.forEach(t=>{if(t.team!==this.myTeam&&t.act&&p.m.position.distanceTo(t.m.position)<500){t.takeDmg(p.dmg);p.destroy();}});
            }else{
                let hD=30;if(p.tp==='ushi_hammer')hD=200;if(p.m.position.distanceTo(this.player.pos)<hD){this.player.takeDamage(p.dmg);p.destroy();}
                this.aiPlayers.forEach(a=>{if(a.tm===this.myTeam&&a.act&&p.m.position.distanceTo(a.pos)<120){a.takeDmg(p.dmg);p.destroy();}});
                this.towers.forEach(t=>{if(t.team===this.myTeam&&t.act&&p.m.position.distanceTo(t.m.position)<500){t.takeDmg(p.dmg);p.destroy();}});
            }
        });
        this.towers.forEach(t=>t.update(this.camera));this.projectiles=this.projectiles.filter(p=>p.act);
        // ★ エラー完全修正: eng(this)を確実に渡す
        this.enemies.forEach(e=>{if(e.act)e.update(dt,this.player.pos,this.camera,this.player.pos.y,this);});this.enemies=this.enemies.filter(e=>e.act);
        
        if(this.shakeTimer>0){this.shakeTimer-=dt;this.camera.position.x+=(Math.random()-0.5)*15;this.camera.position.y+=(Math.random()-0.5)*15;}
        
        this.drawMinimap();
        
        const el=Math.floor((Date.now()-this.startTime)/1000);document.getElementById('hud-time').innerText=`${String(Math.floor(el/60)).padStart(2,'0')}:${String(el%60).padStart(2,'0')}`;document.getElementById('hud-lives').innerText='🍑'.repeat(Math.max(0,this.player.lives));document.getElementById('hud-kills').innerText=`KILLS: ${this.kills}`;document.getElementById('player-hp-bar').style.width=`${(this.player.hp/this.player.mHp)*100}%`;document.getElementById('player-sp-bar').style.width=`${(this.player.sp/this.player.mSp)*100}%`;document.getElementById('player-ult-bar').style.width=`${this.player.ult}%`;document.getElementById('hud-score').innerText=this.score;
        const sH=document.getElementById('shield-hud');if(this.player.sAct){sH.innerText=`SHIELD ACTIVE | ATK: BOOMERANG`;sH.style.color='#0ff';}else if(this.player.sCd>0){sH.innerText=`SHIELD CD: ${this.player.sCd.toFixed(1)}s`;sH.style.color='#f00';}else{sH.innerText=`SHIELD (HOLD R-CLICK/BTN)`;sH.style.color='#ff0';}
        const aT=document.getElementById('ammo-text');if(this.player.isR){aT.innerText="RELOADING";aT.parentElement.classList.add('reloading-text');}else{aT.innerText=this.player.wSt.ammo===Infinity?'∞':this.player.ammo;aT.parentElement.classList.remove('reloading-text');}
        
        this.renderer.render(this.scene,this.camera);
    }
}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPISODE LUNA - チャットノベル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* メッセージ表示時のふわっと浮き上がるアニメーション */
        .fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 吹き出しのしっぽ（左・ルナ） */
        .balloon-left::before {
            content: '';
            position: absolute;
            top: 10px;
            left: -6px;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 8px solid #f3f4f6; /* bg-gray-100 */
        }

        /* 吹き出しのしっぽ（右・バーン） */
        .balloon-right::before {
            content: '';
            position: absolute;
            top: 10px;
            right: -6px;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 8px solid #0d9488; /* bg-teal-600 */
        }

        /* エンドロールのスクロールアニメーション */
        .animate-scroll {
            animation: scrollUp 45s linear forwards;
        }
        @keyframes scrollUp {
            0% { top: 100%; opacity: 1; }
            100% { top: -200%; opacity: 1; }
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>

            EPISODE LUNA

            <!-- JSでメッセージが追加される -->
        </div>

        <!-- タップ指示のフッター -->
        <div id="tap-indicator" class="absolute bottom-0 w-full pb-6 pt-12 bg-gradient-to-t from-gray-900 to-transparent pointer-events-none z-20 transition-opacity duration-300">

                    <img src="ルナ.png" alt="ル" class="w-10 h-10 rounded-full object-cover flex-shrink-0 mr-3 mt-1 shadow-md border-2 border-gray-700 bg-gray-800" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="hidden w-10 h-10 rounded-full bg-pink-500 flex-shrink-0 items-center justify-center text-white text-sm font-bold mr-3 mt-1 shadow-md border-2 border-gray-700">ル</div>
                    <div class="bg-gray-100 text-gray-900 px-4 py-3 rounded-2xl rounded-tl-sm max-w-[70%] shadow-md text-sm md:text-base relative balloon-left font-medium leading-relaxed">
                        ${data.m}
                    </div>
                `;
            }
            else if (data.t === 'b') {
                // バーン（右）
                wrapper.className += ' justify-end items-start';
                wrapper.innerHTML = `
                    <div class="bg-teal-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm max-w-[70%] shadow-md text-sm md:text-base relative balloon-right font-medium leading-relaxed">
                        ${data.m}
                    </div>
                    <img src="ギガントバーン.png" alt="バ" class="w-10 h-10 rounded-full object-cover flex-shrink-0 ml-3 mt-1 shadow-md border-2 border-gray-700 bg-gray-800" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <div class="hidden w-10 h-10 rounded-full bg-teal-500 flex-shrink-0 items-center justify-center text-white text-sm font-bold ml-3 mt-1 shadow-md border-2 border-gray-700">バ</div>
                `;
            }

            return wrapper;
        }

        function startEndroll() {
            if (isEndrollStarted) return;
            isEndrollStarted = true;

            // BGM再生
            const bgm = document.getElementById('bgm');
            bgm.play().catch(e => console.log('BGM Play Error:', e));

            // チャット画面をフェードアウト
            const mainScreen = document.getElementById('main-screen');
            mainScreen.classList.add('opacity-0');

            setTimeout(() => {
                mainScreen.style.display = 'none';
                // エンドロール表示・アニメーション開始
                const endroll = document.getElementById('endroll');
                const endrollContent = document.getElementById('endroll-content');
                endroll.classList.remove('hidden');
                endrollContent.classList.add('animate-scroll');
            }, 1000); // fade duration
        }

        function nextLine() {
            if (isAnimating) return;

            // 全て表示し終わったらエンドロールへ
            if (currentIndex >= storyData.length) {
                startEndroll();
                return;
            }

            isAnimating = true;
            const msgData = storyData[currentIndex];
            const msgElement = createMessageElement(msgData);
            
            chatContainer.appendChild(msgElement);
            currentIndex++;

            // 最後のメッセージを表示したらタップ指示のテキストを変更
            if (currentIndex >= storyData.length) {
                tapIndicator.innerHTML = '<div class="text-center animate-pulse text-teal-400 text-sm font-bold">▼ タップしてエンディングへ</div>';
            }

            // スクロールを下へ
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
                isAnimating = false;
            }, 50);
        }

        // 初期状態で1行表示
        nextLine();

        // クリック・タップイベント
        window.addEventListener('mousedown', nextLine);
        window.addEventListener('touchstart', nextLine);

    </script>
</body>
</html>
